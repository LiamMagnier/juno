name: Bug Report
description: Create a report to help us improve Juno
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue!
        Please verify first that this issue is not already reported.
        **Security vulnerabilities:** Do NOT report security issues here. Email `security@liams.dev` according to [SECURITY.md](https://github.com/LiamMagnier/juno/blob/main/SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      options:
        - Web App (Chat / UI / Canvas)
        - Backend API / Route Handler
        - Realtime Voice Relay
        - Agent & Tool Execution (Code / Work / MCP)
        - Native macOS App
        - Native iOS App
        - Database / Prisma Schema
        - Deployment / Self-Hosting
        - Documentation
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment & Context
      description: OS version, browser, node version, app commit or tag.
      placeholder: |
        - OS: [e.g. macOS 15.0 / Ubuntu 24.04]
        - Browser: [e.g. Safari 18, Chrome 130]
        - Node version: [e.g. Node 20.18.0]
        - App commit / version: [e.g. v1.9.3 or commit hash]
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: Additional Context / Logs
      description: Add any other context or console logs about the problem here.
    validations:
      required: false
