# Wave-2 native design gates (spec §9 and §14, package P0): the native half of
# PR #99. The web half lives in design-gates.yml.
#
# native-gates  The native *PerformanceTests and *SnapshotTests suites on Release
#               (Stable) builds, macOS and iOS (scripts/qa/native-perf.sh), through
#               the dedicated JunoDesktop-Wave2 / JunoMobile-Wave2 schemes.
#
# Manual only (Actions > native design gates > Run workflow). The job takes up to
# 75 macOS minutes, so running it on every pull request would break native.yml's
# macOS-minutes budget. Run it before a release or when a change touches the
# Wave2 suites. Locally: npm run qa:native-perf.
#
# Never deploys, never reads secrets, never touches production.

name: native design gates

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-design-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-gates:
    name: Native gates (Release)
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest installed Xcode
        run: |
          set -euo pipefail
          newest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$newest/Contents/Developer"
          xcodebuild -version
      - name: Install XcodeGen
        run: |
          brew update
          brew install xcodegen
      - name: Generate projects
        run: ./native/Scripts/generate-projects.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Bundle the env server required by Stable builds
        run: |
          npm ci
          npm ci --prefix runner/agent-core
          npm ci --prefix runner/env-server
          npm run env-server:bundle:mac
          test -s native/macOS/JunoDesktop/Resources/env-server/alevr-env.mjs
      - name: Performance and snapshot suites
        env:
          ALEVR_QA_REPORT_DIR: ${{ github.workspace }}/test-results/native
        run: bash scripts/qa/native-perf.sh --platform all --suite all
      - name: Publish native reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-gates-native
          path: |
            test-results/native
            !test-results/native/**/*.xcresult
          if-no-files-found: warn
      - name: Publish result bundles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-gates-native-xcresult
          path: test-results/native/*.xcresult
          if-no-files-found: ignore
          retention-days: 7

