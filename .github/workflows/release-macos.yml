# The only workflow allowed to publish a macOS artifact.  It is deliberately
# manual and protected by the `Production` environment: a source push
# must prove the code, while a human-approved release must additionally prove
# Developer ID signing and notarization.

name: macOS production release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version already committed in native/Config/Base.xcconfig (for example 0.11.1)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: macos-production-release
  cancel-in-progress: false

env:
  RELEASE_ENVIRONMENT: Production
  JUNO_NOTARY_PROFILE: juno-notary
  # A fixed path, because the diagnostics upload at the end of this file needs to
  # name it. The script's default is `/private/tmp/juno-release-$$` — a PID
  # suffix nothing outside the script can predict — so every failed run used to
  # upload an empty artifact and a green-looking upload step, which is a large
  # part of why this path stayed broken without anyone seeing an error.
  JUNO_RELEASE_DIR: /private/tmp/juno-release

jobs:
  release:
    name: notarized macOS release
    runs-on: macos-26
    # Archive, export, two notarization round trips against Apple, the full web
    # and native gate suite, then the DMG and its verification. The old cap of 40
    # minutes was shorter than this repo's own measured native CI, and a timeout
    # between `gh release create --draft` and the promotion to public leaves a
    # stuck draft that the next run's preflight then refuses.
    timeout-minutes: 120
    environment: Production
    steps:
      # The release commit is pinned at dispatch, not resolved at checkout.
      #
      # This used to check out `ref: main`. The job blocks on a Production
      # approval before any step runs, so between dispatch, approval and half an
      # hour of gates, `main` can advance — and the thing that shipped, signed,
      # notarized and tagged would be a commit no human ever approved. The
      # sibling iOS workflow already pins `github.sha`; this now matches it.
      - name: Check out the dispatched commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Pin and verify the release source commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" \
            || { echo "::error::Checked out $(git rev-parse HEAD), not the dispatched $GITHUB_SHA."; exit 1; }
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_SHA is not an ancestor of origin/main. Release only merged commits."; exit 1; }

      # A loud failure rather than the job-level `if:` this used to carry. A
      # skipped job reports the whole workflow green, with no release, no
      # artifacts, no error, and nothing telling the maintainer what to do
      # differently.
      - name: Refuse a dispatch from anywhere but main
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Dispatch this workflow from main; got $GITHUB_REF."
            exit 1
          fi

      # Ten seconds, not twenty-five minutes.
      #
      # release-macos.sh makes an authenticated `gh` a hard precondition of the
      # whole run, and this workflow never gave it a token — so every production
      # release died in the script's preflight with "The GitHub CLI is not
      # authenticated", after checkout and setup but before anything was built.
      # That is why no notarized release has ever existed. Proving it here means
      # a future regression costs a few seconds rather than a full archive.
      - name: Verify the GitHub CLI is authenticated
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh auth status --hostname github.com

      - name: Select the newest installed Xcode
        shell: bash
        run: |
          set -euo pipefail
          newest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$newest/Contents/Developer"
          xcodebuild -version

      # The project every other macOS job builds is regenerated from project.yml;
      # only this one built the committed .xcodeproj. So the app CI proved and the
      # app users installed could be built from two different project files, with
      # nothing comparing them. The script's dirty-tree gates then require the
      # regenerated project to be byte-identical to the committed one, which is
      # the drift check this was missing.
      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate projects
        run: ./native/Scripts/generate-projects.sh

      - name: Run native package tests
        shell: bash
        run: |
          set -euo pipefail
          swift test --package-path native/Packages/JunoCode --scratch-path "$RUNNER_TEMP/JunoCode-tests" -Xswiftc -warnings-as-errors
          swift test --package-path native/Packages/JunoNativeKit --scratch-path "$RUNNER_TEMP/JunoNativeKit-tests" -Xswiftc -warnings-as-errors
          swift test --package-path native/Packages/JunoWork --scratch-path "$RUNNER_TEMP/JunoWork-tests" -Xswiftc -warnings-as-errors

      - name: Install Node dependencies
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build and test the Cloud Code runner
        run: |
          npm ci --prefix runner/agent-core
          npm run build --prefix runner/agent-core
          npm test --prefix runner/agent-core

      - name: Web and contract release gates
        run: |
          npm test
          npm run lint
          npm run build
          JUNO_CHECK_LIVE_CONTRACT=1 ./scripts/release-gates.sh

      - name: Verify production signing inputs before the archive
        shell: bash
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
        run: |
          set -euo pipefail
          missing=0
          for name in \
            APPLE_DEVELOPER_ID_P12_BASE64 \
            APPLE_DEVELOPER_ID_P12_PASSWORD \
            APPLE_NOTARY_KEY_BASE64 \
            APPLE_NOTARY_KEY_ID \
            APPLE_NOTARY_ISSUER; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Production signing input $name is not configured in the protected Production environment."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

      - name: Import Developer ID certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}

      - name: Store App Store Connect notarization credentials
        shell: bash
        env:
          NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/AuthKey_${NOTARY_KEY_ID}.p8"
          printf '%s' "$NOTARY_KEY_BASE64" | base64 --decode > "$key"
          chmod 600 "$key"
          xcrun notarytool store-credentials "$JUNO_NOTARY_PROFILE" \
            --key "$key" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER"

      # Its own step, with `if: always()`. The `rm` used to be the last line of
      # the step above, under `set -e` — so any failure in `store-credentials`
      # left an App Store Connect private key on the runner, in the same
      # directory the diagnostics upload below collects from.
      - name: Remove the notarization key from the runner
        if: always()
        shell: bash
        env:
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
        run: rm -f "$RUNNER_TEMP/AuthKey_${NOTARY_KEY_ID}.p8"

      - name: Build, notarize, verify, and publish
        env:
          VERSION: ${{ inputs.version }}
          # The script's preflight refuses to publish without an authenticated
          # `gh`, and without this every run stopped there. `contents: write`
          # above is what lets this token create the release.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          native/Scripts/release-macos.sh "$VERSION" --publish

      # `warn`, not `ignore`: both paths below used to name directories the
      # script never wrote to, so a failed run uploaded nothing and said nothing
      # about it. A path that stops matching should be visible in the log.
      - name: Upload release logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-diagnostics
          # The things that explain a failure, not the build directory itself:
          # that also holds the archive, the derived data and the DMG, which are
          # gigabytes and would make the upload the slowest part of a failed run.
          path: |
            ${{ env.JUNO_RELEASE_DIR }}/notary-result*.json
            ${{ env.JUNO_RELEASE_DIR }}/export.plist
            ${{ env.JUNO_RELEASE_DIR }}/archive-dd/Logs/**
          if-no-files-found: warn
