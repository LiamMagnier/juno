# Wave-2 design gates (spec §9 and §14, package P0). Ported from PR #99 with
# its three failing checks fixed (ledger P1-5).
#
# base          The wave-2 base gate (scripts/qa/check-base.sh) on pull requests and on
#               demand: no unmerged paths, wave 1 in the history, main CI green. It
#               waits (up to 45 minutes) for main checks that are still running
#               instead of calling them "not green"; on #99 it failed on
#               "macOS app: in_progress" for a main that went on to pass.
# web-gates     The e2e/wave2 suites on a production build (scripts/qa/run-prod-e2e.sh:
#               next build + next start, never next dev) against a service Postgres
#               whose database name ends in _test. Publishes gate JSON (p50/p95),
#               screenshots and the Playwright report.
# summary       Combines the web geometry into the parity gate, then applies every
#               gate's mode (scripts/qa/gates.ts evaluate --require-enforced).
#               Report-only gates warn; a gate some package lists in its
#               e2e/wave2/<pkg>/gates.ts fails, and so does an enforced browser gate
#               that recorded nothing. External gates (platform "ci") are measured by
#               their own jobs and are not required here.
#
# The native half of #99 ("Native gates (Release)") is not on this branch; see
# scripts/qa/README.md § Native.
#
# Never deploys, never reads secrets, never touches production: the only database
# is the service container, and the runner refuses any other.

name: design gates

on:
  pull_request:
    branches: [main, integrate-wave2]
    paths:
      - "src/**"
      - "e2e/**"
      - "prisma/**"
      - "public/**"
      - "scripts/qa/**"
      - "scripts/test-prepare.mjs"
      - "playwright.config.ts"
      - "next.config.mjs"
      - "package.json"
      - "package-lock.json"
      - "tailwind.config.ts"
      - "postcss/**"
      - ".github/workflows/design-gates.yml"
  push:
    branches: [integrate-wave2]
  workflow_dispatch: {}

concurrency:
  group: design-gates-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  checks: read
  # check-base.sh reads main's combined commit status as well as its check runs.
  statuses: read

jobs:
  base:
    name: Base gate
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    # Up to 45 minutes of waiting for main's slowest check (the macOS Stable
    # build caps at 45) plus the gate itself.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          # Ancestry needs the history, not a shallow tip.
          fetch-depth: 0
      - name: Fetch main
        run: git fetch --no-tags origin main:main || git fetch --no-tags origin main
      - name: Wave-2 base gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/qa/check-base.sh --main-branch main --wait-minutes 45

  web-gates:
    name: Web gates (production build)
    runs-on: ubuntu-latest
    # #99's run took 13.7 minutes for build + 204 tests.
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
        # The runner accepts exactly postgresql://postgres@127.0.0.1:55439/<name>_test.
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      # `next build` compiles imported runner sources and the Work driver too,
      # so it needs the runner installs and the agent-core build: the same
      # preparation the unit-test shards use (scripts/test-prepare.mjs).
      - name: Prepare runner packages (npm run test:prepare)
        run: npm run test:prepare
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Wave-2 suites on a production build
        run: >-
          bash scripts/qa/run-prod-e2e.sh --package p0 --report-dir test-results/design-gates
          --
          e2e/wave2
          --project=chromium-1440 --project=chromium-390 --project=webkit-390
      - name: Publish gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-gates-web
          path: |
            test-results/design-gates
            test-results/web-geometry
            test-results/playwright-report.json
          if-no-files-found: warn
      - name: Publish screenshots and the Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-gates-screenshots
          path: |
            test-results/visual-matrix
            playwright-report
          if-no-files-found: warn

  summary:
    name: Gate summary
    needs: [web-gates]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      # Runs even when web-gates failed (`if: always()`), so the gate table is
      # printed for a red run too. A web-gates job that died before uploading
      # leaves no results: then only enforced browser gates fail here, and the
      # web-gates check itself is what reports the failure.
      - uses: actions/download-artifact@v4
        with:
          name: design-gates-web
          path: reports/web
        continue-on-error: true
      - name: Combine geometry into the parity gate
        run: |
          mkdir -p reports/combined
          npx tsx scripts/qa/gates.ts parity --out reports/combined reports/web/web-geometry
      - name: Apply gate modes
        run: |
          mkdir -p reports/web/design-gates
          npx tsx scripts/qa/gates.ts evaluate --require-enforced reports/web/design-gates reports/combined
      - name: Publish the summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-gates-summary
          path: reports/web/design-gates/summary.json
          if-no-files-found: warn
