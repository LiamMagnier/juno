# The only workflow allowed to create and upload an iOS production artifact.
# It is manual and protected by the Production environment: ordinary native CI
# proves compilation, while this job additionally proves distribution signing,
# App Store validation, and the exact TestFlight upload path.

name: iOS production release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version already committed in native/Config/Base.xcconfig (for example 0.15.4)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ios-production-release
  cancel-in-progress: false

env:
  RELEASE_ENVIRONMENT: Production

jobs:
  release:
    name: signed iOS TestFlight release
    runs-on: macos-26
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 45
    environment: Production
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Pin and verify the release source commit
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse --verify "$GITHUB_SHA^{commit}" >/dev/null
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "Publishing source commit $GITHUB_SHA"

      - name: Select the newest installed Xcode
        shell: bash
        run: |
          set -euo pipefail
          newest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$newest/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen and Node dependencies
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install native project generator
        shell: bash
        run: |
          set -euo pipefail
          brew update
          brew install xcodegen
          xcodegen --version

      - name: Run web and native release gates
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          ./scripts/release-gates.sh
          npm run design:editor:check
          npm run native:contract:check
          npm test
          npm run lint
          npm run build
          swift test --package-path native/Packages/JunoNativeKit --scratch-path "$RUNNER_TEMP/native-kit-tests" -Xswiftc -warnings-as-errors
          swift test --package-path native/Packages/JunoCode --scratch-path "$RUNNER_TEMP/native-code-tests" -Xswiftc -warnings-as-errors
          swift test --package-path native/Packages/JunoWork --scratch-path "$RUNNER_TEMP/native-work-tests" -Xswiftc -warnings-as-errors

      - name: Generate native projects and stamp build provenance
        shell: bash
        run: |
          set -euo pipefail
          ./native/Scripts/generate-projects.sh
          ./native/Scripts/write-build-metadata.sh

      - name: Build the iOS app without signing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project native/iOS/JunoMobile/JunoMobile.xcodeproj \
            -scheme JunoMobile \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/mobile-debug-dd" \
            SWIFT_COMPILATION_MODE=wholemodule \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify production App Store Connect credentials
        shell: bash
        env:
          IOS_ASC_KEY_ID: ${{ secrets.IOS_ASC_KEY_ID }}
          IOS_ASC_ISSUER_ID: ${{ secrets.IOS_ASC_ISSUER_ID }}
          IOS_ASC_PRIVATE_KEY_BASE64: ${{ secrets.IOS_ASC_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          missing=0
          for name in IOS_ASC_KEY_ID IOS_ASC_ISSUER_ID IOS_ASC_PRIVATE_KEY_BASE64; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Production iOS signing input $name is not configured in the protected Production environment."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]

      - name: Read and verify the committed version
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          configured_version="$(sed -n 's/^MARKETING_VERSION[[:space:]]*=[[:space:]]*//p' native/Config/Base.xcconfig | head -1 | tr -d '[:space:]')"
          build_number="$(sed -n 's/^CURRENT_PROJECT_VERSION[[:space:]]*=[[:space:]]*//p' native/Config/Base.xcconfig | head -1 | tr -d '[:space:]')"
          if ! [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Version must be MAJOR.MINOR.PATCH without leading zeroes."
            exit 1
          fi
          if [ "$configured_version" != "$RELEASE_VERSION" ]; then
            echo "::error::native/Config/Base.xcconfig says $configured_version, not the requested $RELEASE_VERSION. Commit the version before releasing."
            exit 1
          fi
          case "$build_number" in
            (''|*[!0-9]*) echo "::error::CURRENT_PROJECT_VERSION must be a numeric build number."; exit 1 ;;
          esac
          echo "Releasing JunoMobile $configured_version ($build_number)."

      - name: Archive and export the signed iOS app
        shell: bash
        env:
          IOS_ASC_KEY_ID: ${{ secrets.IOS_ASC_KEY_ID }}
          IOS_ASC_ISSUER_ID: ${{ secrets.IOS_ASC_ISSUER_ID }}
          IOS_ASC_PRIVATE_KEY_BASE64: ${{ secrets.IOS_ASC_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          ios_team="$(sed -n 's/^DEVELOPMENT_TEAM[[:space:]]*=[[:space:]]*//p' native/Config/Base.xcconfig | head -1 | tr -d '[:space:]')"
          [[ "$ios_team" =~ ^[A-Z0-9]{10}$ ]] || { echo "::error::Invalid DEVELOPMENT_TEAM in native/Config/Base.xcconfig."; exit 1; }
          key_path="$HOME/.appstoreconnect/private_keys/AuthKey_${IOS_ASC_KEY_ID}.p8"
          archive_path="$RUNNER_TEMP/JunoMobile.xcarchive"
          export_path="$RUNNER_TEMP/JunoMobile-export"
          export_options="$RUNNER_TEMP/JunoMobile-export-options.plist"
          mkdir -p "$(dirname "$key_path")"
          printf '%s' "$IOS_ASC_PRIVATE_KEY_BASE64" | base64 --decode > "$key_path"
          chmod 600 "$key_path"
          cat > "$export_options" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
            <dict>
              <key>method</key><string>app-store</string>
              <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$ios_team</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild \
            -project native/iOS/JunoMobile/JunoMobile.xcodeproj \
            -scheme JunoMobile \
            -configuration Stable \
            -destination 'generic/platform=iOS' \
            -archivePath "$archive_path" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$key_path" \
            -authenticationKeyID "$IOS_ASC_KEY_ID" \
            -authenticationKeyIssuerID "$IOS_ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$ios_team" \
            CODE_SIGN_STYLE=Automatic \
            archive
          xcodebuild -exportArchive \
            -archivePath "$archive_path" \
            -exportPath "$export_path" \
            -exportOptionsPlist "$export_options" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$key_path" \
            -authenticationKeyID "$IOS_ASC_KEY_ID" \
            -authenticationKeyIssuerID "$IOS_ASC_ISSUER_ID"

      - name: Validate and upload the IPA to TestFlight
        shell: bash
        env:
          IOS_ASC_KEY_ID: ${{ secrets.IOS_ASC_KEY_ID }}
          IOS_ASC_ISSUER_ID: ${{ secrets.IOS_ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          ipa="$(find "$RUNNER_TEMP/JunoMobile-export" -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          [ -n "$ipa" ] || { echo "::error::The signed export produced no IPA."; exit 1; }
          xcrun altool --validate-app -f "$ipa" --type ios --api-key "$IOS_ASC_KEY_ID" --api-issuer "$IOS_ASC_ISSUER_ID"
          xcrun altool --upload-package "$ipa" --api-key "$IOS_ASC_KEY_ID" --api-issuer "$IOS_ASC_ISSUER_ID" --wait

      - name: Remove App Store Connect key from the runner
        if: always()
        shell: bash
        env:
          IOS_ASC_KEY_ID: ${{ secrets.IOS_ASC_KEY_ID }}
        run: rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_${IOS_ASC_KEY_ID}.p8"

      - name: Upload iOS release diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-diagnostics
          path: |
            ${{ runner.temp }}/JunoMobile.xcarchive
            ${{ runner.temp }}/JunoMobile-export
            ${{ runner.temp }}/*-dd/Logs
          if-no-files-found: ignore
