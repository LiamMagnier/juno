name: Deploy to VM

# Builds on GitHub's runners (fast, lots of RAM) and ships only the build to the
# VM over SSH, so the low-RAM VM never has to run `next build` itself.

on:
  push:
    branches: [main]
  pull_request: # gate every PR on the same checks that gate main
  workflow_dispatch: {} # manual "Run workflow" button

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          # Pinned to the major the VM actually runs, NOT to the newest LTS.
          # `build-and-deploy` builds here and rsyncs the result to the VM, so
          # build-time and runtime must not diverge. Verified 2026-07-31: the VM
          # is on v20.20.2 (all three PM2 processes), its apt source is pinned to
          # deb.nodesource.com/node_20.x, and this runner resolves 20 to the same
          # v20.20.2.
          #
          # Node 20 went end-of-life in April 2026, so this pin is a stopgap.
          # Moving it forward is a THREE-part change that lands together, in
          # this order: repoint the VM's NodeSource source and upgrade it first,
          # then this file (both jobs), then package.json `engines`. Bumping only
          # this file would build on a newer major and run the result on an older
          # one.
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The UI translation catalog is generated, not tracked (predev/prebuild
      # normally do this). Typecheck imports it, so build it first.
      - name: Generate the i18n catalog
        run: npm run i18n:extract

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

  build-and-deploy:
    needs: test
    # Pull requests run the `test` job only — never a deploy.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          # Must stay equal to the `test` job's pin above, which explains why
          # this tracks the VM's Node major rather than the newest LTS.
          node-version: 20
          cache: npm

      - name: Write production .env (single source of truth = PROD_ENV secret)
        env:
          PROD_ENV: ${{ secrets.PROD_ENV }}
        run: printf '%s\n' "$PROD_ENV" > .env

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Build voice relay
        run: |
          npm ci --prefix relay
          npm run build --prefix relay

      - name: Configure SSH
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

      - name: Ship build to the VM
        env:
          VM_USER: ${{ secrets.VM_USER }}
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          # NOTE: --delete removes files on the VM absent from this checkout, so
          # every persistent runtime path MUST be excluded or it gets wiped on
          # each deploy. `.uploads` holds locally-stored user avatars/attachments
          # and `.env` holds the server secrets — losing either breaks prod.
          rsync -az --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude 'relay/node_modules' \
            --exclude '.next/cache' \
            --exclude 'logs' \
            --exclude '.uploads' \
            --exclude '.env' \
            --exclude '.env.*' \
            -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new" \
            ./ "$VM_USER@$VM_HOST:~/juno/"
          # `.env` itself is excluded from the rsync above so the VM keeps any
          # values that live ONLY on it. But PROD_ENV is the source of truth, so
          # ship EVERY key it defines and upsert them into the VM's runtime .env
          # (see merge step below): changed/rotated/new keys propagate, while
          # VM-only keys (absent from PROD_ENV) are preserved. Match real
          # assignment lines only — skip comments and blank lines.
          grep -E '^[A-Za-z_][A-Za-z0-9_]*=' .env > .env.shared || true
          scp -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new \
            .env.shared "$VM_USER@$VM_HOST:~/juno/.env.shared"

      - name: Post-deploy on the VM (install-if-changed, migrate, reload)
        env:
          VM_USER: ${{ secrets.VM_USER }}
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new \
            "$VM_USER@$VM_HOST" 'bash -s' <<'REMOTE'
          set -e
          cd ~/juno
          # Upsert every PROD_ENV key shipped alongside the build into the
          # runtime .env (replace-or-add per key), preserving any VM-only value
          # not present in PROD_ENV, so changed/new keys take effect on reload.
          # .env.bak is the pre-merge rollback.
          #
          # This MUST happen before the Prisma steps below. It used to run after
          # them, which meant every migration was applied through the .env the VM
          # already had — so a rotated DATABASE_URL migrated the OLD database and
          # only the app reload picked up the new one. Harmless while the URL
          # never changed; wrong the first time it did.
          if [ -s .env.shared ]; then
            cp .env .env.bak
            while IFS= read -r line; do
              key="${line%%=*}"
              [ -n "$key" ] || continue
              grep -v "^${key}=" .env > .env.tmp || true
              mv .env.tmp .env
              printf '%s\n' "$line" >> .env
            done < .env.shared
            rm -f .env.shared
            echo "Synced PROD_ENV keys into runtime .env (VM-only keys preserved)."
          fi
          # Prisma's migrate advisory lock doesn't survive a pooled connection:
          # a canceled deploy leaves the lock held by an orphaned session and
          # every later migrate times out with P1002. Deploys are already
          # serialized by this workflow's concurrency group, so the lock adds no
          # safety here — only that failure mode.
          export PRISMA_SCHEMA_DISABLE_ADVISORY_LOCK=1
          # Schema operations route through DIRECT_URL (see prisma/schema.prisma
          # `directUrl`) rather than the runtime pooler, because the pooled
          # connection keeps dropping the _prisma_migrations completion write and
          # leaving "failed" records that P3009-poison every later deploy (bitten
          # twice). Prisma applies directUrl on its own, so no per-command
          # DATABASE_URL override is needed.
          #
          # This used to derive the direct host by deleting "-pooler" from
          # DATABASE_URL, which only ever worked because Neon happened to name
          # its hosts that way. It is a silent no-op on any other provider — the
          # migration would quietly run over the pooler again — so the direct
          # connection is now an explicit environment variable.
          DIRECT_VALUE="$(grep -m1 '^DIRECT_URL=' .env | cut -d= -f2- | tr -d '"' | tr -d "'" | tr -d '\r')"
          case "$DIRECT_VALUE" in
            postgres*) ;;
            *)
              echo "DIRECT_URL is missing or empty in the VM .env, so Prisma has no" >&2
              echo "connection to run schema operations over. Set it in the PROD_ENV" >&2
              echo "secret (Supabase: the session pooler string, port 5432)." >&2
              exit 1
              ;;
          esac
          # Reinstall app deps only when the lockfile actually changed (rare).
          LOCK_HASH="$(sha256sum package-lock.json | awk '{print $1}')"
          if [ "$LOCK_HASH" != "$(cat ~/.juno-lock.sha 2>/dev/null || true)" ]; then
            echo "Dependencies changed — running npm ci…"
            npm ci
            echo "$LOCK_HASH" > ~/.juno-lock.sha
          else
            echo "Dependencies unchanged — skipping npm ci."
          fi
          # Relay runtime deps (small/fast) + prisma client + schema + reload.
          npm ci --omit=dev --prefix relay
          npx prisma generate
          # Historical deploys used db push and did not consistently record the
          # matching migrations. Converge that history once, then use reviewed
          # migrations exclusively on every subsequent deploy.
          if node scripts/baseline-production-migrations.mjs --status; then
            npx prisma migrate deploy
          else
            echo "Converging existing production schema with migration history…"
            npx prisma db push --skip-generate
            npx prisma db execute --file prisma/migrations/20260716200000_account_change_log/migration.sql --schema prisma/schema.prisma
            JUNO_ALLOW_MIGRATION_BASELINE=1 node scripts/baseline-production-migrations.mjs --apply
            npx prisma migrate deploy
          fi
          mkdir -p logs
          # Raise nginx header/URI buffers if still on the 8×8k default that
          # returns 414 Request-URI Too Large on long request lines / cookies.
          NGINX_SITE="/etc/nginx/sites-available/juno"
          if [ -f "$NGINX_SITE" ] && ! sudo grep -q "large_client_header_buffers" "$NGINX_SITE"; then
            echo "Patching nginx large_client_header_buffers…"
            if ! sudo grep -q "client_max_body_size" "$NGINX_SITE"; then
              sudo sed -i '/^[[:space:]]*listen 443 ssl/a\    client_max_body_size 120m;' "$NGINX_SITE"
            fi
            sudo sed -i '/client_max_body_size/a\    client_header_buffer_size 32k;\n    large_client_header_buffers 8 64k;' "$NGINX_SITE"
            if sudo nginx -t; then
              sudo systemctl reload nginx
              echo "nginx reloaded with larger header buffers."
            else
              echo "WARNING: nginx -t failed after header-buffer patch; not reloading."
            fi
          fi
          pm2 startOrReload deploy/ecosystem.config.js --update-env
          pm2 save
          echo "Deploy complete."
          REMOTE
