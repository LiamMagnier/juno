name: Deploy to VM

# Builds on GitHub's runners (fast, lots of RAM) and ships only the build to the
# VM over SSH, so the low-RAM VM never has to run `next build` itself.

on:
  push:
    branches: [main]
  pull_request: # gate every PR on the same checks that gate main
  workflow_dispatch: {} # manual "Run workflow" button

permissions:
  contents: read

# Keyed on "does this run deploy?", not on the ref.
#
# `deploy-main` was a string literal, so a push to main, a pull_request on ANY
# branch and a manual dispatch all shared one repository-wide slot and killed
# each other — 13 of the last 100 runs died that way, e.g. push run 30656648944
# cancelled 16s after an unrelated PR run on claude/nice-agnesi-0e4beb. Worse,
# `cancel-in-progress: true` applied to build-and-deploy too, which rsyncs
# --delete over the live VM tree and runs `prisma migrate deploy` against
# production: a superseding run could sever that mid-flight.
#
# Deliberately NOT `deploy-${{ github.ref }}`: all production-capable runs share
# one serialized slot, while the deploy job below separately restricts manual
# dispatches to the main branch.
# Every deploying run therefore shares one serialised slot and queues; only PR
# gating is per-branch and disposable.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('deploy-pr-{0}', github.ref) || 'deploy-vm' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    # Green runs take about 1m40s. Every job in this workflow is capped because
    # deploying runs now queue instead of cancelling one another: without a cap,
    # one hung job holds the single deploy slot for GitHub's 360-minute default.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The UI translation catalog is generated, not tracked (predev/prebuild
      # normally do this). Typecheck imports it, so build it first.
      - name: Generate the i18n catalog
        run: npm run i18n:extract

      # Same reason, one directory over: `runner/agent-core/dist` is build
      # output and gitignored, and `scripts/work-runner.ts` imports it by path.
      # The `runner` job below builds it, but that is a *different* job with a
      # different checkout, so its dist never reaches this one — leaving the
      # typecheck to fail on two unresolvable modules. Build it here too rather
      # than excluding the script, which would stop typechecking the one file
      # that drives the cloud Work executor.
      - name: Build the vendored runner core
        run: |
          npm ci --prefix runner/agent-core
          npm run build --prefix runner/agent-core

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      # Both halves of the capability manifest are generated from one JSON
      # file, so they cannot disagree — but only if the checked-in Swift is
      # actually regenerated. A stale enum is silent on the surface it matters
      # on: a client that does not recognise a degradation kind shows the user
      # nothing rather than something wrong.
      - name: Capability contract is not stale
        run: npm run capabilities:check

      # The Work vocabulary is generated into Swift from the same JSON the
      # TypeScript reads, so the two cannot disagree — but only if the
      # checked-in Swift is actually regenerated. A stale enum is silent
      # exactly where it matters: a client that does not recognise a status or
      # a degradation kind shows the user nothing rather than something wrong.
      #
      # In deploy.yml rather than only native.yml because native.yml is path
      # filtered: a commit touching only contracts/work/juno-work-v1.json or
      # src/lib/work/domain.ts would never trigger it. That is the same gap
      # the capability contract has, and there was no reason to reproduce it.
      - name: Work contract is not stale
        run: npm run work:contract:check

      # A cloud Work run has no container to sandbox a host tool in — the
      # `ToolContext.containerSandbox` field cannot even be reached from
      # `WorkSessionOptions`. One call to `withoutHostWorkspaceTools` is what
      # keeps read_file/write_file/bash off a worker that holds provider
      # credentials, and nothing fails if a later change appends a tool after
      # the filter or drops the call while adding a capability. Here rather
      # than in a test because `scripts/work-runner.ts` ends in `void main()`
      # and importing it would start a queue worker.
      - name: The cloud Work toolset admits no host tool
        run: npm run work:sandbox:check

      # The line between what a Mac may see and what everybody else may see is
      # two function names in src/lib/work/serializers.ts.
      # `serializeGrantForHost` adds the absolute path a folder grant resolved
      # to; `serializeCommandForHost` passes a command payload through
      # unfiltered, including the path the user picked in a file dialog. Both
      # are correct for the Mac that has to carry the instruction out. Both are
      # a disclosure to anything else, and "anything else" includes the phone
      # that asked for the work.
      #
      # A grep gate rather than a type-level one because only half of this is
      # expressible in the type system. `ClientWorkGrant` declares `localPath`
      # and `resolvedRealPath` as `never`, so the grant half fails to compile —
      # but the host and remote *command* shapes differ only in which JSON keys
      # survive, so both are assignable to each other and TypeScript has nothing
      # to say. The failure is also invisible in review: `serializeCommandForHost`
      # is a plausible thing to write in a route handler, it reads as deliberate,
      # and the response looks right in the browser.
      #
      # Worth having now rather than when the host routes are written: today no
      # route calls either function, because the host claim/acknowledge surface
      # does not exist yet. A gate added after those routes land is a gate added
      # after the mistake.
      #
      # Mirrored in scripts/release-gates.sh — change one, change both.
      - name: No Work route uses a host-only serialiser
        run: |
          if [ ! -d src/app/api/work ]; then
            echo "::error::src/app/api/work does not exist, so this gate is checking nothing."
            exit 1
          fi
          if hits=$(grep -rn 'serializeGrantForHost\|serializeCommandForHost' src/app/api/work); then
            echo "::error::A Work route references a host-only serialiser. Those shapes carry local filesystem paths and unfiltered command payloads to remote clients."
            printf '%s\n' "$hits"
            echo "Use serializeGrantForRemote / serializeCommandForRemote, or the unqualified serializeGrant / serializeCommand, which are bound to them."
            exit 1
          fi
          echo "No route under src/app/api/work references a host-only Work serialiser."

  # A migration whose SQL does not reproduce the schema is discovered at deploy
  # time, against the production database, with half the release already out.
  # Replaying the migrations into a throwaway Postgres and diffing the result
  # against schema.prisma finds it here instead.
  #
  # A real service container rather than `continue-on-error`: a step that cannot
  # fail is not a gate, it is a green tick.
  migrations:
    runs-on: ubuntu-latest
    # Green runs take about 1m10s.
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      # The two checks below are filesystem greps and run before `npm ci`, so a
      # migration mistake costs seconds rather than the two minutes it takes to
      # install and boot Postgres only to be told the same thing.

      # Every Work table — sessions, runs, events, approvals, grants, commands,
      # artifacts — arrives in this one migration. Prisma identifies an applied
      # migration by its directory name and stores that name in
      # _prisma_migrations, so the name is permanent: rename it and every
      # deployed database holds a row pointing at a directory that no longer
      # exists while `migrate deploy` starts treating the renamed one as new.
      # Pinning the exact name is therefore stronger than globbing for something
      # Work-shaped, not more brittle.
      - name: The Work migration is present
        run: |
          work_migration=prisma/migrations/20260805120000_work_domain/migration.sql
          if [ ! -f "$work_migration" ]; then
            echo "::error::$work_migration is missing. The Work tables would have no migration, and every Work route would fail on its first query against a freshly migrated database."
            exit 1
          fi
          echo "Found $work_migration."

      # Prisma wraps each migration file in a single transaction, and
      # CREATE INDEX CONCURRENTLY cannot run inside one. It does not fail
      # cleanly either: the usual workaround is a bare COMMIT partway through
      # the file, which leaves the migration half-applied and a failed
      # _prisma_migrations row that P3009-blocks every later deploy.
      #
      # Comments are stripped and newlines flattened before matching, because a
      # bare search for the word has two false positives that would each get
      # this gate switched off. 20260717220000_chat_first_submission_receipt
      # explains in prose why its indexes do *not* need CONCURRENTLY, and a
      # statement broken across two lines is equally valid SQL that a
      # line-oriented grep would sail past.
      - name: No migration uses CREATE INDEX CONCURRENTLY
        run: |
          offenders=""
          while IFS= read -r file; do
            if sed 's/--.*$//' "$file" | tr '\n' ' ' \
              | grep -qiE 'create[[:space:]]+(unique[[:space:]]+)?index[[:space:]]+concurrently'; then
              offenders="${offenders}${file}"$'\n'
            fi
          done < <(find prisma/migrations -type f -name '*.sql' | sort)
          if [ -n "$offenders" ]; then
            echo "::error::CREATE INDEX CONCURRENTLY cannot run inside the transaction Prisma wraps each migration file in."
            printf '%s' "$offenders"
            echo "Build the index without CONCURRENTLY, or create the table in the same migration so the index is built on an empty one."
            exit 1
          fi
          echo "No migration uses CREATE INDEX CONCURRENTLY."

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Both are required: the datasource block names DATABASE_URL *and*
      # DIRECT_URL, and `prisma validate` resolves every `env()` in it before
      # it will say anything about the schema. Without them the job fails on a
      # missing variable and never reaches the check it exists to run.
      - name: Schema is valid
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shadow
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/shadow

      # Blocking: the migrations replayed from empty must reproduce
      # `schema.prisma` exactly.
      #
      # This ran report-only for as long as it carried drift that predated it —
      # six CodeTask columns the migrations create and the schema no longer
      # declares, an Attachment index that changed uniqueness, an
      # EntityRevision default, a renamed MutationReceipt index. Reconciling
      # that was a decision about production data, not one a CI gate should
      # force, so the step stayed advisory and said so here rather than being
      # quietly dropped.
      #
      # 20260805130000_reconcile_schema_drift closes it out, so the step goes
      # back to blocking — which is the only thing that stops the next drift
      # accumulating the same way.
      #
      # The job summary is still written on the way out, so a failure reports
      # what drifted rather than only that something did.
      - name: Migrations reproduce the schema
        run: |
          set -o pipefail
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --exit-code | tee /tmp/drift.txt && DRIFT=0 || DRIFT=$?
          {
            echo "## Migration drift"
            if [ "${DRIFT:-0}" -eq 0 ]; then
              echo "Migrations reproduce \`schema.prisma\` exactly."
            else
              echo "The migrations do NOT reproduce \`schema.prisma\`:"
              echo '```'
              cat /tmp/drift.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "${DRIFT:-0}"
        env:
          SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shadow
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shadow
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/shadow

      # Every concurrency claim in src/lib/work/store.ts is an argument about
      # what Postgres does under READ COMMITTED — that a condition inside an
      # UPDATE's WHERE makes exactly one caller win, that the run's row lock
      # serialises concurrent appends, that a terminal reason is written once.
      # Claims of that shape are the ones that are wrong in a way no amount of
      # reading catches, because the two callers have to actually race.
      #
      # This job is the only one in CI with a database, which is why the suite
      # runs here rather than in `test`. It is skipped entirely unless
      # WORK_TEST_DATABASE_URL is set, so the `test` job's run of the same glob
      # neither connects to anything nor fails for the lack of it.
      # Every concurrency claim in src/lib/work/store.ts is an argument about
      # what Postgres does under READ COMMITTED — that a condition inside an
      # UPDATE's WHERE makes exactly one caller win, that the run's row lock
      # serialises concurrent appends, that a terminal reason is written once.
      # Claims of that shape are the ones that are wrong in a way no amount of
      # reading catches, because the two callers have to actually race.
      #
      # This job is the only one in CI with a database, which is why the suite
      # runs here rather than in `test`. It is skipped entirely unless
      # WORK_TEST_DATABASE_URL is set, so the `test` job's run of the same glob
      # neither connects to anything nor fails for the lack of it.
      #
      # Its own database, not the `shadow` one the step above just left full.
      # `migrate deploy` refuses a non-empty schema with P3005 — which is how
      # this first failed — and the tempting fix, letting the suite reuse
      # whatever `migrate diff` happened to leave behind, is a test that passes
      # for a reason nobody wrote down and breaks when that step is reordered.
      - name: The Work store's concurrency claims, against a real database
        run: |
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE worktest'
          npx prisma migrate deploy
          npx tsx --test tests/work-store-db.test.ts
        env:
          ADMIN_URL: postgresql://postgres:postgres@localhost:5432/shadow
          NODE_OPTIONS: --conditions=react-server
          WORK_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/worktest
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/worktest
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/worktest

      # Its own database, and its own step, for the reason the step above has
      # one: these suites seed overlapping fixture rows and share no cleanup, so
      # run together in one process against one database they fail on each
      # other rather than on the code. Named explicitly rather than globbed —
      # a glob here would silently adopt the next DB-backed suite somebody adds
      # into a database it was not written against.
      - name: The relay's dispatch claims, against a real database
        run: |
          psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE relaytest'
          npx prisma migrate deploy
          npx tsx --test tests/work-relay-dispatch.test.ts
        env:
          ADMIN_URL: postgresql://postgres:postgres@localhost:5432/shadow
          NODE_OPTIONS: --conditions=react-server
          WORK_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/relaytest
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/relaytest
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/relaytest

  # The vendored Cloud Code runner drives arbitrary agent-authored bash, so its
  # containment tests are a release gate rather than a nicety: they are what
  # prove a timed-out command cannot leave children running, and that a
  # credential in the environment is not reachable from agent shell.
  #
  # The same package now also holds the Juno Work orchestration runtime under
  # `src/work` — the budget guard, the tool-tier lattice, the plan/progress
  # checker and the untrusted-content scanner. Those are policy rather than
  # plumbing, and untested policy is a comment, so this job is the gate for them
  # too. It is deliberately not path filtered: `runner/agent-core` is outside the
  # root tsconfig, so nothing else in CI compiles it.
  runner:
    runs-on: ubuntu-latest
    # Green runs take about 20s.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install runner dependencies
        run: npm ci --prefix runner/agent-core

      - name: Build the vendored runner core
        run: npm run build --prefix runner/agent-core

      - name: Runner tests, including the adversarial containment suite
        run: npm test --prefix runner/agent-core

      # `npm test` above is `node --test dist/test/*.test.js` — the COMPILED
      # output. A suite that stops being emitted does not fail that command: the
      # shell glob simply matches fewer files and the run is still green. So a
      # `tsconfig.json` whose `include` narrows, a renamed file, or a suite moved
      # out of `src/test` all read as "all tests passed".
      #
      # That matters most for Work, whose suites are the only executable
      # statement of what the budget ceilings and the injection scanner actually
      # do. A silently absent injection test looks exactly like a passing one.
      #
      # Derived from the sources rather than hardcoded, so a module or suite
      # added next month is covered without anyone remembering this step exists.
      - name: The Work orchestration runtime and its suites reached the compiled output
        run: |
          checked=0
          missing=0
          for source in runner/agent-core/src/work/*.ts \
                        runner/agent-core/src/test/work-*.test.ts; do
            [ -f "$source" ] || continue
            checked=$((checked + 1))
            compiled="runner/agent-core/dist/${source#runner/agent-core/src/}"
            compiled="${compiled%.ts}.js"
            if [ ! -f "$compiled" ]; then
              echo "::error file=$source::did not compile to $compiled, so it was not part of the build or the test run above."
              missing=1
            fi
          done
          if [ "$checked" -eq 0 ]; then
            echo "::error::No Work orchestration sources were found under runner/agent-core/src, so this gate is checking nothing."
            exit 1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "All $checked Work orchestration sources and suites are present in dist/."

  build-and-deploy:
    needs: [test, runner, migrations]
    # Pull requests run test, migrations and runner — but never a deploy. A
    # manual dispatch is production-capable only when launched from main; the
    # ref is checked explicitly because workflow_dispatch is otherwise allowed
    # from any branch.
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    # Production secrets and deployment approval belong to the protected GitHub
    # environment, never to an unscoped repository secret.
    environment: Production
    # Deploys now queue rather than cancel each other (see `concurrency` above),
    # so a hung ssh/rsync would otherwise hold the single deploy slot for
    # GitHub's 360-minute default. Healthy runs finish well inside this.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Write production .env (single source of truth = PROD_ENV secret)
        env:
          PROD_ENV: ${{ secrets.PROD_ENV }}
        run: |
          set -euo pipefail
          if [ -z "$PROD_ENV" ]; then
            echo "::error::PROD_ENV is not configured in the protected production environment."
            exit 1
          fi
          printf '%s\n' "$PROD_ENV" > .env
          # GET /api/health reports the running build so an uptime monitor — and
          # whoever is deciding whether a rollback actually took effect — can
          # tell which commit answered. Nothing else sets it: the fallbacks in
          # the route are Vercel-only or require an npm-script parent, and PM2
          # launches from deploy/ecosystem.config.js, so without this line the
          # endpoint reports "unknown" forever.
          printf 'GIT_SHA=%s\n' "$GITHUB_SHA" >> .env

      - name: Validate production release inputs before building or shipping
        env:
          PROD_ENV: ${{ secrets.PROD_ENV }}
        run: |
          set -euo pipefail
          missing=0
          for name in DATABASE_URL DIRECT_URL AUTH_SECRET ALLOWED_ORIGINS; do
            if ! printf '%s\n' "$PROD_ENV" | grep -Eq "^${name}=.+$"; then
              echo "::error::PROD_ENV is missing required production key ${name}."
              missing=1
            fi
          done
          if ! printf '%s\n' "$PROD_ENV" | grep -Eq '^JUNO_SMOKE_TOKEN=.+$' && \
             ! printf '%s\n' "$PROD_ENV" | grep -Eq '^JUNO_SMOKE_COOKIE=.+$'; then
            echo "::error::PROD_ENV must include JUNO_SMOKE_TOKEN or JUNO_SMOKE_COOKIE for authenticated release smoke."
            missing=1
          fi
          [ "$missing" -eq 0 ]

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Build voice relay
        run: |
          npm ci --prefix relay
          npm test --prefix relay
          npm run build --prefix relay

      # The cloud Work executor imports `runner/agent-core/dist/work/index.js`
      # by path, so `dist/` has to exist on the VM or `juno-work` crash-loops on
      # its first claimed run with an unresolvable module — after the run has
      # been marked `preparing`, which looks to the user like a task that hangs.
      #
      # `dist/` is gitignored, so it reaches the VM only because the rsync below
      # ships this checkout rather than the repository. The `runner` job builds
      # the same output, but that is a different job with a different checkout
      # and its dist never leaves it.
      #
      # This is one of three parts and all three have to land together: the
      # build here, `npm ci --omit=dev --prefix runner/agent-core` in the
      # post-deploy step (node_modules is excluded from the rsync, so the
      # runtime dependencies are not shipped), and the pm2 app in
      # deploy/ecosystem.config.js. Two of the three produce a worker that looks
      # deployed and never starts.
      - name: Build the vendored runner core
        run: |
          npm ci --prefix runner/agent-core
          npm run build --prefix runner/agent-core

      - name: Configure SSH
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_KNOWN_HOSTS: ${{ secrets.VM_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [ -z "$VM_SSH_KEY" ]; then
            echo "::error::VM_SSH_KEY is not configured in the protected Production environment."
            exit 1
          fi
          if [ -z "$VM_KNOWN_HOSTS" ]; then
            echo "::error::VM_KNOWN_HOSTS is not configured; refusing unpinned SSH host-key trust."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$VM_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy
          chmod 644 ~/.ssh/known_hosts

      - name: Snapshot the current build for rollback
        # Superseded by the immutable VM transaction below. Keep this legacy
        # block in history until the first controlled cutover is complete, but
        # never execute its in-place snapshot path.
        if: ${{ false }}
        env:
          VM_USER: ${{ secrets.VM_USER }}
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          # The rsync below is `--delete` straight over the live directory, so
          # until now the previous version stopped existing the moment a deploy
          # started. Rolling back a bad release meant revert, rebuild, redeploy,
          # migrate — twenty minutes with the bad build serving throughout.
          #
          # One local copy on the VM first. Same disk, hardlinked via
          # --link-dest, so it costs seconds and almost no space instead of the
          # ~1.4 GB a plain copy would take on an always-free VM.
          #
          # The hardlink is safe because rsync writes a temp file and renames —
          # the deploy creates NEW inodes rather than truncating the ones the
          # snapshot points at. Verified. It stops being safe the moment anyone
          # adds --inplace to the deploy rsync below, which would edit the
          # snapshot's own inodes: DO NOT, or make this a plain copy first.
          #
          # Persistent paths are excluded for the same reason they are excluded
          # from the deploy rsync: node_modules and .next/cache are large and
          # rebuilt anyway, and .env/.uploads/logs must never be captured into a
          # snapshot that could later be restored over newer state.
          ssh -i ~/.ssh/id_deploy -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o StrictHostKeyChecking=yes \
            "$VM_USER@$VM_HOST" 'bash -s' <<'REMOTE'
          set -e
          if [ -d ~/juno ]; then
            mkdir -p ~/juno-previous
            rsync -a --delete --link-dest=$HOME/juno \
              --exclude '.git' \
              --exclude 'node_modules' \
              --exclude 'relay/node_modules' \
              --exclude '.next/cache' \
              --exclude 'logs' \
              --exclude '.uploads' \
              --exclude '.env' \
              --exclude '.env.*' \
              ~/juno/ ~/juno-previous/
            echo "snapshot: $(du -sh ~/juno-previous | cut -f1) in ~/juno-previous"
          else
            echo "no existing build to snapshot (first deploy)"
          fi
          REMOTE

      - name: Ship build to the VM
        if: ${{ false }}
        env:
          VM_USER: ${{ secrets.VM_USER }}
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          # NOTE: --delete removes files on the VM absent from this checkout, so
          # every persistent runtime path MUST be excluded or it gets wiped on
          # each deploy. `.uploads` holds locally-stored user avatars/attachments
          # and `.env` holds the server secrets — losing either breaks prod.
          rsync -az --delete \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude 'relay/node_modules' \
            --exclude '.next/cache' \
            --exclude 'logs' \
            --exclude '.uploads' \
            --exclude '.env' \
            --exclude '.env.*' \
            -e "ssh -i ~/.ssh/id_deploy -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=yes" \
            ./ "$VM_USER@$VM_HOST:~/juno/"
          # `.env` itself is excluded from the rsync above so the VM keeps any
          # values that live ONLY on it. But PROD_ENV is the source of truth, so
          # ship EVERY key it defines and upsert them into the VM's runtime .env
          # (see merge step below): changed/rotated/new keys propagate, while
          # VM-only keys (absent from PROD_ENV) are preserved. Match real
          # assignment lines only — skip comments and blank lines.
          grep -E '^[A-Za-z_][A-Za-z0-9_]*=' .env > .env.shared || true
          scp -i ~/.ssh/id_deploy -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o StrictHostKeyChecking=yes \
            .env.shared "$VM_USER@$VM_HOST:~/juno/.env.shared"

      - name: Post-deploy on the VM (install-if-changed, migrate, reload)
        if: ${{ false }}
        env:
          VM_USER: ${{ secrets.VM_USER }}
          VM_HOST: ${{ secrets.VM_HOST }}
          JUNO_BUILD_ROOT: ${{ github.workspace }}
        run: |
          ssh -i ~/.ssh/id_deploy -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o StrictHostKeyChecking=yes \
            "$VM_USER@$VM_HOST" "JUNO_BUILD_ROOT='$JUNO_BUILD_ROOT' bash -s" <<'REMOTE'
          set -e
          cd ~/juno
          # Upsert every PROD_ENV key shipped alongside the build into the
          # runtime .env (replace-or-add per key), preserving any VM-only value
          # not present in PROD_ENV, so changed/new keys take effect on reload.
          # .env.bak is the pre-merge rollback.
          #
          # This MUST happen before the Prisma steps below. It used to run after
          # them, which meant every migration was applied through the .env the VM
          # already had — so a rotated DATABASE_URL migrated the OLD database and
          # only the app reload picked up the new one. Harmless while the URL
          # never changed; wrong the first time it did.
          if [ -s .env.shared ]; then
            if [ -f .env ]; then
              cp .env .env.bak
            else
              : > .env
              chmod 600 .env
            fi
            while IFS= read -r line; do
              key="${line%%=*}"
              [ -n "$key" ] || continue
              grep -v "^${key}=" .env > .env.tmp || true
              mv .env.tmp .env
              printf '%s\n' "$line" >> .env
            done < .env.shared
            rm -f .env.shared
            echo "Synced PROD_ENV keys into runtime .env (VM-only keys preserved)."
          fi
          # Prisma's migrate advisory lock doesn't survive a pooled connection:
          # a canceled deploy leaves the lock held by an orphaned session and
          # every later migrate times out with P1002. Deploys are already
          # serialized by this workflow's concurrency group, so the lock adds no
          # safety here — only that failure mode.
          export PRISMA_SCHEMA_DISABLE_ADVISORY_LOCK=1
          # Schema operations route through DIRECT_URL (see prisma/schema.prisma
          # `directUrl`) rather than the runtime pooler, because the pooled
          # connection keeps dropping the _prisma_migrations completion write and
          # leaving "failed" records that P3009-poison every later deploy (bitten
          # twice). Prisma applies directUrl on its own, so no per-command
          # DATABASE_URL override is needed.
          #
          # This used to derive the direct host by deleting "-pooler" from
          # DATABASE_URL, which only ever worked because Neon happened to name
          # its hosts that way. It is a silent no-op on any other provider — the
          # migration would quietly run over the pooler again — so the direct
          # connection is now an explicit environment variable.
          DIRECT_VALUE="$(grep -m1 '^DIRECT_URL=' .env | cut -d= -f2- | tr -d '"' | tr -d "'" | tr -d '\r')"
          case "$DIRECT_VALUE" in
            postgres*) ;;
            *)
              echo "DIRECT_URL is missing or empty in the VM .env, so Prisma has no" >&2
              echo "connection to run schema operations over. Set it in the PROD_ENV" >&2
              echo "secret (Supabase: the session pooler string, port 5432)." >&2
              exit 1
              ;;
          esac
          # Reinstall app deps only when the lockfile actually changed (rare).
          LOCK_HASH="$(sha256sum package-lock.json | awk '{print $1}')"
          if [ "$LOCK_HASH" != "$(cat ~/.juno-lock.sha 2>/dev/null || true)" ]; then
            echo "Dependencies changed — running npm ci…"
            npm ci
            echo "$LOCK_HASH" > ~/.juno-lock.sha
          else
            echo "Dependencies unchanged — skipping npm ci."
          fi
          # Relay runtime deps (small/fast) + prisma client + schema + reload.
          npm ci --omit=dev --prefix relay
          # The vendored runner core's own runtime dependencies. `dist/` was
          # built in CI and shipped with the build, but `node_modules` is
          # excluded from the rsync above at every level, so without this the
          # compiled output is on the VM and the packages it imports are not —
          # and juno-work dies on `require('fast-glob')` the first time an agent
          # calls the glob tool, mid-run, with the lease still held.
          npm ci --omit=dev --prefix runner/agent-core
          npx prisma generate
          # Production deploys are fail-closed: an unverified migration history
          # requires a separately controlled baseline operation and can never
          # silently mutate the schema through `prisma db push`.
          if ! node scripts/baseline-production-migrations.mjs --status; then
            echo "::error::Production migration history is not converged. Run the separately controlled baseline procedure before deploying."
            exit 1
          fi
          npx prisma migrate deploy
          # Next's React Server manifests record absolute module paths. The
          # build runs in GitHub's checkout, while the VM serves from ~/juno;
          # without this normalization a page render asks Node to load a
          # module from /home/runner/work/... and returns HTTP 500. Keep the
          # rewrite on the VM, alongside the artifact it repairs, so local
          # and hosted deploys use the same path-safe handoff.
          if [ -n "${JUNO_BUILD_ROOT:-}" ] && [ -d .next ]; then
            while IFS= read -r -d '' file; do
              if grep -Iq -- "$JUNO_BUILD_ROOT" "$file"; then
                JUNO_BUILD_ROOT="$JUNO_BUILD_ROOT" \
                  JUNO_RUNTIME_ROOT="$PWD" \
                  perl -pi -e 's/\Q$ENV{JUNO_BUILD_ROOT}\E/$ENV{JUNO_RUNTIME_ROOT}/g' "$file"
              fi
            done < <(find .next -path './.next/cache' -prune -o -type f -print0)
            echo "Normalized Next build paths from $JUNO_BUILD_ROOT to $PWD."
          fi
          mkdir -p logs
          # Raise nginx header/URI buffers if still on the 8×8k default that
          # returns 414 Request-URI Too Large on long request lines / cookies.
          NGINX_SITE="/etc/nginx/sites-available/juno"
          if [ -f "$NGINX_SITE" ]; then
            NGINX_BACKUP="$(mktemp)"
            sudo cp "$NGINX_SITE" "$NGINX_BACKUP"
            restore_nginx_config() {
              sudo cp "$NGINX_BACKUP" "$NGINX_SITE" || true
              rm -f "$NGINX_BACKUP"
            }
            nginx_changed=0
            if ! sudo grep -q "client_max_body_size" "$NGINX_SITE"; then
              echo "Patching nginx client_max_body_size…"
              if ! sudo sed -i '/^[[:space:]]*listen 443 ssl/a\    client_max_body_size 120m;' "$NGINX_SITE"; then
                echo "::error::Could not patch nginx; restoring the previous site configuration and aborting the deploy." >&2
                restore_nginx_config
                exit 1
              fi
              nginx_changed=1
            fi
            if ! sudo grep -q "large_client_header_buffers" "$NGINX_SITE"; then
              echo "Patching nginx large_client_header_buffers…"
              if ! sudo sed -i '/client_max_body_size/a\    client_header_buffer_size 32k;\n    large_client_header_buffers 8 64k;' "$NGINX_SITE"; then
                echo "::error::Could not patch nginx header buffers; restoring the previous site configuration and aborting the deploy." >&2
                restore_nginx_config
                exit 1
              fi
              nginx_changed=1
            fi
            if ! sudo nginx -t; then
              echo "::error::nginx -t failed; restoring the previous site configuration and aborting the deploy." >&2
              restore_nginx_config
              exit 1
            fi
            if [ "$nginx_changed" -eq 1 ]; then
              if ! sudo systemctl reload nginx; then
                echo "::error::nginx reload failed; restoring the previous site configuration and aborting the deploy." >&2
                restore_nginx_config
                exit 1
              fi
              echo "nginx validated and reloaded with the required request buffers."
            fi
            rm -f "$NGINX_BACKUP"
          fi
          pm2 startOrReload deploy/ecosystem.config.js --update-env
          pm2 save
          EXPECTED_PM2='["juno-backend","juno-scheduler","juno-work","juno-work-scheduler","juno-research","juno-work-triggers","juno-import-recovery","juno-code-sweeper","juno-voice-relay"]'
          pm2 jlist | EXPECTED_PM2="$EXPECTED_PM2" node -e '
            let input = "";
            process.stdin.on("data", (chunk) => { input += chunk; });
            process.stdin.on("end", () => {
              let rows;
              try { rows = JSON.parse(input); } catch (error) {
                console.error(`Could not parse pm2 jlist: ${error.message}`);
                process.exit(1);
              }
              const expected = JSON.parse(process.env.EXPECTED_PM2);
              const missing = expected.filter((name) => !rows.some((row) => row.name === name && row.pm2_env?.status === "online"));
              if (missing.length) {
                console.error(`PM2 services are not online: ${missing.join(", ")}`);
                process.exit(1);
              }
              console.log(`PM2 ecosystem healthy: ${expected.join(", ")}`);
            });
          '
          echo "Deploy complete."
          REMOTE

      - name: Deploy the exact reviewed commit through the immutable VM transaction
        env:
          VM_USER: ${{ secrets.VM_USER }}
          VM_HOST: ${{ secrets.VM_HOST }}
          PROD_ENV: ${{ secrets.PROD_ENV }}
          GITHUB_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          bundle="juno-${GITHUB_SHA}.bundle"
          remote_env="juno-${RUN_ID}.env"
          umask 077
          git bundle create "$bundle" "$GITHUB_SHA"
          git bundle verify "$bundle"
          printf '%s\n' "$PROD_ENV" > "$remote_env"
          scp -i ~/.ssh/id_deploy -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o StrictHostKeyChecking=yes \
            "$bundle" "$remote_env" "$VM_USER@$VM_HOST:/tmp/"
          ssh -i ~/.ssh/id_deploy -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o StrictHostKeyChecking=yes \
            "$VM_USER@$VM_HOST" "GITHUB_SHA='$GITHUB_SHA' RUN_ID='$RUN_ID' bash -s" <<'REMOTE'
          set -euo pipefail
          SOURCE_ROOT="$HOME/juno-source"
          LIVE_ROOT="$HOME/juno"
          BUNDLE="/tmp/juno-${GITHUB_SHA}.bundle"
          REMOTE_ENV="/tmp/juno-${RUN_ID}.env"
          INCOMING_ENV="$LIVE_ROOT/.env.incoming-${RUN_ID}"
          cleanup() {
            rm -f -- "$BUNDLE" "$REMOTE_ENV" "$INCOMING_ENV"
          }
          trap cleanup EXIT
          [ -d "$LIVE_ROOT" ] || { echo "::error::Live root $LIVE_ROOT is missing." >&2; exit 1; }
          if [ -e "$SOURCE_ROOT" ] && [ ! -d "$SOURCE_ROOT/.git" ]; then
            echo "::error::Source mirror $SOURCE_ROOT exists without a Git checkout." >&2
            exit 1
          fi
          if [ ! -d "$SOURCE_ROOT/.git" ]; then
            mkdir -p "$SOURCE_ROOT"
            git init "$SOURCE_ROOT" >/dev/null
          fi
          if [ -n "$(git -C "$SOURCE_ROOT" status --porcelain)" ]; then
            echo "::error::Source mirror has uncommitted changes; refusing deployment." >&2
            exit 1
          fi
          git -C "$SOURCE_ROOT" fetch --no-tags "$BUNDLE" "$GITHUB_SHA"
          git -C "$SOURCE_ROOT" checkout --detach "$GITHUB_SHA"
          install -m 600 "$REMOTE_ENV" "$INCOMING_ENV"
          JUNO_APP_HOME="$SOURCE_ROOT" \
            JUNO_RELEASES_DIR="$LIVE_ROOT/releases" \
            JUNO_CURRENT_LINK="$LIVE_ROOT/current" \
            JUNO_PREVIOUS_LINK="$LIVE_ROOT/previous" \
            JUNO_INITIAL_RELEASE_TARGET="$LIVE_ROOT" \
            JUNO_ENV_FILE="$INCOMING_ENV" \
            JUNO_DEPLOY_REF="$GITHUB_SHA" \
            JUNO_DEPLOY_BUNDLE="$BUNDLE" \
            bash "$SOURCE_ROOT/deploy/deploy.sh"
          sudo nginx -t
          install -m 600 "$INCOMING_ENV" "$LIVE_ROOT/.env"
          echo "Immutable release transaction complete for $GITHUB_SHA."
          REMOTE
          rm -f -- "$bundle" "$remote_env"

      - name: Verify production health and version
        env:
          VM_USER: ${{ secrets.VM_USER }}
          VM_HOST: ${{ secrets.VM_HOST }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/id_deploy -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o StrictHostKeyChecking=yes \
            "$VM_USER@$VM_HOST" "EXPECTED_SHA='$EXPECTED_SHA' bash -s" <<'REMOTE'
          set -e
          # Read the public origin from the same runtime env the app uses. Keep
          # a safe production default for older VMs that predate this key.
          APP_URL="$(grep -m1 '^NEXT_PUBLIC_APP_URL=' ~/juno/.env | cut -d= -f2- | tr -d '\"' | tr -d "'" | tr -d '\r' || true)"
          APP_URL="${APP_URL%/}"
          [ -n "$APP_URL" ] || APP_URL="https://chat.liams.dev"

          for attempt in $(seq 1 30); do
            body="$(curl --silent --show-error --max-time 12 "$APP_URL/api/health" 2>/dev/null || true)"
            if printf '%s' "$body" | grep -Fq '"ok":true' && \
              printf '%s' "$body" | grep -Fq "\"version\":\"$EXPECTED_SHA\""; then
              echo "Production is healthy on $EXPECTED_SHA (attempt $attempt)."
              exit 0
            fi
            echo "Waiting for $APP_URL/api/health to report $EXPECTED_SHA (attempt $attempt/30): ${body:-no response}"
            sleep 5
          done

          echo "::error::Production did not become healthy on $EXPECTED_SHA. The previous build is preserved in ~/juno-previous for rollback."
          pm2 status || true
          exit 1
          REMOTE

      # The VM-local check above proves that the process can answer from its
      # own network namespace. This independent runner check proves public DNS,
      # TLS, nginx, firewall reachability, and the version actually visible to
      # users outside the VM.
      - name: Verify public production health externally
        env:
          EXPECTED_SHA: ${{ github.sha }}
          PUBLIC_APP_URL: https://chat.liams.dev
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            body="$(curl --fail --silent --show-error --max-time 12 "$PUBLIC_APP_URL/api/health" || true)"
            if printf '%s' "$body" | grep -Fq '"ok":true' && \
              printf '%s' "$body" | grep -Fq "\"version\":\"$EXPECTED_SHA\""; then
              echo "Public production is healthy on $EXPECTED_SHA (attempt $attempt)."
              JUNO_PUBLIC_UI_BASE_URL="$PUBLIC_APP_URL" node scripts/public-ui-smoke.mjs
              exit 0
            fi
            echo "Waiting for public $PUBLIC_APP_URL/api/health to report $EXPECTED_SHA (attempt $attempt/30): ${body:-no response}"
            sleep 5
          done
          echo "::error::Public production did not become healthy on $EXPECTED_SHA."
          exit 1

      - name: Run authenticated production smoke
        env:
          VM_USER: ${{ secrets.VM_USER }}
          VM_HOST: ${{ secrets.VM_HOST }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/id_deploy -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o StrictHostKeyChecking=yes \
            "$VM_USER@$VM_HOST" "EXPECTED_SHA='$EXPECTED_SHA' bash -s" <<'REMOTE'
          set -e
          APP_URL="$(grep -m1 '^NEXT_PUBLIC_APP_URL=' ~/juno/.env | cut -d= -f2- | tr -d '\"' | tr -d "'" | tr -d '\r' || true)"
          APP_URL="${APP_URL%/}"
          [ -n "$APP_URL" ] || APP_URL="https://chat.liams.dev"
          SMOKE_TOKEN="$(grep -m1 '^JUNO_SMOKE_TOKEN=' ~/juno/.env | cut -d= -f2- | tr -d '\"' | tr -d "'" | tr -d '\r' || true)"
          SMOKE_COOKIE="$(grep -m1 '^JUNO_SMOKE_COOKIE=' ~/juno/.env | cut -d= -f2- | tr -d '\"' | tr -d "'" | tr -d '\r' || true)"
          JUNO_SMOKE_BASE_URL="$APP_URL" \
            JUNO_SMOKE_EXPECTED_SHA="$EXPECTED_SHA" \
            JUNO_SMOKE_REQUIRE_AUTH=1 \
            JUNO_SMOKE_TOKEN="$SMOKE_TOKEN" \
            JUNO_SMOKE_COOKIE="$SMOKE_COOKIE" \
            JUNO_SMOKE_RUN_CHAT=1 \
            node ~/juno/scripts/production-smoke.mjs
          JUNO_PUBLIC_UI_BASE_URL="$APP_URL" \
            node ~/juno/scripts/public-ui-smoke.mjs
          REMOTE

      # A failed post-deploy check must not leave a bad application active.
      # This restores the prior code snapshot and reloads every process. It
      # intentionally does not pretend that an already-applied database
      # migration is reversible; migration compatibility remains a release
      # design requirement and the failed run is still surfaced to operators.
      - name: Roll back failed application release
        if: failure()
        env:
          VM_USER: ${{ secrets.VM_USER }}
          VM_HOST: ${{ secrets.VM_HOST }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -o UserKnownHostsFile="$HOME/.ssh/known_hosts" -o StrictHostKeyChecking=yes \
            "$VM_USER@$VM_HOST" "RUN_ID='$RUN_ID' bash -s" <<'REMOTE'
          set -euo pipefail
          SOURCE_ROOT="$HOME/juno-source"
          LIVE_ROOT="$HOME/juno"
          JUNO_APP_HOME="$SOURCE_ROOT" \
            JUNO_RELEASES_DIR="$LIVE_ROOT/releases" \
            JUNO_CURRENT_LINK="$LIVE_ROOT/current" \
            JUNO_PREVIOUS_LINK="$LIVE_ROOT/previous" \
            JUNO_INITIAL_RELEASE_TARGET="$LIVE_ROOT" \
            JUNO_ENV_FILE="$LIVE_ROOT/.env" \
            bash "$SOURCE_ROOT/deploy/deploy.sh" --rollback
          echo "Rolled back the immutable application pointer; database state was not rewound."
          REMOTE
