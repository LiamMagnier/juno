# Gates for the native Swift surface: the shared packages, the generated API
# contract, the macOS app and the iPhone app.
#
# Before this workflow existed, nothing in CI compiled or tested any native code
# — `deploy.yml`, `code-runner.yml` and `sync-models.yml` all cover the web
# surface only. Every native regression had to be caught by hand on a developer's
# Mac, which is how a target that no longer exists stayed referenced in the
# release script.
#
# The package jobs are the cheap, fast signal and run on every push. The app
# builds need a specific Xcode, so they declare it and fail loudly when the
# runner cannot provide it, rather than silently reporting green.

name: native

on:
  push:
    branches: [main]
    paths:
      - "native/**"
      - "contracts/**"
      - "scripts/check-native-swift-contract.mjs"
      - "scripts/generate-native-swift-contract.mjs"
      - "scripts/check-native-design*.mjs"
      - "scripts/check-native-type.mjs"
      - "scripts/check-native-motion.mjs"
      - "scripts/check-native-glass.mjs"
      - "scripts/check-native-targets.mjs"
      - "scripts/check-native-design-baseline.json"
      - ".github/workflows/native.yml"
  pull_request:
    paths:
      - "native/**"
      - "contracts/**"
      - "scripts/check-native-swift-contract.mjs"
      - "scripts/generate-native-swift-contract.mjs"
      - "scripts/check-native-design*.mjs"
      - "scripts/check-native-type.mjs"
      - "scripts/check-native-motion.mjs"
      - "scripts/check-native-glass.mjs"
      - "scripts/check-native-targets.mjs"
      - "scripts/check-native-design-baseline.json"
      - ".github/workflows/native.yml"
  workflow_dispatch:

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

env:
  # The macOS app's deployment floor is macOS 26 (Liquid Glass), so the SDK has
  # to be at least that. Bump both values together when the floor moves.
  REQUIRED_XCODE_MAJOR: "26"
  DEVELOPMENT_TEAM: "58PVP763WX"

jobs:
  # ---------------------------------------------------------------------------
  # The generated Swift contract must match the canonical OpenAPI document.
  # Runs on Linux because it is pure Node — no Xcode needed.
  # ---------------------------------------------------------------------------
  contract:
    name: API contract
    runs-on: ubuntu-latest
    # Observed max 91s. Caps bound execution only, not time spent queueing for a
    # runner — they exist so the intermittent Swift hang below cannot burn
    # GitHub's 360-minute default and starve the 5 macOS slots.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Contract has not drifted
        run: npm run native:contract:check

      # The Swift design tokens are a projection of globals.css, not a second
      # copy of it. Before this, the projection was done by hand and nothing
      # re-checked it — so a colour changed on the web stayed unchanged on the
      # Mac until somebody noticed by eye, which is how the two clients came to
      # look like different products.
      - name: Design tokens have not drifted
        run: npm run design:tokens:check

  # ---------------------------------------------------------------------------
  # The four design rules from docs/native/REWORK_PLAN.md, as build failures.
  #
  # Its own job rather than a fifth step on `contract`, because the point of these
  # is that a reviewer can fail a change against a NAMED rule — a red check called
  # "Design rules" says which principle broke, where a red "API contract" would
  # not. It is pure Node on Linux and takes about a second; the runner spin-up is
  # the whole cost.
  #
  # Each gate RATCHETS. It records the tree's current violation count in
  # scripts/check-native-design-baseline.json and fails only when the count goes
  # UP. That is not a softening: a hard gate against a tree that already holds
  # hundreds of frozen font sizes is a gate somebody switches off in week one, and
  # a switched-off gate leaves a green check where a measurement used to be. The
  # number is only ever allowed to travel downwards, and a lane that migrates a
  # surface re-records the baseline in the same commit.
  # ---------------------------------------------------------------------------
  design:
    name: Design rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # No `npm ci`: these four scripts import nothing outside `node:*`, so the
      # install would be the entire runtime of the job.
      - name: Glass, motion, type and targets have not regressed
        run: npm run native:design:check

  # ---------------------------------------------------------------------------
  # The shared packages, under the same strict-concurrency, warnings-as-errors
  # settings the release gates use. `--scratch-path` is deliberately outside the
  # checkout: a `.build` directory inside a File Provider-backed tree picks up
  # resource forks that break product signing.
  #
  # `macos-26`, not `macos-15`, and the same for both app jobs below. The image
  # ships Xcode 26.3, and this project's deployment floor requires it — but a
  # macOS 15 runner then *runs* what that SDK produced, and its SwiftUI has no
  # `_TagTraitWritingModifier`, which is what `.tag()` now lowers to. The test
  # bundle built fine and failed at `dlopen`. Building against one OS's SDK and
  # running on an older OS is the whole bug; matching them is the fix.
  # ---------------------------------------------------------------------------
  packages:
    name: Swift packages
    runs-on: macos-26
    # Observed 54s–2m33s. This is the JunoNativeKit job that hangs
    # intermittently — seen sitting 45 minutes with no progress, where a plain
    # re-run of the same commit then passed in about 1m45s.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # JunoWork is the local-Work engine. Added here rather than left to the
        # app builds because a package outside this matrix is never built or
        # tested by CI at all — the matrix is the whole gate for the packages.
        package: [JunoNativeKit, JunoCode, JunoWork]
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest installed Xcode
        run: |
          set -euo pipefail
          newest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $newest"
          sudo xcode-select -s "$newest/Contents/Developer"
          xcodebuild -version

      - name: Test ${{ matrix.package }}
        run: |
          swift test \
            --package-path native/Packages/${{ matrix.package }} \
            --scratch-path "$RUNNER_TEMP/${{ matrix.package }}-tests" \
            -Xswiftc -warnings-as-errors

  # ---------------------------------------------------------------------------
  # The macOS app. Unsigned: this job verifies that the app compiles, not that it
  # runs. Anything exercising auth, the Keychain or an authenticated screen needs
  # a signed build and is covered by the release gates on a developer machine —
  # see docs/native/TESTING.md, which explains why an unsigned build tests the
  # failure path.
  # ---------------------------------------------------------------------------
  macos-app:
    name: macOS app
    runs-on: macos-26
    # Observed max 17m25s, so 30 would leave under a 2x margin.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Require an Xcode new enough for the deployment floor
        run: |
          set -euo pipefail
          newest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$newest/Contents/Developer"
          # Captured once, then parsed from the variable — never piped into
          # `head`. `head` closes the pipe after the first line, `xcodebuild`
          # writes into it anyway and dies with an uncaught
          # NSFileHandleOperationException ("Broken pipe"), and under `pipefail`
          # that non-zero status fails the whole pipeline. So this step reported
          # a version gate FAILURE on a runner that satisfied it — Xcode 26.6
          # against a floor of 26. `native/Scripts/release-macos.sh` carries the
          # same warning about `codesign | grep -q` for the same reason.
          version=$(xcodebuild -version)
          printf '%s\n' "$version"
          major=$(printf '%s\n' "$version" | sed -n -E '1s/Xcode ([0-9]+).*/\1/p')
          if [ "$major" -lt "$REQUIRED_XCODE_MAJOR" ]; then
            echo "::error::JunoDesktop targets macOS $REQUIRED_XCODE_MAJOR and needs Xcode $REQUIRED_XCODE_MAJOR or newer; this runner has Xcode $major."
            echo "::error::Pin a runner image that ships it, or lower MACOSX_DEPLOYMENT_TARGET (which would remove Liquid Glass)."
            exit 1
          fi

      - name: Install XcodeGen
        # `brew update` first: the runner image ships a pinned Homebrew whose
        # formula was 2.45.4, while both project specs require 2.46.0, so a bare
        # `brew install` produced "XcodeGen version is 2.45.4, but minimum
        # required version specified as 2.46.0" and failed generation before any
        # code was compiled.
        run: |
          brew update
          brew install xcodegen
          xcodegen --version

      - name: Generate projects
        run: ./native/Scripts/generate-projects.sh

      - name: Build JunoDesktop (Debug, strict)
        run: |
          xcodebuild \
            -project native/macOS/JunoDesktop/JunoDesktop.xcodeproj \
            -scheme JunoDesktop \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/desktop-dd" \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build JunoDesktop (Stable, strict)
        run: |
          xcodebuild \
            -project native/macOS/JunoDesktop/JunoDesktop.xcodeproj \
            -scheme JunoDesktop \
            -configuration Stable \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/desktop-stable-dd" \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Unit tests
        run: |
          xcodebuild \
            -project native/macOS/JunoDesktop/JunoDesktop.xcodeproj \
            -scheme JunoDesktop \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/desktop-dd" \
            -only-testing:JunoDesktopTests \
            CODE_SIGNING_ALLOWED=NO \
            test

  # ---------------------------------------------------------------------------
  # The iPhone app, because the macOS app and the phone app share JunoNativeKit
  # and a shared-package change must not break the phone.
  # ---------------------------------------------------------------------------
  ios-app:
    name: iOS app
    runs-on: macos-26
    # Observed 6m25s–11m15s.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest installed Xcode
        run: |
          set -euo pipefail
          newest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$newest/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        # `brew update` first: the runner image ships a pinned Homebrew whose
        # formula was 2.45.4, while both project specs require 2.46.0, so a bare
        # `brew install` produced "XcodeGen version is 2.45.4, but minimum
        # required version specified as 2.46.0" and failed generation before any
        # code was compiled.
        run: |
          brew update
          brew install xcodegen
          xcodegen --version

      - name: Generate projects
        run: ./native/Scripts/generate-projects.sh

      - name: Build JunoMobile (Debug simulator, strict)
        run: |
          # `SWIFT_COMPILATION_MODE=wholemodule` is a TOOLCHAIN WORKAROUND, not
          # a preference. Swift 6.3.3 — the newest on the runner image — crashes
          # in IRGen emitting the reabstraction thunk
          # `@$sSbScA_pSgIeAghyg_SbIeAghn_TR`. The crash is in the compiler, not
          # the source: the same tree builds clean on Xcode 27.
          #
          # On its own it does not work. This was added in 89faf77, removed in
          # e67840c in favour of a source fix, and that fix was reverted with an
          # unrelated rewrite in 9c84d4c; when it was restored in ae4b1b2 only
          # this half came back, and every run since has crashed on the same
          # symbol with whole-module already set. The source fix is what
          # actually removes the thunk; this is kept as the second layer.
          #
          # Note also that the symbol is *not* an `async () -> Bool` closure, as
          # earlier notes here read — demangled it is `@isolated(any) @Sendable
          # (Bool) -> ()` reabstracted to `(@in_guaranteed Bool) -> ()`, a
          # closure that *takes* a Bool. That misreading is why previous
          # attempts went looking in the camera service. It comes from passing
          # an already-`@MainActor` closure value into `Binding.init(set:)`; see
          # the note at the call site in JunoMobileAttachmentMenu.
          #
          # Remove this when the runner image ships a toolchain that does not
          # crash.
          xcodebuild \
            -project native/iOS/JunoMobile/JunoMobile.xcodeproj \
            -scheme JunoMobile \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/mobile-dd" \
            SWIFT_COMPILATION_MODE=wholemodule \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Unit tests
        # The iOS job compiled and stopped. JunoMobileTests — 56 tests across
        # seven files — had never been run by CI, while the macOS job has run
        # its equivalent all along. A test suite nothing executes is not
        # coverage, it is a file.
        #
        # A concrete simulator, not `generic/platform=iOS Simulator`: the build
        # above can target the generic destination, but `test` needs a device to
        # run on. The name is resolved from what the runner image actually has
        # rather than pinned, so a new image with a newer iPhone does not turn
        # this red.
        run: |
          set -euo pipefail
          device=$(xcrun simctl list devices available --json \
            | python3 -c "import json,sys; ds=json.load(sys.stdin)['devices']; \
                print(next(d['name'] for rt in sorted(ds) if 'iOS' in rt for d in ds[rt] if d['name'].startswith('iPhone')))")
          echo "Running JunoMobileTests on $device"
          xcodebuild \
            -project native/iOS/JunoMobile/JunoMobile.xcodeproj \
            -scheme JunoMobile \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=$device" \
            -derivedDataPath "$RUNNER_TEMP/mobile-dd" \
            -only-testing:JunoMobileTests \
            SWIFT_COMPILATION_MODE=wholemodule \
            CODE_SIGNING_ALLOWED=NO \
            test
