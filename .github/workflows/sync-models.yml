name: Sync model benchmarks and radar

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: model-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SYNC_BRANCH: model-sync/${{ github.run_id }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # No provider catalog sync: the model catalog is curated by hand from each
      # model's documentation (src/lib/models.ts). Auto-adding provider-listed
      # ids put wrong routes and thinking-effort ladders in front of users.
      - name: Refresh public benchmark metadata
        run: npm run sync:benchmarks

      - name: Scan the wider industry catalog
        run: npm run radar:models -- --out /tmp/model-radar-report.md

      # Official pages vs the catalogue (docs/models/SYNC.md). Dry run: the
      # report goes into the model-watch issue; applying stays a reviewed PR.
      - name: Check the catalogue against the labs' own pages
        run: npm run models:sync -- --out /tmp/model-sync-report.md

      # One invalid catalogue row must not hold back the benchmark refresh or
      # the model-watch issue (both independent of models.ts). The failure is
      # copied into the issue and fails the job in the last step instead.
      - name: Validate catalog
        id: validate
        continue-on-error: true
        shell: bash
        run: npm run validate:models 2>&1 | tee /tmp/validate-models.log

      - name: Stop when nothing changed
        id: changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit model updates on an isolated branch
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git switch -c "$SYNC_BRANCH"
          git config user.name "juno-model-bot"
          git config user.email "juno-model-bot@users.noreply.github.com"
          git add src/lib/benchmarks.generated.ts scripts/model-radar-seen.json
          git commit -m "chore(models): refresh benchmarks and model radar"
          git push origin "$SYNC_BRANCH"

      # Until the repository allows it (Settings > Actions > General > Workflow
      # permissions > "Allow GitHub Actions to create and approve pull
      # requests"), GitHub refuses the PR. That failed every run from Oct 1 to
      # Oct 18; the branch is already pushed, so it is a warning with the
      # compare link, and the model-watch issue below still opens.
      - name: Open reviewable model update
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          if ! gh pr create \
            --base main \
            --head "$SYNC_BRANCH" \
            --title "chore(models): benchmark and radar refresh" \
            --body "Automated pricing benchmark and industry-radar update. No model is added to the catalog by this job; new models are curated by hand from their docs."; then
            echo "::warning::Could not open the pull request. Review the pushed branch: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$SYNC_BRANCH"
          fi

      - name: Open model-watch issue for newly announced models
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          cat /tmp/model-sync-report.md >> /tmp/model-radar-report.md 2>/dev/null || true
          if [ "${{ steps.validate.outcome }}" = "failure" ]; then
            { echo; echo "## validate:models failed (needs a person)"; echo; echo '```'; cat /tmp/validate-models.log; echo '```'; } >> /tmp/model-radar-report.md
          fi
          if [ -s /tmp/model-radar-report.md ]; then
            gh issue create \
              --title "Model watch: new provider releases detected" \
              --label model-watch \
              --body-file /tmp/model-radar-report.md
          fi

      - name: Fail when the catalogue is invalid
        if: steps.validate.outcome == 'failure'
        shell: bash
        run: |
          grep -E 'FAIL:' /tmp/validate-models.log | sed 's/^ *FAIL: /::error::/' || true
          exit 1
