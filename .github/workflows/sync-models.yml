# Nightly model watch — three layers, all automatic:
#  1. sync:models:write   — asks every configured provider's live model API for
#     new/vanished chat models and regenerates src/lib/models.generated.ts
#     (new models appear in the picker automatically with guessed metadata).
#  2. sync:benchmarks     — re-grounds intelligence/speed/price grades on
#     Artificial Analysis (+ OpenRouter keyless fallback) into
#     src/lib/benchmarks.generated.ts.
#  3. radar:models        — diffs OpenRouter's full industry catalog against a
#     committed seen-set, catching launches our own keys can't list
#     (gen-only labs, regional gating, providers we don't resell yet).
#
# When anything changed, the run opens a PULL REQUEST with the regenerated
# files AND a GitHub issue labeled `model-watch` summarizing the changes —
# GitHub notifies by email, and the "Juno model curator" scheduled Claude agent
# picks the issue up to hand-curate entries (verified descriptions, status,
# docs/models.md) as a PR.
#
# A pull request rather than a push, and that is the point of the step at the
# bottom. This job used to commit to main, and deploy.yml runs on `push:
# branches: [main]` — so a model this bot discovered at 04:17 UTC from a third
# party's API response was built and shipped to production before anybody was
# awake, with the generated file never read. The registry drives the picker,
# pricing and the spend ceilings computed from it, so "nightly, unreviewed,
# straight to prod" is a supply chain running through fifteen vendors' model
# endpoints. Nothing about WHAT is detected changed; only who lands it.
#
# One rolling branch, force-updated each night, so a week of unmerged nights is
# one PR against today's main rather than seven stale ones.
#
# Note on credentials: a PR opened with the default GITHUB_TOKEN does not
# trigger `pull_request` workflows, so deploy.yml's gate stays idle on it. Set
# the MODEL_SYNC_TOKEN secret (a PAT or app token with contents+PR write) and
# the checks run on the PR as they would for a person. Without it the PR still
# opens and says in its body that a push or a reopen is needed to start them.
#
# Providers are synced only when their API key exists as a repo secret; the
# sync script skips missing keys and NEVER prunes a provider whose fetch
# failed, so a partial secret set is safe. Optional: AA_API_KEY (free key from
# artificialanalysis.ai → benchmark-grounded grades; without it, grades stay
# hand-tuned and only OpenRouter price data is refreshed).
name: Sync models

on:
  schedule:
    - cron: "17 4 * * *" # nightly, 04:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write # push the model-sync branch — never main, see below
  issues: write
  pull-requests: write

env:
  # The branch the nightly regeneration lands on. Fixed rather than dated: a
  # dated branch opens a new PR every night, and a reviewer who was away for a
  # week comes back to seven PRs that all conflict with each other.
  SYNC_BRANCH: model-sync/nightly

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Checkout persists these credentials for the later `git push`, so the
          # branch is pushed by whichever identity opens the PR. That has to be
          # one identity: a branch pushed by the default token and a PR opened
          # by a PAT still counts as bot-authored for workflow triggering.
          token: ${{ secrets.MODEL_SYNC_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Discover new models
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          LLAMA_API_KEY: ${{ secrets.LLAMA_API_KEY }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          SEEDANCE_API_KEY: ${{ secrets.SEEDANCE_API_KEY }}
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          MIMO_API_KEY: ${{ secrets.MIMO_API_KEY }}
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          LONGCAT_API_KEY: ${{ secrets.LONGCAT_API_KEY }}
          HUNYUAN_API_KEY: ${{ secrets.HUNYUAN_API_KEY }}
        # Capture output for the notification. Exit 1 means SOME providers
        # failed, which must not kill the rest of the watch. Exit 2 means ALL of
        # them did — a blackout, where the registry was left untouched and there
        # is nothing to commit or report, so the run must go red instead of
        # quietly looking like a night with no changes.
        #
        # PIPESTATUS, not $?: `| tee` would otherwise report tee's exit code and
        # swallow the script's entirely, which is why the previous `|| true` was
        # doing nothing at all.
        run: |
          set +e
          npm run sync:models:write 2>&1 | tee /tmp/sync-report.txt
          code=${PIPESTATUS[0]}
          set -e
          if [ "$code" = "2" ]; then
            echo "::error::Every provider failed to respond — registry not updated."
            exit 1
          fi
          exit 0

      - name: Refresh benchmark grades
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }}
        run: npm run sync:benchmarks 2>&1 | tee /tmp/benchmarks-report.txt || true

      - name: Industry radar (OpenRouter)
        run: npm run radar:models -- --out /tmp/radar-report.md || true

      - name: Validate registry
        run: npm run validate:models

      # Open a pull request when the registry moved — never push to main.
      #
      # The push this replaced went to main, and deploy.yml builds and ships
      # every push to main. So the review this step exists to require was not
      # merely absent, it was unreachable: by the time a human read the
      # model-watch issue the change was already serving users.
      #
      # The branch is force-updated rather than added to. Every run starts from
      # a fresh checkout of main and regenerates the files from scratch, so its
      # tree is already "main plus tonight's discovery" — committing that on top
      # of last night's branch would produce a diff against a base the files
      # were never generated from. Force is safe here for the reason it usually
      # is not: nothing but this job ever writes this branch.
      - name: Open a pull request when the registry changed
        id: commit
        env:
          GH_TOKEN: ${{ secrets.MODEL_SYNC_TOKEN || github.token }}
          GATED: ${{ secrets.MODEL_SYNC_TOKEN != '' }}
        run: |
          for f in src/lib/models.generated.ts src/lib/benchmarks.generated.ts scripts/model-radar-seen.json; do
            [ -e "$f" ] && git add "$f"
          done
          if git diff --cached --quiet; then
            echo "No registry changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "juno-model-sync[bot]"
          git config user.email "noreply@chat.liams.dev"
          git checkout -B "$SYNC_BRANCH"
          git commit -m "chore(models): nightly sync (discovery + benchmarks + radar)"
          git push --force origin "$SYNC_BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"

          {
            echo "Regenerated by the nightly model watch on $(date -u +%F). Nothing here is"
            echo "hand-written: these files come from the providers' own model APIs, from"
            echo "Artificial Analysis and from OpenRouter's catalog."
            echo
            echo "**Read the diff before merging.** The registry decides which models the"
            echo "picker offers and what each token is priced at, and the per-run spend"
            echo "ceilings are computed from those prices. A wrong number here is a limit"
            echo "that does not hold."
            echo
            if [ "$GATED" != "true" ]; then
              echo "> No MODEL_SYNC_TOKEN is set, so this PR was opened with the default"
              echo "> Actions token and GitHub will not start the deploy.yml checks on it."
              echo "> Push an empty commit, or close and reopen the PR, to run the gate."
              echo
            fi
            echo "## Provider API diff (sync:models)"
            echo '```'
            cat /tmp/sync-report.txt
            echo '```'
          } > /tmp/pr-body.md

          # An open PR for this branch already has tonight's push in it; opening
          # a second one would fail and lose the run's exit status with it.
          existing="$(gh pr list --head "$SYNC_BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh pr comment "$existing" --body-file /tmp/pr-body.md
            url="$(gh pr view "$existing" --json url --jq .url)"
          else
            url="$(gh pr create \
              --base main \
              --head "$SYNC_BRANCH" \
              --title "chore(models): nightly sync $(date -u +%F)" \
              --body-file /tmp/pr-body.md)"
          fi
          echo "pr=$url" >> "$GITHUB_OUTPUT"
          echo "Opened for review: $url"

      - name: Open a model-watch issue when something moved
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.MODEL_SYNC_TOKEN || github.token }}
          PR_URL: ${{ steps.commit.outputs.pr }}
        run: |
          RADAR="$(cat /tmp/radar-report.md 2>/dev/null || true)"
          # Only notify when there is something a human/curator should act on:
          # discovered/unavailable models or new industry launches.
          if ! grep -qE '^\s*[+~-] ' /tmp/sync-report.txt && [ -z "$RADAR" ]; then
            echo "Only benchmark-number drift — skipping the issue."
            exit 0
          fi
          {
            echo "Nightly model watch found changes on $(date -u +%F). The regenerated files are waiting in a pull request — nothing is live until somebody merges it. Curation TODOs below."
            echo
            echo "Pull request: $PR_URL"
            echo
            echo "## Provider API diff (sync:models)"
            echo '```'
            cat /tmp/sync-report.txt
            echo '```'
            echo
            if [ -n "$RADAR" ]; then
              echo "$RADAR"
              echo
            fi
            echo "## Curation checklist"
            echo "- [ ] Review and merge the generated diff: $PR_URL"
            echo "- [ ] Add curated entries (real descriptions, released, context) for new models in src/lib/models.ts"
            echo "- [ ] Check docs/models.md watchlist items (Grok 4.5 EU, Gemini 3.5 Pro, DeepSeek V4 official, Sonnet 5 price flip)"
            echo "- [ ] Mirror changes into JunoApp's ModelCatalog.swift if needed"
          } > /tmp/issue-body.md
          gh issue create \
            --title "Model watch: changes detected $(date -u +%F)" \
            --body-file /tmp/issue-body.md \
            --label model-watch || \
          gh issue create \
            --title "Model watch: changes detected $(date -u +%F)" \
            --body-file /tmp/issue-body.md
