# The native-parity label (docs/native/MACOS_LIQUID_GLASS_REDESIGN.md §A4.6).
#
# A few web files decide things the Mac and iPhone apps mirror by hand: the chat
# request (src/lib/chat/request.ts, src/app/api/chat/), the sidebar's rows
# (app-sidebar.tsx), the icon concepts (app-icons.ts, icons.tsx) and the tokens
# (globals.css). The generators catch a drifted projection; nothing caught a
# field added to the chat body or a row moved in the sidebar, which is how the
# Mac came to send twelve fields to a six-field schema. So a pull request that
# touches one of them carries "native: done" or "native: n/a", and this check
# fails until it does. The list lives in scripts/check-native-parity-label.mjs
# and CODEOWNERS; the script fails if the two differ.
#
# Its own workflow rather than a job in native.yml, because it has to re-run
# when a label is added — and a `labeled` event on native.yml would cancel and
# restart that workflow's macOS jobs through its concurrency group.
#
# It runs on every pull request and passes when no watched file changed, rather
# than using a `paths:` filter: a required check skipped by a path filter stays
# "expected" forever and blocks the merge it was meant to allow. To make it
# block, mark "Native parity label" required in branch protection.

name: native parity

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: native-parity-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  label:
    name: Native parity label
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # The three-dot diff needs the merge base of the PR's two tips.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # No `npm ci`: the script imports nothing outside `node:*`. Base, head
      # and labels come from the pull_request event payload.
      - name: Web files the apps mirror carry a parity label
        run: node scripts/check-native-parity-label.mjs

  # ---------------------------------------------------------------------------
  # The wave 2 pipeline (spec P1): one source for every value and string.
  #
  # globals.css and contracts/product/juno-shell-v1.json are projected to
  # TypeScript, Swift and the iPhone's string catalog by generators. A pull
  # request that edits a source without regenerating fails here, by name,
  # whatever labels it carries — the label above says a human looked; this
  # says the projections match. The contrast matrix measures every text,
  # glyph and boundary pair on every ground in light, dark and high contrast
  # (spec §3.1), and the native design gates enforce the globs packages list
  # in eslint-rules/enforce/*.json.
  # ---------------------------------------------------------------------------
  drift:
    name: Tokens, strings and contrast
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Design tokens match globals.css (TS, Swift, spring twins)
        run: npm run design:tokens:check
      - name: Shared strings match the shell contract (TS, Swift, Shell.xcstrings)
        run: npm run shell:contract:check
      - name: Contrast matrix holds in all four appearances
        run: npx tsx scripts/check-contrast-matrix.ts
      - name: Native design gates hold, enforce globs included
        run: npm run native:design:check
