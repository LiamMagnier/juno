<!doctype html>
<!--
  What nginx shows a page navigation while the app process is not answering
  (a deploy restarting it, usually): deploy/nginx.conf.template serves this
  file for a 502/503/504 that nginx itself produced, on page navigations
  only, never on /api/*. Static and self-contained on purpose: nothing here
  can depend on the app that is down. No scripts (the reload is a meta
  refresh), no external requests, both colour schemes. Installed on the VM at
  /var/www/juno-maintenance/updating.html (docs in the template).
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="8">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>Alevr · Back in a moment</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: hsl(240 20% 99%);
    --fg: hsl(216 9% 11%);
    --muted: hsl(217.5 3.7% 42%);
    --line: hsl(220 4.9% 88%);
    --dot: hsl(34 92% 29%);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: hsl(220 5.9% 10%);
      --fg: hsl(220 7% 91.6%);
      --muted: hsl(222.9 3.4% 59.8%);
      --line: hsl(225 3.6% 22%);
      --dot: hsl(35.6 58% 61.8%);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: grid;
    place-items: center;
    padding: 24px 16px;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { width: 100%; max-width: 26rem; }
  .brand { margin: 0 0 28px; font-weight: 600; letter-spacing: -0.01em; }
  h1 { margin: 0 0 10px; font-size: 1.5rem; line-height: 1.25; font-weight: 600; letter-spacing: -0.015em; text-wrap: balance; }
  p { margin: 0; }
  .lede { color: var(--muted); }
  .status {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 24px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 0.875rem;
  }
  .dot { width: 6px; height: 6px; flex: none; border-radius: 50%; background: var(--dot); }
  a { color: var(--fg); text-underline-offset: 3px; }
  a:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; border-radius: 4px; }
  .fr { margin-top: 20px; color: var(--muted); font-size: 0.875rem; }
</style>
</head>
<body>
<main>
  <p class="brand">Alevr</p>
  <h1>Updating, back in a moment</h1>
  <p class="lede">Alevr isn’t answering right now, usually because an update is being installed. This page reloads by itself every few seconds.</p>
  <p class="status"><span class="dot" aria-hidden="true"></span><span>Checking again shortly. <a href="">Reload now</a></span></p>
  <p class="fr" lang="fr">Mise à jour en cours. Alevr revient dans un instant&nbsp;; cette page se recharge toute seule.</p>
</main>
</body>
</html>
