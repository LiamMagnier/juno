name: JunoDesktop
options:
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: en
  knownRegions:
    - en
    - fr
  minimumXcodeGenVersion: 2.46.0
configs:
  Debug: debug
  Stable: release
  Next: release
packages:
  JunoNativeKit:
    path: ../../Packages/JunoNativeKit
  JunoCode:
    path: ../../Packages/JunoCode
  JunoWork:
    path: ../../Packages/JunoWork
  # Listed although no target links it directly. JunoCode and JunoWork both
  # depend on it by path; a package that is only reached that way is a
  # dependency to Xcode 26, which compiles it with `-suppress-warnings`, and
  # with CI's `SWIFT_TREAT_WARNINGS_AS_ERRORS=YES` that is a hard
  # "conflicting options" error before a line of the app is compiled. Named
  # here it is a root package like the other three and builds as strictly.
  JunoScreenControl:
    path: ../../Packages/JunoScreenControl
targets:
  JunoDesktop:
    type: application
    platform: macOS
    sources:
      # Finder-duplicate copies ("DesktopCodeStudio 2.swift" and friends) are
      # dead files that must never be compiled: each one redeclares every type
      # in its original, so a build that includes both fails with dozens of
      # "is ambiguous for type lookup" errors. The checked-in project predates
      # them and lists them nowhere, which hid the problem — but it meant
      # `Scripts/generate-projects.sh`, the documented way to regenerate, has
      # been producing a project that cannot build. Excluded here rather than
      # deleted because the copies are shared with the other targets and
      # removing 30-odd files is a separate change.
      - path: App
        excludes:
          - "* 2.swift"
      - path: Resources
        excludes:
          - Info.plist
          - JunoDesktop.entitlements
          - "ArtifactRuntime/**"
          - "env-server/**"
        buildPhase: resources
      - path: ../../iOS/JunoMobile/Resources/Fonts
        buildPhase: resources
      # The SAME string catalog the iOS app ships, not a copy.
      #
      # The shared packages call String(localized:) without a `bundle:`, so the
      # lookup goes to Bundle.main — the app bundle. iOS has this catalog and
      # resolves; macOS had none, so all 40 dotted keys rendered as literals on
      # screen: a user saw "connections.blocked.not-configured" and
      # "diagnostics.phase.idle" instead of English.
      #
      # Referenced across rather than duplicated, for the same reason Fonts is
      # above: two catalogs would drift, and a key added for one app would go
      # missing on the other.
      - path: ../../iOS/JunoMobile/Resources/Localizable.xcstrings
        buildPhase: resources
      # The bundled Juno Design editor. A folder reference so
      # `Bundle.main.url(forResource:withExtension:subdirectory:)` finds
      # "DesignEditor/index.html" and the host can scope file read access to
      # that directory alone. Built by `npm run design:editor`.
      - path: Resources/DesignEditor
        type: folder
        buildPhase: resources
      # Files running artifacts load over `juno-runtime://` — the Mermaid
      # engine today — and the one the transcript's diagram figure registers
      # at launch. A folder reference so they stay one directory the scheme
      # handler can serve from and nothing else.
      - path: Resources/ArtifactRuntime
        type: folder
        buildPhase: resources
      # Alevr Code's local env server (runner/env-server), one bundled file
      # the sidecar runs with the user's node: `npm run env-server:bundle:mac`
      # writes Resources/env-server/alevr-env.mjs (not checked in; the README
      # keeps the folder). A folder reference so it lands at
      # Contents/Resources/env-server/, where EnvServerEntry.resolve looks.
      - path: Resources/env-server
        type: folder
        buildPhase: resources
    dependencies:
      - package: JunoNativeKit
        product: JunoAPI
      - package: JunoNativeKit
        product: JunoAuth
      - package: JunoNativeKit
        product: JunoChatKit
      - package: JunoNativeKit
        product: JunoCodeKit
      - package: JunoNativeKit
        product: JunoWorkKit
      - package: JunoNativeKit
        product: JunoCore
      - package: JunoNativeKit
        product: JunoDesignSystem
      - package: JunoNativeKit
        product: JunoStorage
      - package: JunoNativeKit
        product: JunoSync
      - package: JunoNativeKit
        product: JunoVoiceKit
      - package: JunoNativeKit
        product: JunoPreviewSupport
      - package: JunoCode
        product: JunoCodeBridge
      - package: JunoCode
        product: JunoCodeUI
      # The model transport contract. Juno Work has no transport of its own —
      # both products stream turns from `/api/agent` — and a second one would be
      # a second thing to keep correct rather than a boundary worth having.
      - package: JunoCode
        product: JunoCodeRuntime
      # Juno Simulator's services and models. The pane lives in JunoCodeUI; the
      # window shell owns the session's lifetime, so it needs the types directly.
      - package: JunoCode
        product: JunoSimulator
      # Work in a folder runs a chat's commands through Alevr Code's contained
      # executor (the kernel sandbox profile), not a second shell of its own.
      - package: JunoCode
        product: JunoCodeLocal
      # The Juno Design scene contract, for the hosted design editor.
      - package: JunoNativeKit
        product: JunoDesignKit
      - package: JunoWork
        product: JunoWorkCore
      - package: JunoWork
        product: JunoWorkLocal
      # The half of Juno Work that actually does anything. Core and Local alone
      # ship the value logic and the containment boundary; without Runtime the
      # binary has no LocalWorkExecutor, no WorkToolRegistry and no approval
      # coordinator, so the app advertised a Mac that could serve Work and had
      # nothing to serve it with.
      - package: JunoWork
        product: JunoWorkRuntime
      # Browser, accessibility and screen control. Linked so the app can put the
      # controls into a run's tool registry — see `WorkToolRegistry.adding`,
      # which exists because this dependency direction forbids Runtime naming
      # them itself.
      - package: JunoWork
        product: JunoWorkAutomation
    # Alevr Code's env server bundle must be in every non-Debug build: the
    # sidecar runs Contents/Resources/env-server/alevr-env.mjs with the user's
    # node. Built here when missing (release-macos.sh builds it first anyway).
    preBuildScripts:
      - name: Env server bundle
        basedOnDependencyAnalysis: false
        shell: /bin/bash
        script: |
          set -euo pipefail
          BUNDLE="$SRCROOT/Resources/env-server/alevr-env.mjs"
          if [ -s "$BUNDLE" ]; then exit 0; fi
          if [ "$CONFIGURATION" = "Debug" ]; then
            echo "warning: No env server bundle; a Debug build runs runner/env-server from the repo. Run npm run env-server:bundle:mac to test the shipped one."
            exit 0
          fi
          export PATH="/opt/homebrew/bin:/usr/local/bin:$HOME/.volta/bin:$PATH"
          if ! command -v npm >/dev/null 2>&1; then
            echo "error: $CONFIGURATION builds must carry the env server bundle. Run npm run env-server:bundle:mac from the repository root."
            exit 1
          fi
          cd "$SRCROOT/../../.."
          npm run env-server:bundle:mac
          [ -s "$BUNDLE" ] || { echo "error: npm run env-server:bundle:mac did not write $BUNDLE"; exit 1; }
    configFiles:
      Debug: ../../Config/JunoDesktop-Debug.xcconfig
      Stable: ../../Config/JunoDesktop-Stable.xcconfig
      Next: ../../Config/JunoDesktop-Next.xcconfig
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_ENTITLEMENTS: Resources/JunoDesktop.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        PRODUCT_MODULE_NAME: JunoDesktop
  JunoDesktopTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
        excludes:
          - "* 2.swift"
    dependencies:
      - target: JunoDesktop
    configFiles:
      Debug: ../../Config/JunoDesktop-Debug.xcconfig
      Stable: ../../Config/JunoDesktop-Stable.xcconfig
      Next: ../../Config/JunoDesktop-Next.xcconfig
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.liammagnier.JunoDesktop.tests
  JunoDesktopUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: UITests
        excludes:
          - "* 2.swift"
    dependencies:
      - target: JunoDesktop
    configFiles:
      Debug: ../../Config/JunoDesktop-Debug.xcconfig
      Stable: ../../Config/JunoDesktop-Stable.xcconfig
      Next: ../../Config/JunoDesktop-Next.xcconfig
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.liammagnier.JunoDesktop.uitests
        TEST_TARGET_NAME: JunoDesktop
schemes:
  JunoDesktop:
    build:
      targets:
        JunoDesktop: all
        JunoDesktopTests: [test]
        JunoDesktopUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - JunoDesktopTests
        - JunoDesktopUITests
    profile:
      config: Stable
    analyze:
      config: Debug
    archive:
      config: Stable
  JunoDesktop-Next:
    build:
      targets:
        JunoDesktop: all
    run:
      config: Next
    profile:
      config: Next
    analyze:
      config: Next
    archive:
      config: Next
