name: JunoCode
options:
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "26.0"
  developmentLanguage: en
  knownRegions:
    - en
    - fr
  minimumXcodeGenVersion: 2.46.0
configs:
  Debug: debug
  Stable: release
  Next: release
packages:
  JunoCode:
    path: ../../Packages/JunoCode
  JunoNativeKit:
    path: ../../Packages/JunoNativeKit
targets:
  JunoCode:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - JunoCodeWebAuthenticationClient.swift
      - path: App/JunoCodeWebAuthenticationClient.swift
      - path: Resources
        excludes:
          - Info.plist
          - JunoCode.entitlements
        buildPhase: resources
    dependencies:
      - package: JunoCode
        product: JunoCodeCore
      - package: JunoCode
        product: JunoCodeLocal
      - package: JunoCode
        product: JunoCodeRuntime
      - package: JunoCode
        product: JunoCodeUI
      - package: JunoCode
        product: JunoCodeBridge
      - package: JunoNativeKit
        product: JunoAPI
      - package: JunoNativeKit
        product: JunoAuth
      - package: JunoNativeKit
        product: JunoChatKit
      - package: JunoNativeKit
        product: JunoCodeKit
      - package: JunoNativeKit
        product: JunoCore
      # Declared explicitly rather than leaned on transitively through
      # JunoCodeUI. The app's own views reach for `Color.juno…` and the ink
      # modifiers directly, and a module that is only importable because some
      # other dependency happened to link it breaks the moment that dependency
      # stops needing it.
      - package: JunoNativeKit
        product: JunoDesignSystem
      - package: JunoNativeKit
        product: JunoStorage
      - package: JunoNativeKit
        product: JunoSync
    configFiles:
      Debug: ../../Config/JunoCode-Debug.xcconfig
      Stable: ../../Config/JunoCode-Stable.xcconfig
      Next: ../../Config/JunoCode-Next.xcconfig
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Resources/JunoCode.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
  JunoCodeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: JunoCode
    configFiles:
      Debug: ../../Config/JunoCode-Debug.xcconfig
      Stable: ../../Config/JunoCode-Stable.xcconfig
      Next: ../../Config/JunoCode-Next.xcconfig
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.liammagnier.JunoCode.tests
schemes:
  JunoCode:
    build:
      targets:
        JunoCode: all
        JunoCodeTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - JunoCodeTests
    profile:
      config: Stable
    analyze:
      config: Debug
    archive:
      config: Stable
  JunoCode-Next:
    build:
      targets:
        JunoCode: all
    run:
      config: Next
    profile:
      config: Next
    analyze:
      config: Next
    archive:
      config: Next
