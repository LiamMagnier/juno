name: JunoMobile
options:
  createIntermediateGroups: true
  # The same floor as IPHONEOS_DEPLOYMENT_TARGET in native/Config/JunoMobile-*.xcconfig
  # and the `.iOS(...)` platform in the Swift packages this app links. It sat at
  # 18.0 here while everything else required 26, which nothing noticed:
  # `npm run native:entitlements:check` now fails when any of them drift.
  deploymentTarget:
    iOS: "26.0"
  # Every generate re-checks what a regenerate has dropped before: the push
  # entitlement, the signing variable below and the deployment floor. It only
  # reads files, and it is skipped (with a warning) on a machine without Node.
  postGenCommand: >-
    if command -v node >/dev/null 2>&1;
    then node ../../../scripts/check-native-app-config.mjs;
    else echo "warning: Node not found; skipping the iOS signing config check" >&2;
    fi
  developmentLanguage: en
  knownRegions:
    - en
    - fr
  minimumXcodeGenVersion: 2.46.0
configs:
  Debug: debug
  Stable: release
  Next: release
packages:
  JunoNativeKit:
    path: ../../Packages/JunoNativeKit
  # The v2 device-link remote for Mac Alevr Code (docs/code-v2/REMOTE-CONTROL.md):
  # the Code v2 contracts and reducers, and the iPhone's remote model.
  JunoCode:
    path: ../../Packages/JunoCode
targets:
  JunoMobile:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Resources
        excludes:
          - Info.plist
          - JunoMobile.entitlements
        buildPhase: resources
      # The bundled Juno Design editor — the SAME directory the Mac ships, not a
      # copy of it.
      #
      # Referenced across for the same reason the Mac references this app's Fonts
      # and string catalog: `scripts/build-design-editor.mjs` writes exactly one
      # bundle, and a second copy is a second thing to keep fresh. A folder
      # reference so `Bundle.main.url(forResource:withExtension:subdirectory:)`
      # finds "DesignEditor/index.html" and the host can scope file read access to
      # that directory alone. Built by `npm run design:editor`.
      - path: ../../macOS/JunoDesktop/Resources/DesignEditor
        type: folder
        buildPhase: resources
    dependencies:
      - package: JunoNativeKit
        product: JunoAPI
      - package: JunoNativeKit
        product: JunoAuth
      - package: JunoNativeKit
        product: JunoChatKit
      - package: JunoNativeKit
        product: JunoCodeKit
      - package: JunoNativeKit
        product: JunoCore
      - package: JunoNativeKit
        product: JunoDesignKit
      - package: JunoNativeKit
        product: JunoDesignSystem
      - package: JunoNativeKit
        product: JunoStorage
      - package: JunoNativeKit
        product: JunoSync
      - package: JunoNativeKit
        product: JunoVoiceKit
      - package: JunoNativeKit
        product: JunoWorkKit
      - package: JunoCode
        product: JunoCodeCore
      - package: JunoCode
        product: JunoCodeRemote
      # Development-only visual QA harness; its symbols are all #if DEBUG, so it
      # contributes nothing to Stable/Release builds.
      - package: JunoNativeKit
        product: JunoPreviewSupport
      - target: JunoMobileWidgets
        embed: true
    configFiles:
      Debug: ../../Config/JunoMobile-Debug.xcconfig
      Stable: ../../Config/JunoMobile-Stable.xcconfig
      Next: ../../Config/JunoMobile-Next.xcconfig
    settings:
      base:
        # Through a variable the xcconfigs set, so a personal (free) team can
        # sign without push from JunoMobile-Local.xcconfig (see that file's
        # sample in native/Config). Target settings outrank xcconfigs, which is
        # why the path itself cannot live here. It also keeps xcodegen from
        # recognising the file: given the literal path, it rewrote the
        # entitlements on every generate and silently dropped push.
        #
        # So there is deliberately no `entitlements:` block on this target.
        # XcodeGen writes that block's `properties` over the file on every
        # generate AND forces CODE_SIGN_ENTITLEMENTS to the literal path, which
        # would undo both halves of this. The file carries `aps-environment` =
        # $(JUNO_APS_ENVIRONMENT) (native/Config/JunoMobile-Push.xcconfig), and
        # the postGenCommand above fails a generate that loses it.
        CODE_SIGN_ENTITLEMENTS: $(JUNO_MOBILE_ENTITLEMENTS)
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
  JunoMobileWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
        excludes:
          - Info.plist
      - path: App/JunoMobileLiveActivities.swift
      # The website's icon set (generated symbols), so widgets and Live
      # Activities draw the same marks as the app instead of SF Symbols.
      - path: Resources/Assets.xcassets
        buildPhase: resources
    configFiles:
      Debug: ../../Config/JunoMobile-Debug.xcconfig
      Stable: ../../Config/JunoMobile-Stable.xcconfig
      Next: ../../Config/JunoMobile-Next.xcconfig
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Widgets/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: $(JUNO_MOBILE_BUNDLE_IDENTIFIER).widgets
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: WIDGET_EXTENSION
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: 1,2
    dependencies:
      - sdk: ActivityKit.framework
      - sdk: WidgetKit.framework
      # The widget tiles and Live Activity cards are cut from the same tokens
      # as the app's surfaces, so they track the palette instead of baking in
      # one appearance's colors.
      - package: JunoNativeKit
        product: JunoDesignSystem
  JunoMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: JunoMobile
    configFiles:
      Debug: ../../Config/JunoMobile-Debug.xcconfig
      Stable: ../../Config/JunoMobile-Stable.xcconfig
      Next: ../../Config/JunoMobile-Next.xcconfig
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.liammagnier.JunoMobile.tests
  JunoMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: JunoMobile
    configFiles:
      Debug: ../../Config/JunoMobile-Debug.xcconfig
      Stable: ../../Config/JunoMobile-Stable.xcconfig
      Next: ../../Config/JunoMobile-Next.xcconfig
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.liammagnier.JunoMobile.uitests
        TEST_TARGET_NAME: JunoMobile
schemes:
  JunoMobile:
    build:
      targets:
        JunoMobile: all
        JunoMobileWidgets: all
        JunoMobileTests: [test]
        JunoMobileUITests: [test]
    run:
      config: Debug
      # Local StoreKit testing: the plans page loads these twelve products in a
      # Debug run on the simulator. Release builds read App Store Connect.
      storeKitConfiguration: ../../StoreKit/Alevr.storekit
    test:
      config: Debug
      targets:
        - JunoMobileTests
        - JunoMobileUITests
    profile:
      config: Stable
    analyze:
      config: Debug
    archive:
      config: Stable
  JunoMobile-Next:
    build:
      targets:
        JunoMobile: all
    run:
      config: Next
    profile:
      config: Next
    analyze:
      config: Next
    archive:
      config: Next
