openapi: 3.1.0
info:
  title: Juno Native API
  version: 1.3.0
  description: >-
    Canonical web-to-native contract. Auth.js cookies are never native
    credentials.

    `version` is what installed clients compare against, so it moves only on a
    change that an older client cannot survive. Purely additive endpoints —
    /auth/password is one — leave it alone: a 1.3.0 client simply never calls
    them, whereas bumping it would fail that client's /auth/session check and
    sign the user out of an app that was working fine. The SHA-256 digest in the
    generated Swift contract still moves, so additive edits are not invisible.

servers:
  - url: /api/v1
security:
  - nativeBearer: []
paths:
  /auth/token:
    post:
      security: []
      operationId: exchangeAuthorizationCode
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenExchangeRequest' }
      responses:
        '200':
          description: Device credentials issued after atomic code consumption.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '400': { $ref: '#/components/responses/InvalidGrant' }
  /auth/password:
    post:
      security: []
      operationId: signInWithPassword
      description: >-
        Issues device credentials directly from an email/password pair, so a
        client can sign in without a system browser round-trip. Same device
        session and rotating-refresh model as /auth/token. Throttled per account
        and per IP; every rejection returns the same invalid_grant envelope so
        the response cannot be used to probe which accounts exist.

        The one exception is two-step verification: an account that has it on
        answers 401 `mfa_required` when the password was correct but no valid
        code came with it, because a client cannot ask for a code it has not
        been told to collect. That is only ever returned to a caller who
        already holds the password.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordSignInRequest' }
      responses:
        '200':
          description: Device credentials issued after password verification.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '400': { $ref: '#/components/responses/InvalidGrant' }
        '401':
          description: >-
            Two-step verification required. Collect a TOTP or recovery code and
            retry the same request with `code`.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '429': { $ref: '#/components/responses/InvalidGrant' }
  /auth/refresh:
    post:
      security: []
      operationId: rotateRefreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [refreshToken]
              properties: { refreshToken: { type: string, minLength: 32 } }
      responses:
        '200':
          description: Rotated access and refresh credentials.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefreshResponse' }
        '400': { $ref: '#/components/responses/InvalidGrant' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/session:
    get:
      operationId: getNativeSession
      responses:
        '200':
          description: Current account and device session.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      operationId: logoutNativeDevice
      responses:
        '200':
          description: Current device revoked.
          content:
            application/json:
              schema: { type: object, required: [revoked], properties: { revoked: { const: true } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/devices:
    get:
      operationId: listNativeDevices
      responses:
        '200':
          description: User-visible device sessions without credential material.
          content:
            application/json:
              schema:
                type: object
                required: [devices]
                properties:
                  devices: { type: array, items: { $ref: '#/components/schemas/DeviceSession' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/devices/{id}:
    delete:
      operationId: revokeNativeDevice
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Device revoked. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /models:
    get:
      operationId: listModels
      responses:
        '200':
          description: Authoritative available model manifest and exact reasoning controls.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ModelManifest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /bootstrap:
    get:
      operationId: getBootstrap
      responses:
        '200':
          description: Consistent account metadata and synchronization baseline.
          content: { application/json: { schema: { $ref: '#/components/schemas/BootstrapResponse' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /changes:
    get:
      operationId: listAccountChanges
      parameters:
        - { in: query, name: after, schema: { type: string, pattern: '^(0|[1-9][0-9]*)$' } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        '200':
          description: Cursor-ordered account changes. Numeric gaps are valid.
          content: { application/json: { schema: { $ref: '#/components/schemas/ChangesResponse' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '410':
          description: Cursor predates the compaction floor and snapshot reconciliation is required.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  /changes/stream:
    get:
      operationId: streamAccountChangeWakeups
      parameters:
        - { in: query, name: after, schema: { type: string, pattern: '^(0|[1-9][0-9]*)$' } }
      responses:
        '200':
          description: >-
            Long-lived SSE wakeup stream (~55s, then `done` so clients reconnect):
            `ready` on connect, a `cursor` event per cursor advance, heartbeat
            comments every ~15s. An explicit `after` emits an immediate catch-up
            cursor event when the account is already ahead of it; omitting it
            baselines to the current cursor so only new changes wake the client.
            Clients fetch authoritative pages after cursor events.
          content: { text/event-stream: { schema: { type: string } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /entities:
    get:
      operationId: getEntities
      parameters:
        - in: query
          name: type
          required: true
          schema: { type: string }
          description: A change-feed entityType (exactly the strings /changes emits).
        - in: query
          name: ids
          required: true
          schema: { type: string }
          description: Comma-separated entity ids, at most 100 per request.
      responses:
        '200':
          description: >-
            Current owner-scoped state for each requested entity, in request order.
            Tombstoned entities carry deletedAt with data null; ids unknown to the
            account are omitted.
          content: { application/json: { schema: { $ref: '#/components/schemas/EntitiesResponse' } } }
        '400':
          description: Unknown entity type or malformed id batch.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /entities/index:
    get:
      operationId: listEntityIndex
      parameters:
        - in: query
          name: after
          schema: { type: string }
          description: Opaque keyset cursor returned by the preceding page.
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
      responses:
        '200':
          description: >-
            Keyset-paginated owner-scoped inventory of every live sync entity.
            Fresh and compacted clients enumerate ids here, then hydrate them
            through /entities and replay /changes from their bootstrap cursor.
          content: { application/json: { schema: { $ref: '#/components/schemas/EntityIndexResponse' } } }
        '400':
          description: Malformed keyset cursor or page limit.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /mutations:
    post:
      operationId: applyAccountMutation
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MutationRequest' } } }
      responses:
        '200':
          description: Mutation result or the stored result of an identical retry.
          content: { application/json: { schema: { type: object, additionalProperties: true } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: Revision conflict or mutation identifier reused with different content.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
  /conversations/{conversationId}/messages:
    post:
      servers: [{ url: /api }]
      operationId: appendNativeConversationMessages
      summary: Idempotently append finalized native turns
      description: >-
        The existing account-scoped transcript endpoint. Each clientId is
        idempotent within the conversation: an identical retry returns the
        persisted row and never creates a duplicate. Native chat appends its
        user turn here before starting a regenerate request through /chat.
      parameters:
        - in: path
          name: conversationId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppendMessagesRequest' }
      responses:
        '200':
          description: Persisted rows in request order, including rows recovered by an idempotent retry.
          content: { application/json: { schema: { $ref: '#/components/schemas/AppendMessagesResponse' } } }
        '400': { $ref: '#/components/responses/GeneralRouteError' }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
        '404': { $ref: '#/components/responses/GeneralRouteError' }
        '409': { $ref: '#/components/responses/GeneralRouteError' }
        '413': { $ref: '#/components/responses/GeneralRouteError' }
        '429': { $ref: '#/components/responses/GeneralRouteError' }
  /chat:
    post:
      servers: [{ url: /api }]
      operationId: streamNativeChat
      summary: Generate a response over the production Juno SSE stream
      description: >-
        Existing production chat route with native bearer authentication. The
        native saved-conversation flow first appends one USER turn through the
        idempotent messages endpoint, then submits this request with
        regenerate=true and no message. The server generates from the
        authoritative final user row. If transport is lost after acceptance,
        clients must reconcile through the account change feed and must not
        automatically repeat this POST, because ordinary regenerate requests
        do not have a durable first-submission receipt. Every SSE frame is
        encoded as `data: {json}\n\n`; ping frames are heartbeats and done or
        error is terminal.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NativeChatGenerationRequest' }
      responses:
        '200':
          description: >-
            Progressive chat events. The JSON payload of each data frame matches
            ChatSSEEvent (meta, title, activity, approval, delta, reasoning,
            sources, resume, work, ping, then done, error or handoff).
          content:
            text/event-stream:
              schema:
                type: string
                x-juno-event-schema: '#/components/schemas/ChatSSEEvent'
        default: { $ref: '#/components/responses/GeneralRouteError' }
  /chat/cancel:
    post:
      servers: [{ url: /api }]
      operationId: cancelNativeChatGeneration
      description: Account-scoped best-effort cancellation of an in-process generation.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatCancellationRequest' }
      responses:
        '200':
          description: The request was valid; cancelled is false if no owned live generation was registered.
          content: { application/json: { schema: { $ref: '#/components/schemas/ChatCancellationResponse' } } }
        '400': { $ref: '#/components/responses/GeneralRouteError' }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
  /chat/receipt:
    get:
      servers: [{ url: /api }]
      operationId: getNativeChatReceipt
      description: >-
        Least-privilege recovery for the durable first submission of a new
        conversation. Supply exactly one lookup key. Existing-conversation
        regenerate requests have no receipt and recover through /api/v1/changes.
      parameters:
        - in: query
          name: clientRequestId
          schema: { type: string, minLength: 8, maxLength: 120 }
        - in: query
          name: generationId
          schema: { type: string, minLength: 8, maxLength: 120 }
      responses:
        '200':
          description: Current durable submission state without prompt content.
          content: { application/json: { schema: { $ref: '#/components/schemas/ChatReceiptResponse' } } }
        '400': { $ref: '#/components/responses/GeneralRouteError' }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
        '404': { $ref: '#/components/responses/GeneralRouteError' }
  /memory:
    get:
      servers: [{ url: /api }]
      operationId: getNativeMemory
      description: Existing owner-scoped memory entries plus the consolidated summary. Entry CRUD stays on /api/v1/mutations; this route only reads.
      parameters:
        - in: query
          name: q
          schema: { type: string }
          description: Optional case-insensitive content filter.
      responses:
        '200':
          description: All saved memory entries and the consolidated summary, newest entries first.
          content: { application/json: { schema: { $ref: '#/components/schemas/MemoryResponse' } } }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
    post:
      servers: [{ url: /api }]
      operationId: addNativeMemoryEntry
      description: >-
        Saves a fact by hand, account-wide or (with `projectId`) in one
        project. The memory page's "New memory"; the Settings pane's entry CRUD
        stays on /api/v1/mutations.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, minLength: 1, maxLength: 500 }
                projectId: { type: string }
      responses:
        '201':
          description: The saved row.
          content: { application/json: { schema: { type: object, additionalProperties: true, required: [memory], properties: { memory: { $ref: '#/components/schemas/MemoryEntryItem' } } } } }
        '400': { $ref: '#/components/responses/GeneralRouteError' }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
        '404': { $ref: '#/components/responses/GeneralRouteError' }
        '409': { $ref: '#/components/responses/GeneralRouteError' }
    delete:
      servers: [{ url: /api }]
      operationId: eraseNativeMemory
      description: Permanently removes every saved fact and the consolidated summary, and marks all conversations processed so backfill cannot re-learn them.
      responses:
        '200':
          description: Memory was permanently erased.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties: { ok: { const: true } }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
  /library:
    get:
      servers: [{ url: /api }]
      operationId: listNativeLibraryItems
      description: >-
        Existing owner-scoped attachment library, capped at 300 newest items.
        Files taken out of the Library (DELETE /library/{id}) are not listed.
        The Mac's Library page (Phase 4) pages it as the web's use-library.ts
        does: limit, sort, q, kind, includeDeleted (the Recently deleted view)
        and the previous answer's nextCursor. The first page also carries
        counts, total and storage; items may carry inUse, keptIn, knowledge,
        versionCount and deletedAt. Clients decode every added field
        tolerantly.
      parameters:
        - in: query
          name: kind
          schema: { type: string, enum: [IMAGE, FILE] }
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: sort
          schema: { type: string, enum: [newest, oldest, name, size] }
        - in: query
          name: includeDeleted
          schema: { type: string, enum: ['true'] }
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Signed access URLs are short-lived and must never be persisted.
          content: { application/json: { schema: { $ref: '#/components/schemas/LibraryResponse' } } }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
  /library/attach:
    post:
      servers: [{ url: /api }]
      operationId: cloneNativeLibraryAttachments
      description: Clone owned attachment metadata for a future message without duplicating bytes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [attachmentIds]
              properties:
                attachmentIds:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items: { type: string }
      responses:
        '201':
          description: Fresh unlinked attachment rows in request order.
          content:
            application/json:
              schema:
                type: object
                required: [attachments]
                properties:
                  attachments: { type: array, items: { $ref: '#/components/schemas/LibraryAttachment' } }
        '400': { $ref: '#/components/responses/GeneralRouteError' }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
        '404': { $ref: '#/components/responses/GeneralRouteError' }
  /library/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    delete:
      servers: [{ url: /api }]
      operationId: removeNativeLibraryItem
      description: >-
        Take one file out of the owner's Library. This is not DELETE
        /api/attachments/{id}, which deletes the file wherever it is, including
        the chat it was sent in. If a message or a project still uses the file,
        it only leaves the Library (mode hidden, and keptIn says where it
        stayed): the row, its bytes and its knowledge index stay live there,
        and the synced attachment entity carries libraryRemovedAt, which only a
        Library view filters on. If nothing uses the file, it is deleted (mode
        deleted). Either way the file lands in the web Library's Recently
        deleted, and POST /api/attachments/{id}/restore brings it back.
      responses:
        '200':
          description: The file is out of the Library.
          content: { application/json: { schema: { $ref: '#/components/schemas/LibraryRemovalResponse' } } }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
        '404':
          description: "Not in the reader's Library: not theirs, already deleted, or already removed."
          content: { application/json: { schema: { $ref: '#/components/schemas/GeneralRouteErrorEnvelope' } } }
  /attachments/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    patch:
      servers: [{ url: /api }]
      operationId: renameNativeAttachment
      description: Rename a file the owner holds (the Library's Rename…).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileName]
              properties: { fileName: { type: string, minLength: 1 } }
      responses:
        '200':
          description: The saved name.
          content:
            application/json:
              schema:
                type: object
                properties: { fileName: { type: string } }
        '400': { $ref: '#/components/responses/GeneralRouteError' }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
        '404': { $ref: '#/components/responses/GeneralRouteError' }
  /attachments/{id}/restore:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    post:
      servers: [{ url: /api }]
      operationId: restoreNativeAttachment
      description: >-
        Bring a file back from Recently deleted. A 404 means no deleted file
        has that id: it was restored already, which the Library does not
        treat as a failure.
      responses:
        '200':
          description: Restored.
          content: { application/json: { schema: { type: object } } }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
        '404': { $ref: '#/components/responses/GeneralRouteError' }
        '409': { $ref: '#/components/responses/GeneralRouteError' }
        '410': { $ref: '#/components/responses/GeneralRouteError' }
  /attachments/{id}/versions:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    get:
      servers: [{ url: /api }]
      operationId: listNativeAttachmentVersions
      description: The current version, then the earlier ones kept when the file was replaced.
      responses:
        '200':
          description: Versions, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [versions]
                properties:
                  versions:
                    type: array
                    items:
                      type: object
                      properties:
                        version: { type: integer }
                        current: { type: boolean }
                        fileName: { type: string }
                        size: { type: integer }
                        createdAt: { type: string }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
        '404': { $ref: '#/components/responses/GeneralRouteError' }
  /attachments/{id}/versions/{version}/restore:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
      - in: path
        name: version
        required: true
        schema: { type: integer, minimum: 1 }
    post:
      servers: [{ url: /api }]
      operationId: restoreNativeAttachmentVersion
      description: Make an earlier version current; the current one is kept.
      responses:
        '200':
          description: Restored.
          content: { application/json: { schema: { type: object } } }
        '400': { $ref: '#/components/responses/GeneralRouteError' }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
        '404': { $ref: '#/components/responses/GeneralRouteError' }
        '410': { $ref: '#/components/responses/GeneralRouteError' }
  /projects:
    post:
      servers: [{ url: /api }]
      operationId: createNativeUnnamedProject
      description: >-
        Create a project. The Mac sends an empty body only for a project left
        unnamed, which the server creates as "Untitled project" and names from
        its first chat; a named project goes through /mutations
        (project.create), which requires a name.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                instructions: { type: string }
      responses:
        '201':
          description: The new project's id.
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties: { id: { type: string } }
        '400': { $ref: '#/components/responses/GeneralRouteError' }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
  /artifacts:
    get:
      servers: [{ url: /api }]
      operationId: listNativeArtifacts
      description: Existing owner-scoped artifact index across all conversations.
      responses:
        '200':
          description: Up to 200 artifacts ordered by most recent update.
          content: { application/json: { schema: { $ref: '#/components/schemas/ArtifactIndexResponse' } } }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
  /artifacts/{artifactId}:
    parameters:
      - in: path
        name: artifactId
        required: true
        schema: { type: string }
    get:
      servers: [{ url: /api }]
      operationId: getNativeArtifact
      responses:
        '200':
          description: Full artifact and append-only version history.
          content: { application/json: { schema: { $ref: '#/components/schemas/ArtifactResponse' } } }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
        '404': { $ref: '#/components/responses/GeneralRouteError' }
    post:
      servers: [{ url: /api }]
      operationId: appendNativeArtifactVersion
      description: Append a manual edit or restore with optimistic base-version protection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [content]
              properties:
                content: { type: string, maxLength: 200000 }
                baseVersion: { type: integer, minimum: 1 }
                origin: { type: string, enum: [edit, restore], default: edit }
      responses:
        '200':
          description: Artifact with the newly appended version.
          content: { application/json: { schema: { $ref: '#/components/schemas/ArtifactResponse' } } }
        '400': { $ref: '#/components/responses/GeneralRouteError' }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
        '404': { $ref: '#/components/responses/GeneralRouteError' }
        '409':
          description: The base version is stale; the response includes the latest artifact.
          content: { application/json: { schema: { $ref: '#/components/schemas/StaleArtifactResponse' } } }
    patch:
      servers: [{ url: /api }]
      operationId: renameNativeArtifact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title]
              properties: { title: { type: string, minLength: 1, maxLength: 200 } }
      responses:
        '200':
          description: Renamed artifact with full version history.
          content: { application/json: { schema: { $ref: '#/components/schemas/ArtifactResponse' } } }
        '400': { $ref: '#/components/responses/GeneralRouteError' }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
        '404': { $ref: '#/components/responses/GeneralRouteError' }
    delete:
      servers: [{ url: /api }]
      operationId: deleteNativeArtifact
      responses:
        '200':
          description: Artifact and its versions were deleted.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties: { ok: { const: true } }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
        '404': { $ref: '#/components/responses/GeneralRouteError' }
  /artifacts/{artifactId}/export:
    get:
      servers: [{ url: /api }]
      operationId: exportNativeArtifact
      parameters:
        - in: path
          name: artifactId
          required: true
          schema: { type: string }
        - in: query
          name: format
          schema: { type: string, enum: [docx, xlsx, pptx] }
          description: Omit to detect the formats available for the latest Markdown version.
      responses:
        '200':
          description: Available-format JSON when format is omitted, otherwise the generated Office binary.
          content:
            application/json: { schema: { $ref: '#/components/schemas/ArtifactExportFormats' } }
            application/octet-stream: { schema: { type: string, format: binary } }
        '400': { $ref: '#/components/responses/GeneralRouteError' }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
        '404': { $ref: '#/components/responses/GeneralRouteError' }
        '429': { $ref: '#/components/responses/GeneralRouteError' }
  /artifacts/{artifactId}/poster:
    get:
      servers: [{ url: /api }]
      operationId: getNativeDesignPoster
      description: >-
        The owner's picture of a DESIGN artifact: the first page of version v
        (the current one without v), drawn by the server as SVG — the web's
        designPosterUrl, with r the poster renderer. A version a later one
        superseded is immutable; the current version revalidates by ETag
        (If-None-Match, 304). 404 (JSON) for anything that is not a readable
        design of the caller's; the Mac then falls back to
        /api/design/{id}/export?format=svg.
      parameters:
        - in: path
          name: artifactId
          required: true
          schema: { type: string }
        - in: query
          name: v
          schema: { type: integer, minimum: 1 }
        - in: query
          name: r
          schema: { type: integer, minimum: 1 }
        - in: header
          name: If-None-Match
          schema: { type: string }
      responses:
        '200':
          description: The poster.
          content: { image/svg+xml: { schema: { type: string } } }
        '304': { description: The cached poster is current. }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
        '404': { $ref: '#/components/responses/GeneralRouteError' }
        '429': { $ref: '#/components/responses/GeneralRouteError' }
  /code/devices:
    get:
      servers: [{ url: /api }]
      operationId: listNativeCodeDevices
      description: Existing owner-scoped Juno Code hosts (Remote devices), most-recently-seen first. Already accepts the native bearer via getCurrentUser.
      responses:
        '200':
          description: Registered hosts with online status derived from the heartbeat window.
          content: { application/json: { schema: { $ref: '#/components/schemas/CodeDevicesResponse' } } }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
  /code/devices/{deviceId}:
    delete:
      operationId: revokeNativeCodeDevice
      description: >-
        Revokes one Juno Code host pairing for the calling account. The row was
        created by heartbeat upserts to the sibling list route; deleting it
        unlists the computer and cascades its device-scoped relay rows
        (remote sessions, commands, events, device-addressed tasks). A
        heartbeat that replays the revoked id gets 404 from the list route
        rather than a silently resurrected row, so the host can surface
        "unpaired" instead of beating against a pairing nobody lists.
      parameters:
        - in: path
          name: deviceId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The pairing was removed.
          content:
            application/json:
              schema:
                type: object
                required: [revoked, deviceId]
                properties:
                  revoked: { const: true }
                  deviceId: { type: string }
        '400': { $ref: '#/components/responses/GeneralRouteError' }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
        '404': { $ref: '#/components/responses/GeneralRouteError' }
  /code/workspaces:
    get:
      servers: [{ url: /api }]
      operationId: listNativeCodeWorkspaces
      description: Owner-scoped shared Code workspaces, newest-opened first. `path` is device-local metadata — native clients must address by `key`/`id` and never surface `path`.
      responses:
        '200':
          description: Shared workspaces keyed by an opaque `key`.
          content: { application/json: { schema: { $ref: '#/components/schemas/CodeWorkspacesResponse' } } }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
  /code/tasks:
    get:
      servers: [{ url: /api }]
      operationId: listNativeCodeSessions
      description: Owner-scoped Code sessions (tasks), newest first. `workspacePath` is device-local — native clients must not surface it (see CodeSession).
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [queued, running, awaiting_approval, completed, failed, cancelled] }
      responses:
        '200':
          description: Code sessions for this account.
          content: { application/json: { schema: { $ref: '#/components/schemas/CodeSessionsResponse' } } }
        '400': { $ref: '#/components/responses/GeneralRouteError' }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
  /code/tasks/{taskId}:
    get:
      servers: [{ url: /api }]
      operationId: getNativeCodeSession
      description: A Code session and its append-only event journal. Resume by comparing `lastSeq` against the last event `seq` already seen.
      parameters:
        - in: path
          name: taskId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Session state plus the ordered event journal.
          content: { application/json: { schema: { $ref: '#/components/schemas/CodeSessionDetailResponse' } } }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
        '404': { $ref: '#/components/responses/GeneralRouteError' }

  # ---------------------------------------------------------------------------
  # Settings, Plan & usage, onboarding and announcements (Phase 3 Stage C).
  # The web's own routes under /api, which read the native bearer through
  # getCurrentUser; failures are `{ error, field? }` (GeneralRouteError).
  # ---------------------------------------------------------------------------
  /account/mfa:
    get:
      servers: [{ url: /api }]
      operationId: getNativeAccountSecurity
      description: Two-step verification status and whether the account has a password.
      responses:
        '200':
          description: The account's sign-in security.
          content:
            application/json:
              schema:
                type: object
                required: [enabled, pending, recoveryCodesRemaining, hasPassword]
                properties:
                  enabled: { type: boolean }
                  pending: { type: boolean }
                  enabledAt: { type: [string, 'null'], format: date-time }
                  recoveryCodesRemaining: { type: integer, minimum: 0 }
                  hasPassword: { type: boolean }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
  /account/mfa/start:
    post:
      servers: [{ url: /api }]
      operationId: startNativeTwoStepEnrolment
      description: Begins enrolment; the QR code is a server-drawn data URL.
      responses:
        '200':
          description: The secret, its otpauth URL and the QR code.
          content:
            application/json:
              schema:
                type: object
                required: [secret, otpauthUrl, qrDataUrl]
                properties:
                  secret: { type: string }
                  otpauthUrl: { type: string }
                  qrDataUrl: { type: string }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
        '429': { $ref: '#/components/responses/GeneralRouteError' }
  /account/mfa/confirm:
    post:
      servers: [{ url: /api }]
      operationId: confirmNativeTwoStepEnrolment
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string } } } } }
      responses:
        '200':
          description: Two-step verification is on; the recovery codes are shown once.
          content:
            application/json:
              schema:
                type: object
                required: [ok, recoveryCodes]
                properties:
                  ok: { const: true }
                  recoveryCodes: { type: array, items: { type: string } }
        '400': { $ref: '#/components/responses/GeneralRouteError' }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
  /account/mfa/disable:
    post:
      servers: [{ url: /api }]
      operationId: disableNativeTwoStep
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string } } } } }
      responses:
        '200':
          description: Two-step verification is off.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { const: true }
                  ownerAdminLocked: { type: boolean }
        '400': { $ref: '#/components/responses/GeneralRouteError' }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
  /account/password:
    post:
      servers: [{ url: /api }]
      operationId: changeNativeAccountPassword
      description: Changes the password and signs out every session, the caller's included.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 8 }
      responses:
        '200': { description: Changed; every session is signed out. }
        '400': { $ref: '#/components/responses/GeneralRouteError' }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
  /account/email:
    post:
      servers: [{ url: /api }]
      operationId: startNativeAccountEmailChange
      description: Mails a confirmation link to the new address; nothing changes until it is opened.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                currentPassword: { type: string }
      responses:
        '200': { description: The link is on its way. }
        '400': { $ref: '#/components/responses/GeneralRouteError' }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
  /account/sessions/revoke:
    post:
      servers: [{ url: /api }]
      operationId: revokeNativeAccountSessions
      description: Ends every session on every device, the caller's included.
      responses:
        '200': { description: Every session is revoked. }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
  /account/export:
    get:
      servers: [{ url: /api }]
      operationId: exportNativeAccount
      parameters:
        - in: query
          name: format
          schema: { type: string, enum: [json, csv, juno] }
          description: Absent is JSON; `juno` is a .zip with Library files (or JSON when the server has no storage).
      responses:
        '200': { description: The export file. }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
  /announcements:
    get:
      servers: [{ url: /api }]
      operationId: getNativeAnnouncement
      description: The newest published announcement this account has not dismissed, or null.
      responses:
        '200':
          description: One announcement or null.
          content:
            application/json:
              schema:
                type: object
                required: [announcement]
                properties:
                  announcement:
                    type: [object, 'null']
                    required: [id, title, description]
                    properties:
                      id: { type: string }
                      title: { type: string }
                      description: { type: string }
                      imageUrl: { type: [string, 'null'] }
                      videoUrl: { type: [string, 'null'] }
                      provider: { type: [string, 'null'] }
                      modelName: { type: [string, 'null'] }
                      newsLabel: { type: [string, 'null'] }
                      newsHref: { type: [string, 'null'] }
                      ctaLabel: { type: [string, 'null'] }
                      ctaHref: { type: [string, 'null'] }
  /announcements/{id}/dismiss:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    post:
      servers: [{ url: /api }]
      operationId: dismissNativeAnnouncement
      responses:
        '200': { description: Dismissed for this account. }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
  /conversations:
    delete:
      servers: [{ url: /api }]
      operationId: deleteAllNativeConversations
      description: Deletes every conversation and its messages. Memories and projects stay.
      responses:
        '200':
          description: Every conversation is deleted.
          content: { application/json: { schema: { type: object, required: [ok], properties: { ok: { const: true } } } } }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
  /import:
    post:
      servers: [{ url: /api }]
      operationId: importNativeChatHistory
      description: A ChatGPT, Claude, Gemini or Juno export (.zip or .json, 100 MB), multipart field `file`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { type: object, required: [file], properties: { file: { type: string, format: binary } } }
      responses:
        '200':
          description: What was restored.
          content:
            application/json:
              schema:
                type: object
                required: [imported]
                properties:
                  imported: { type: integer }
                  skipped: { type: integer }
                  projectsImported: { type: integer }
                  memoriesImported: { type: integer }
                  attachmentsImported: { type: integer }
                  attachmentsSkipped: { type: integer }
                  format: { type: string }
        '400': { $ref: '#/components/responses/GeneralRouteError' }
        '409': { $ref: '#/components/responses/GeneralRouteError' }
  /profile/avatar:
    post:
      servers: [{ url: /api }]
      operationId: uploadNativeProfileAvatar
      description: A JPEG, PNG, WebP or GIF under 5 MB, multipart field `file`.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { type: object, required: [file], properties: { file: { type: string, format: binary } } }
      responses:
        '200':
          description: The new picture's address.
          content: { application/json: { schema: { type: object, required: [url], properties: { url: { type: string } } } } }
        '400': { $ref: '#/components/responses/GeneralRouteError' }
  /profile/usage:
    get:
      servers: [{ url: /api }]
      operationId: getNativeProfileUsage
      description: The plan's quota and the month's spend, windows and billing — the meters Plan & usage draws.
      responses:
        '200':
          description: Quota and spend.
          content:
            application/json:
              schema:
                type: object
                required: [quota, spend]
                properties:
                  quota:
                    type: object
                    required: [plan]
                    properties:
                      plan: { type: string }
                      used: { type: integer }
                      limit: { type: [integer, 'null'] }
                      remaining: { type: [integer, 'null'] }
                  spend:
                    type: object
                    required: [spentMicroUsd, windows, billing]
                    properties:
                      spentMicroUsd: { type: number }
                      budgetMicroUsd: { type: [number, 'null'] }
                      remainingMicroUsd: { type: [number, 'null'] }
                      reservedMicroUsd: { type: number }
                      eurPerUsd: { type: number }
                      capSource: { type: string, enum: [plan, user, personal-default, disabled] }
                      capDisabled: { type: boolean }
                      windows: { type: object }
                      billing: { type: object }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
  /settings:
    get:
      servers: [{ url: /api }]
      operationId: getNativeServerSettings
      description: The settings row, including the fields the v1 sync record does not carry.
      responses:
        '200':
          description: The account's settings.
          content:
            application/json:
              schema:
                type: object
                required: [settings]
                properties:
                  settings:
                    type: object
                    properties:
                      memorySensitiveTopics: { type: array, items: { type: string } }
                      memoryBackgroundLearning: { type: boolean }
                      backgroundProviderMode: { type: string }
                      actionApprovalPolicy: { type: string }
                      lockdownMode: { type: boolean }
                      blockedConnectors: { type: array, items: { type: string } }
                      monthlySpendCapEur: { type: [integer, 'null'] }
                      spendCapDisabled: { type: boolean }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
    patch:
      servers: [{ url: /api }]
      operationId: patchNativeServerSettings
      description: >-
        Writes any settings field, including those the strict sync mutation
        refuses: name, memoryBackgroundLearning, memorySensitiveTopics,
        backgroundProviderMode, actionApprovalPolicy, lockdownMode,
        blockedConnectors and monthlySpendCapEur (null restores the default).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 80 }
                memoryBackgroundLearning: { type: boolean }
                memorySensitiveTopics: { type: array, items: { type: string } }
                backgroundProviderMode: { type: string }
                actionApprovalPolicy: { type: string, enum: [always_ask, ask_for_any_change, ask_for_important_actions, allow_selected_low_risk, block] }
                lockdownMode: { type: boolean }
                blockedConnectors: { type: array, maxItems: 200, items: { type: string, maxLength: 120 } }
                monthlySpendCapEur: { type: [integer, 'null'], minimum: 0, maximum: 100000 }
      responses:
        '200': { description: Saved. }
        '400': { $ref: '#/components/responses/GeneralRouteError' }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
  /stripe/checkout:
    post:
      servers: [{ url: /api }]
      operationId: startNativeCheckout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plan]
              properties:
                plan: { type: string, enum: [PRO, MAX, MAX20] }
                interval: { type: string, enum: [month, year] }
      responses:
        '200':
          description: The Stripe Checkout page to open in the browser.
          content: { application/json: { schema: { type: object, required: [url], properties: { url: { type: string } } } } }
        '400': { $ref: '#/components/responses/GeneralRouteError' }
        '503': { $ref: '#/components/responses/GeneralRouteError' }
  /stripe/portal:
    post:
      servers: [{ url: /api }]
      operationId: openNativeBillingPortal
      responses:
        '200':
          description: The Stripe billing portal to open in the browser.
          content: { application/json: { schema: { type: object, required: [url], properties: { url: { type: string } } } } }
        '400': { $ref: '#/components/responses/GeneralRouteError' }
        '503': { $ref: '#/components/responses/GeneralRouteError' }

  # ---------------------------------------------------------------------------
  # Agents (docs/design/AGENTS.md): named, persistent teammates over Work. Like
  # the Work paths below, these live under /api, not /api/v1, and take the same
  # bearer. An agent's thread is an ordinary conversation and its tasks are
  # ordinary Work sessions, so nothing here re-describes a run: `task` is a
  # glance, and the run itself is read through the Work paths.
  # ---------------------------------------------------------------------------
  /agents:
    get:
      servers: [{ url: /api }]
      operationId: listNativeAgents
      summary: The roster, each agent with its derived state
      description: >-
        `state` and `stateSentence` are derived on read from the agent and its
        newest task, never stored; `thinking` and `listening` are client-only
        states the server never reports.
      responses:
        '200':
          description: Every agent the account keeps, in roster order.
          content: { application/json: { schema: { $ref: '#/components/schemas/AgentsResponse' } } }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
    post:
      servers: [{ url: /api }]
      operationId: hireNativeAgent
      summary: Hire an agent, with its thread and optional first goal
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AgentHireRequest' } } }
      responses:
        '201':
          description: The new agent.
          content: { application/json: { schema: { $ref: '#/components/schemas/AgentResponse' } } }
        '400': { $ref: '#/components/responses/GeneralRouteError' }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
        '404': { $ref: '#/components/responses/GeneralRouteError' }
        '409': { $ref: '#/components/responses/GeneralRouteError' }
        '429': { $ref: '#/components/responses/GeneralRouteError' }
  /agents/{agentId}:
    parameters:
      - { in: path, name: agentId, required: true, schema: { type: string } }
    get:
      servers: [{ url: /api }]
      operationId: getNativeAgent
      summary: Everything the agent's page draws
      responses:
        '200':
          description: The agent, its goals, new ideas, notes, routines and recent tasks.
          content: { application/json: { schema: { $ref: '#/components/schemas/AgentDetail' } } }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
        '404': { $ref: '#/components/responses/GeneralRouteError' }
    patch:
      servers: [{ url: /api }]
      operationId: updateNativeAgent
      summary: Edit the profile, autonomy and apps, or pause and resume it
      description: >-
        Pausing switches off the routines it owns and records which; resuming
        switches back on only those, so a routine the person turned off stays off.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AgentPatchRequest' } } }
      responses:
        '200':
          description: The agent after the change.
          content: { application/json: { schema: { $ref: '#/components/schemas/AgentResponse' } } }
        '400': { $ref: '#/components/responses/GeneralRouteError' }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
        '404': { $ref: '#/components/responses/GeneralRouteError' }
    delete:
      servers: [{ url: /api }]
      operationId: retireNativeAgent
      summary: Retire it; its thread and tasks are kept as ordinary chats and tasks
      responses:
        '200': { description: Retired. }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
        '404': { $ref: '#/components/responses/GeneralRouteError' }
  /agents/{agentId}/thread:
    parameters:
      - { in: path, name: agentId, required: true, schema: { type: string } }
    post:
      servers: [{ url: /api }]
      operationId: openNativeAgentThread
      summary: The agent's thread, created on first use
      description: POST because the first call writes a conversation.
      responses:
        '200':
          description: The conversation id of its thread.
          content:
            application/json:
              schema: { type: object, required: [conversationId], properties: { conversationId: { type: string } } }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
        '404': { $ref: '#/components/responses/GeneralRouteError' }
  /agents/{agentId}/goals:
    parameters:
      - { in: path, name: agentId, required: true, schema: { type: string } }
    get:
      servers: [{ url: /api }]
      operationId: listNativeAgentGoals
      responses:
        '200':
          description: Every goal, oldest first.
          content:
            application/json:
              schema: { type: object, required: [goals], properties: { goals: { type: array, items: { $ref: '#/components/schemas/AgentGoal' } } } }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
        '404': { $ref: '#/components/responses/GeneralRouteError' }
    post:
      servers: [{ url: /api }]
      operationId: createNativeAgentGoal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, maxLength: 140 }
                detail: { type: string, maxLength: 2000 }
                cadence: { type: string, enum: [none, daily, weekly] }
                dueAt: { type: [string, 'null'], format: date-time }
      responses:
        '201':
          description: The goal.
          content: { application/json: { schema: { type: object, required: [goal], properties: { goal: { $ref: '#/components/schemas/AgentGoal' } } } } }
        '400': { $ref: '#/components/responses/GeneralRouteError' }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
        '404': { $ref: '#/components/responses/GeneralRouteError' }
        '409': { $ref: '#/components/responses/GeneralRouteError' }
  /agents/{agentId}/goals/{goalId}:
    parameters:
      - { in: path, name: agentId, required: true, schema: { type: string } }
      - { in: path, name: goalId, required: true, schema: { type: string } }
    patch:
      servers: [{ url: /api }]
      operationId: updateNativeAgentGoal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 140 }
                detail: { type: string, maxLength: 2000 }
                cadence: { type: string, enum: [none, daily, weekly] }
                status: { type: string, enum: [active, paused, achieved, dropped] }
                dueAt: { type: [string, 'null'], format: date-time }
      responses:
        '200':
          description: The goal after the change.
          content: { application/json: { schema: { type: object, required: [goal], properties: { goal: { $ref: '#/components/schemas/AgentGoal' } } } } }
        '400': { $ref: '#/components/responses/GeneralRouteError' }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
        '404': { $ref: '#/components/responses/GeneralRouteError' }
    delete:
      servers: [{ url: /api }]
      operationId: deleteNativeAgentGoal
      responses:
        '200': { description: Deleted. }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
        '404': { $ref: '#/components/responses/GeneralRouteError' }
  /agents/{agentId}/notes:
    parameters:
      - { in: path, name: agentId, required: true, schema: { type: string } }
    get:
      servers: [{ url: /api }]
      operationId: listNativeAgentNotes
      summary: What it knows — every note, readable by the person it is about
      responses:
        '200':
          description: Notes, newest first.
          content:
            application/json:
              schema: { type: object, required: [notes], properties: { notes: { type: array, items: { $ref: '#/components/schemas/AgentNote' } } } }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
        '404': { $ref: '#/components/responses/GeneralRouteError' }
    post:
      servers: [{ url: /api }]
      operationId: createNativeAgentNote
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [content], properties: { content: { type: string, maxLength: 1000 } } }
      responses:
        '201':
          description: The note.
          content: { application/json: { schema: { type: object, required: [note], properties: { note: { $ref: '#/components/schemas/AgentNote' } } } } }
        '400': { $ref: '#/components/responses/GeneralRouteError' }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
        '404': { $ref: '#/components/responses/GeneralRouteError' }
        '409': { $ref: '#/components/responses/GeneralRouteError' }
  /agents/{agentId}/notes/{noteId}:
    parameters:
      - { in: path, name: agentId, required: true, schema: { type: string } }
      - { in: path, name: noteId, required: true, schema: { type: string } }
    patch:
      servers: [{ url: /api }]
      operationId: updateNativeAgentNote
      description: An edited note becomes the person's words (`source` = user).
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [content], properties: { content: { type: string, maxLength: 1000 } } }
      responses:
        '200':
          description: The note after the change.
          content: { application/json: { schema: { type: object, required: [note], properties: { note: { $ref: '#/components/schemas/AgentNote' } } } } }
        '400': { $ref: '#/components/responses/GeneralRouteError' }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
        '404': { $ref: '#/components/responses/GeneralRouteError' }
    delete:
      servers: [{ url: /api }]
      operationId: deleteNativeAgentNote
      description: Gone from every later turn, which reads notes with `deletedAt` null.
      responses:
        '200': { description: Deleted. }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
        '404': { $ref: '#/components/responses/GeneralRouteError' }
  /agents/{agentId}/ideas/{ideaId}:
    parameters:
      - { in: path, name: agentId, required: true, schema: { type: string } }
      - { in: path, name: ideaId, required: true, schema: { type: string } }
    patch:
      servers: [{ url: /api }]
      operationId: decideNativeAgentIdea
      summary: Start or dismiss an idea
      description: >-
        Start runs the idea as a task through the same dispatch any task uses.
        409 `confirm_expensive` carries `estimatedCostMicroUsd`; ask the person,
        then send the same request with `confirmExpensive: true`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [start, dismiss] }
                confirmExpensive: { type: boolean }
      responses:
        '200':
          description: The idea after the decision, with the task's ids when it started one.
          content:
            application/json:
              schema:
                type: object
                required: [idea]
                properties:
                  idea: { $ref: '#/components/schemas/AgentIdea' }
                  sessionId: { type: string }
                  conversationId: { type: string }
                  replay: { type: boolean }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
        '404': { $ref: '#/components/responses/GeneralRouteError' }
        '409': { $ref: '#/components/responses/GeneralRouteError' }
        '429': { $ref: '#/components/responses/GeneralRouteError' }
  /agents/{agentId}/routines:
    parameters:
      - { in: path, name: agentId, required: true, schema: { type: string } }
    get:
      servers: [{ url: /api }]
      operationId: listNativeAgentRoutines
      summary: The automations whose task belongs to this agent
      responses:
        '200':
          description: Routines, soonest first.
          content:
            application/json:
              schema: { type: object, required: [routines], properties: { routines: { type: array, items: { $ref: '#/components/schemas/AgentRoutine' } } } }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
        '404': { $ref: '#/components/responses/GeneralRouteError' }
    post:
      servers: [{ url: /api }]
      operationId: createNativeAgentRoutine
      summary: A cloud routine on a clock, firing into the agent's thread
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, instructions, cadence, timezone]
              properties:
                name: { type: string, maxLength: 120 }
                instructions: { type: string, maxLength: 4000 }
                cadence: { type: string, enum: [hourly, daily, weekdays, weekly, monthly] }
                hour: { type: integer, minimum: 0, maximum: 23 }
                minute: { type: integer, minimum: 0, maximum: 59 }
                weekday: { type: integer, minimum: 0, maximum: 6 }
                monthday: { type: integer, minimum: 1, maximum: 31 }
                timezone: { type: string, description: An IANA zone name. }
      responses:
        '201':
          description: The routine.
          content: { application/json: { schema: { type: object, required: [routine], properties: { routine: { $ref: '#/components/schemas/AgentRoutine' } } } } }
        '400': { $ref: '#/components/responses/GeneralRouteError' }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
        '403': { $ref: '#/components/responses/GeneralRouteError' }
        '404': { $ref: '#/components/responses/GeneralRouteError' }
        '429': { $ref: '#/components/responses/GeneralRouteError' }
  /agents/{agentId}/activity:
    parameters:
      - { in: path, name: agentId, required: true, schema: { type: string } }
    get:
      servers: [{ url: /api }]
      operationId: listNativeAgentActivity
      parameters:
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 200, default: 60 } }
      responses:
        '200':
          description: Its own events and one line per task, newest first.
          content:
            application/json:
              schema: { type: object, required: [activity], properties: { activity: { type: array, items: { $ref: '#/components/schemas/AgentActivity' } } } }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
        '404': { $ref: '#/components/responses/GeneralRouteError' }
  /agents/{agentId}/reflect:
    parameters:
      - { in: path, name: agentId, required: true, schema: { type: string } }
    post:
      servers: [{ url: /api }]
      operationId: reflectNativeAgent
      summary: Ideas, goal check-ins and notes — a no-op until six hours have passed, unless forced
      requestBody:
        content:
          application/json:
            schema: { type: object, properties: { force: { type: boolean } } }
      responses:
        '200':
          description: What happened.
          content:
            application/json:
              schema:
                type: object
                required: [outcome]
                properties:
                  outcome:
                    type: object
                    required: [kind]
                    properties:
                      kind: { type: string, enum: [reflected, skipped] }
                      reason: { type: string, enum: [not_due, paused, claimed, no_answer, not_found] }
                      ideas: { type: integer }
                      checkIns: { type: integer }
                      notes: { type: integer }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
        '404': { $ref: '#/components/responses/GeneralRouteError' }
        '429': { $ref: '#/components/responses/GeneralRouteError' }
  /agents/{agentId}/tasks:
    parameters:
      - { in: path, name: agentId, required: true, schema: { type: string } }
    post:
      servers: [{ url: /api }]
      operationId: startNativeAgentTask
      summary: Start a task as the agent, in its thread, under its autonomy
      description: >-
        409 `confirm_expensive` with `estimatedCostMicroUsd` means ask the
        person; the same request with `confirmExpensive: true` lands on the same
        idempotency key. Every refusal Work dispatch can give is passed through.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, goal, idempotencyKey]
              properties:
                title: { type: string, maxLength: 80 }
                goal: { type: string, maxLength: 4000 }
                idempotencyKey: { type: string, minLength: 8, maxLength: 200 }
                confirmExpensive: { type: boolean }
      responses:
        '200':
          description: This key's task already existed.
          content: { application/json: { schema: { $ref: '#/components/schemas/AgentTaskStarted' } } }
        '201':
          description: Started.
          content: { application/json: { schema: { $ref: '#/components/schemas/AgentTaskStarted' } } }
        '400': { $ref: '#/components/responses/GeneralRouteError' }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
        '403': { $ref: '#/components/responses/GeneralRouteError' }
        '404': { $ref: '#/components/responses/GeneralRouteError' }
        '409': { $ref: '#/components/responses/GeneralRouteError' }
        '429': { $ref: '#/components/responses/GeneralRouteError' }
  # ---------------------------------------------------------------------------
  # Push and the notifications inbox. /devices/apns is versioned; the inbox
  # lives under /api like Agents and Work and takes the same bearer. A push
  # names where it opens with a relative `path` (src/lib/notify/paths.ts) and
  # carries no decision: a notification only ever navigates.
  # ---------------------------------------------------------------------------
  /devices/apns:
    post:
      operationId: registerNativeApnsDevice
      summary: Register this device's APNs token, or change its two switches
      description: >-
        Upserts on the token, so re-POSTing is both how a launch refreshes the
        token and how a switch changes; a switch left out keeps the device's
        current choice. The token is tied to the calling device session and
        stops receiving pushes when that session signs out or is revoked, so a
        client does not need to DELETE on sign-out. `bundleId` is the APNs
        topic the server signs for and must be one of Juno's own apps.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ApnsDeviceRegistrationRequest' } } }
      responses:
        '200':
          description: The token as the server now holds it.
          content: { application/json: { schema: { $ref: '#/components/schemas/ApnsDeviceRegistrationResponse' } } }
        '400':
          description: Not an APNs token, not a Juno app, or a malformed body.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429':
          description: Too many registrations for this account this hour.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    delete:
      operationId: unregisterNativeApnsDevice
      summary: Stop pushes to a token for this account
      parameters:
        - { in: query, name: token, required: true, schema: { type: string, minLength: 10, maxLength: 512 } }
      responses:
        '200':
          description: Deactivated, or already inactive.
          content:
            application/json:
              schema: { type: object, required: [unregistered], properties: { unregistered: { const: true } } }
        '400':
          description: No token given.
          content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /notifications:
    get:
      servers: [{ url: /api }]
      operationId: listNativeNotifications
      summary: The inbox, newest first, a page at a time
      description: >-
        `before` is the opaque `nextBefore` of the previous page; clients pass
        it back and never build one. A bad `limit` or cursor answers 400.
      parameters:
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { in: query, name: before, schema: { type: string, maxLength: 160 } }
        - { in: query, name: unread, schema: { type: string, enum: ['true'] } }
      responses:
        '200':
          description: One page of notifications, and how many are unread in all.
          content: { application/json: { schema: { $ref: '#/components/schemas/NotificationsPage' } } }
        '400': { $ref: '#/components/responses/GeneralRouteError' }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
    post:
      servers: [{ url: /api }]
      operationId: markAllNativeNotificationsRead
      summary: Mark every notification read
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [action], properties: { action: { const: mark_all_read } } }
      responses:
        '200':
          description: How many were unread.
          content:
            application/json:
              schema:
                type: object
                required: [ok, markedCount]
                properties:
                  ok: { const: true }
                  markedCount: { type: integer, minimum: 0 }
        '400': { $ref: '#/components/responses/GeneralRouteError' }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
  /notifications/count:
    get:
      servers: [{ url: /api }]
      operationId: countNativeNotifications
      summary: The unread count, and whether any unread one is pressing
      responses:
        '200':
          description: Cheap enough to poll.
          content: { application/json: { schema: { $ref: '#/components/schemas/NotificationsCount' } } }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
  /notifications/{notificationId}:
    parameters:
      - { in: path, name: notificationId, required: true, schema: { type: string } }
    patch:
      servers: [{ url: /api }]
      operationId: markNativeNotificationRead
      summary: Mark one notification read
      description: >-
        Idempotent: a row already read answers `changed: false`. A client marks
        a notification read when its push is opened.
      responses:
        '200':
          description: Read.
          content:
            application/json:
              schema:
                type: object
                required: [ok, changed]
                properties:
                  ok: { const: true }
                  changed: { type: boolean }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
        '404': { $ref: '#/components/responses/GeneralRouteError' }
  /recents:
    get:
      servers: [{ url: /api }]
      operationId: listNativeRecents
      summary: The merged Chat, task, Code and project timeline, newest first
      description: >-
        What the Mac's Search panel lists before anything is typed ("Recent").
        Archived chats are left out. Each row carries the web path it opens.
      parameters:
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 200, default: 40 } }
        - { in: query, name: filter, schema: { type: string, default: all } }
      responses:
        '200':
          description: One page of recent rows, and a count per filter.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, kind, title, updatedAt, href]
                      properties:
                        id: { type: string }
                        kind: { type: string, enum: [chat, work, code, project] }
                        title: { type: string }
                        updatedAt: { type: string, format: date-time }
                        pinned: { type: boolean }
                        status: { type: string }
                        needsAttention: { type: boolean }
                        projectId: { type: [string, 'null'] }
                        href: { type: string }
                        subtitle: { type: string }
                  counts: { type: object, additionalProperties: { type: integer } }
                  filter: { type: string }
        '400': { $ref: '#/components/responses/GeneralRouteError' }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
  /search:
    get:
      servers: [{ url: /api }]
      operationId: searchNativeEverything
      summary: Unified search across everything the account owns
      description: >-
        The web palette's search (`src/lib/search/types.ts`). The Mac asks it
        for memory, knowledge and work (`types=memory,knowledge,work`) and
        searches chats, messages, projects, files and artifacts in its own
        encrypted store. Marks are UTF-16 offsets into the text they mark.
        `query` is echoed so a late answer can be dropped; an unknown type in
        `types` is ignored rather than refused.
      parameters:
        - { in: query, name: q, schema: { type: string, maxLength: 200 } }
        - { in: query, name: types, description: 'Comma-separated: conversation, message, project, file, knowledge, artifact, memory, work.', schema: { type: string, maxLength: 200 } }
        - { in: query, name: projectId, schema: { type: string, maxLength: 60 } }
        - { in: query, name: window, schema: { type: string, enum: [any, week, month, year] } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 25 } }
      responses:
        '200':
          description: Groups in the web's order, and what each source covered.
          content:
            application/json:
              schema:
                type: object
                required: [query, groups, total, coverage, partial]
                properties:
                  query: { type: string }
                  total: { type: integer, minimum: 0 }
                  partial: { type: boolean }
                  groups:
                    type: array
                    items:
                      type: object
                      required: [type, label, hits]
                      properties:
                        type: { type: string, enum: [conversation, message, project, file, knowledge, artifact, memory, work] }
                        label: { type: string }
                        hits:
                          type: array
                          items:
                            type: object
                            required: [id, type, title, titleMarks, snippet, href, locator, projectId, updatedAt, score]
                            properties:
                              id: { type: string }
                              type: { type: string }
                              title: { type: string }
                              titleMarks: { type: array, items: { type: object, required: [start, end], properties: { start: { type: integer }, end: { type: integer } } } }
                              snippet:
                                type: [object, 'null']
                                required: [text, marks]
                                properties:
                                  text: { type: string }
                                  marks: { type: array, items: { type: object, required: [start, end], properties: { start: { type: integer }, end: { type: integer } } } }
                              href: { type: string }
                              locator: { type: [string, 'null'] }
                              projectId: { type: [string, 'null'] }
                              updatedAt: { type: string, format: date-time }
                              score: { type: number }
                  coverage:
                    type: array
                    items:
                      type: object
                      required: [type, state, detail]
                      properties:
                        type: { type: string }
                        state: { type: string, enum: [complete, partial, unavailable] }
                        detail: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/GeneralRouteError' }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
  /share:
    get:
      servers: [{ url: /api }]
      operationId: listNativeShares
      summary: The account's live share links, newest first
      responses:
        '200':
          description: Every link that still works.
          content:
            application/json:
              schema:
                type: object
                required: [shares]
                properties:
                  shares: { type: array, items: { type: object, additionalProperties: true } }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
    post:
      servers: [{ url: /api }]
      operationId: createNativeShare
      summary: Create (or return the existing) share link for a chat or an artifact
      description: >-
        Idempotent per target. The link is a snapshot: later turns or edits
        stay private. A 403 with `code: share_taken_down` carries the sentence
        the client shows in place of the link, and is not retried.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - { type: object, required: [kind, conversationId], properties: { kind: { const: CHAT }, conversationId: { type: string } } }
                - { type: object, required: [kind, artifactId], properties: { kind: { const: ARTIFACT }, artifactId: { type: string } } }
      responses:
        '200':
          description: The link.
          content:
            application/json:
              schema:
                type: object
                required: [share]
                properties:
                  share:
                    type: object
                    required: [id, kind, token, url]
                    properties:
                      id: { type: string }
                      kind: { type: string, enum: [CHAT, ARTIFACT] }
                      token: { type: string }
                      url: { type: string, format: uri }
                      title: { type: [string, 'null'] }
                      snapshotAt: { type: string, format: date-time }
                      views: { type: integer, minimum: 0 }
                      createdAt: { type: string, format: date-time }
        '400': { $ref: '#/components/responses/GeneralRouteError' }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
        '403':
          description: This target cannot be shared.
          content:
            application/json:
              schema: { type: object, required: [code], properties: { code: { const: share_taken_down }, error: { type: string } } }
        '404': { $ref: '#/components/responses/GeneralRouteError' }
  /share/{shareId}:
    parameters:
      - { in: path, name: shareId, required: true, schema: { type: string } }
    delete:
      servers: [{ url: /api }]
      operationId: revokeNativeShare
      summary: Revoke a share link; anyone opening it afterwards sees nothing
      responses:
        '200':
          description: Revoked.
          content: { application/json: { schema: { type: object, additionalProperties: true } } }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
        '404': { $ref: '#/components/responses/GeneralRouteError' }
  # ---------------------------------------------------------------------------
  # Juno Work
  #
  # These are the routes the shipped Swift clients already call, and only those.
  # The list was derived by reading native/Packages/JunoNativeKit/Sources/
  # JunoWorkKit rather than by enumerating src/app/api/work, because a contract
  # written from the server's directory listing documents endpoints nothing
  # calls while leaving the ones a released app depends on undescribed — which
  # is the exact shape the drift gate was supposed to prevent and did not, since
  # it could only guard what was written down.
  #
  # Work sits under /api, not /api/v1: it predates the versioned surface and the
  # clients address it directly, so every operation carries the same per-
  # operation `servers` override that /chat and /code already use.
  #
  # Vocabularies (status, target, risk, decision, command kind, host state,
  # artifact kind, trigger kind) are NOT re-enumerated here. They are generated
  # into both halves from contracts/work/juno-work-v1.json, and a second copy in
  # this file would be a second source of truth that drifts silently — the
  # failure the generated Swift contract exists to prevent. Each such field
  # instead names its vocabulary in `x-juno-work-vocabulary`.
  # ---------------------------------------------------------------------------
  /work/hosts:
    get:
      servers: [{ url: /api }]
      operationId: listNativeWorkHosts
      summary: Macs signed in to Juno Work for this account
      description: >-
        Most-recently-seen first. `state` is narrowed by the heartbeat window
        before it is serialized, so a Mac that stopped beating cannot be
        reported as `online` on the strength of a stale column. Read on a timer:
        reachability is a heartbeat fact, and dispatching local work from a
        stale list queues it at a machine that is asleep.
      responses:
        '200':
          description: Every registered host, revoked ones included.
          content: { application/json: { schema: { $ref: '#/components/schemas/WorkHostsResponse' } } }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
  /work/hosts/register:
    post:
      servers: [{ url: /api }]
      operationId: registerNativeWorkHost
      summary: Register this Mac for Work, or re-advertise what it can do
      description: >-
        Registration and heartbeat are the same statement — this is what this
        machine can do right now — so they are one route. It is also the only
        route that returns the `WorkHost` id, which the relay claim loop cannot
        run without. Deliberately not PATCH /work/hosts/{hostId}: that is the
        owner's narrowing surface and accepts no capability manifest, so a
        heartbeat sent there wrote a few booleans, discarded the manifest and
        never refreshed presence.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkHostRegistrationRequest' }
      responses:
        '200':
          description: >-
            The stored host plus the capability names this relay will actually
            route on, so a newer Mac can see which half of its advertisement is
            being ignored rather than infer it from work that never arrives.
          content: { application/json: { schema: { $ref: '#/components/schemas/WorkHostRegistrationResponse' } } }
        '400': { $ref: '#/components/responses/GeneralRouteError' }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
        '403': { $ref: '#/components/responses/GeneralRouteError' }
        '404': { $ref: '#/components/responses/GeneralRouteError' }
        '429': { $ref: '#/components/responses/GeneralRouteError' }
  /work/hosts/{hostId}:
    get:
      servers: [{ url: /api }]
      operationId: getNativeWorkHost
      summary: One Mac and what has been shared with it
      description: >-
        The Permissions host page reads this. Grants are named, never located:
        no path reaches a client that is not the Mac holding it.
        `pendingCommands` and `routableCapabilities` are absent from an older
        deployment and are read tolerantly.
      parameters:
        - in: path
          name: hostId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The host, its grants, the instructions still on their way to it, and what it offered that this relay can route.
          content: { application/json: { schema: { $ref: '#/components/schemas/WorkHostDetailResponse' } } }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
        '404': { $ref: '#/components/responses/GeneralRouteError' }
    patch:
      servers: [{ url: /api }]
      operationId: updateNativeWorkHost
      summary: Change a Mac's switches or ceiling, or restore its access
      description: >-
        `hostPatchSchema`: the master switch, the five capability switches, the
        approval ceiling, and `revoked: false` to un-revoke. The apps and sites
        lists and the capability manifest are the Mac's to report and are
        refused here. Switching a capability on that the Mac has not offered
        leaves it off and names it in `refused`.
      parameters:
        - in: path
          name: hostId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                enabled: { type: boolean }
                allowsFileWork: { type: boolean }
                allowsBrowser: { type: boolean }
                allowsComputerUse: { type: boolean }
                allowsShell: { type: boolean }
                allowsBackground: { type: boolean }
                approvalPolicy: { type: string, x-juno-work-vocabulary: permissionPolicies }
                revoked: { const: false }
      responses:
        '200':
          description: The host as it now stands.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required: [host]
                properties:
                  host: { $ref: '#/components/schemas/WorkHost' }
                  refused: { type: array, items: { type: string } }
        '400': { $ref: '#/components/responses/GeneralRouteError' }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
        '404': { $ref: '#/components/responses/GeneralRouteError' }
        '409': { $ref: '#/components/responses/GeneralRouteError' }
    delete:
      servers: [{ url: /api }]
      operationId: revokeNativeWorkHost
      summary: Revoke a Mac's access
      description: >-
        From this moment the Mac can claim nothing; what was queued or claimed
        for it is cancelled and counted in `cancelledCommands`. It stays listed,
        heartbeating, so its access can be restored.
      parameters:
        - in: path
          name: hostId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The revoked host and how many instructions were cancelled.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required: [host]
                properties:
                  host: { $ref: '#/components/schemas/WorkHost' }
                  cancelledCommands: { type: integer, minimum: 0 }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
        '404': { $ref: '#/components/responses/GeneralRouteError' }
  /work/hosts/{hostId}/commands:
    get:
      servers: [{ url: /api }]
      operationId: claimNextNativeWorkCommand
      summary: Long-poll for the next command addressed to this host
      description: >-
        Held open until a command arrives or the poll times out. `command: null`
        is the ordinary idle outcome and not an error — a client that treats it
        as one turns every quiet minute into a broken relay. `protocolVersion`
        is the wire generation this host can parse; the relay withholds any kind
        above it rather than sending one the host would refuse.
      parameters:
        - in: path
          name: hostId
          required: true
          schema: { type: string }
        - in: query
          name: protocolVersion
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: The next command, or null when the poll expired idle.
          content: { application/json: { schema: { $ref: '#/components/schemas/WorkCommandClaimResponse' } } }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
        '403': { $ref: '#/components/responses/GeneralRouteError' }
        '404': { $ref: '#/components/responses/GeneralRouteError' }
  /work/hosts/{hostId}/commands/{commandId}:
    post:
      servers: [{ url: /api }]
      operationId: acknowledgeNativeWorkCommand
      summary: Report the outcome of a claimed command
      description: >-
        A failed command still has to be acknowledged. Silence strands it: the
        lease holds, no other process may take it, and the user reads a task
        that is starting for ever. `error` is truncated by the caller to the
        relay's ceiling, because a rejected acknowledgement leaves the command
        claimed for the reason that the explanation was too long to accept.
      parameters:
        - in: path
          name: hostId
          required: true
          schema: { type: string }
        - in: path
          name: commandId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkCommandAcknowledgement' }
      responses:
        '200':
          description: >-
            The stored command. `replay: true` marks an acknowledgement that had
            already been recorded, so a retry is a lookup rather than a second
            write.
          content: { application/json: { schema: { $ref: '#/components/schemas/WorkCommandResponse' } } }
        '400': { $ref: '#/components/responses/GeneralRouteError' }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
        '403': { $ref: '#/components/responses/GeneralRouteError' }
        '404': { $ref: '#/components/responses/GeneralRouteError' }
  /work/hosts/{hostId}/events:
    post:
      servers: [{ url: /api }]
      operationId: appendNativeWorkHostEvents
      summary: Deliver a batch of run events produced on this Mac
      description: >-
        The host outbox. Every event carries the producer's `eventKey`, so a
        batch whose POST succeeded and whose response was lost is recognised as
        a re-delivery instead of shown to the user twice. `firstGap` being
        non-null means re-send from there.
      parameters:
        - in: path
          name: hostId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkHostEventBatch' }
      responses:
        '200':
          description: Relay cursor, producer cursor, and what was deduplicated.
          content: { application/json: { schema: { $ref: '#/components/schemas/WorkHostEventBatchResponse' } } }
        '400': { $ref: '#/components/responses/GeneralRouteError' }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
        '403': { $ref: '#/components/responses/GeneralRouteError' }
        '404': { $ref: '#/components/responses/GeneralRouteError' }
  /work/sessions:
    get:
      servers: [{ url: /api }]
      operationId: listNativeWorkSessions
      description: Owner-scoped Work tasks, most-recently-active first.
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: archived
          description: Include archived tasks. Absent means live tasks only.
          schema: { type: string, enum: ['true'] }
        - in: query
          name: projectId
          description: Only tasks filed under this project.
          schema: { type: string, minLength: 1, maxLength: 200 }
        - in: query
          name: conversationId
          description: Only tasks started from this chat. Pinned-first ordering is dropped, so the first row is the chat's newest task.
          schema: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '200':
          description: Task summaries without join-table context — see /work/sessions/{sessionId}/context.
          content: { application/json: { schema: { $ref: '#/components/schemas/WorkSessionsResponse' } } }
        '400': { $ref: '#/components/responses/GeneralRouteError' }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
    post:
      servers: [{ url: /api }]
      operationId: createNativeWorkSession
      summary: Compose a task
      description: >-
        Created in `draft`; it costs nothing until a run is started against it.
        `idempotencyKey` belongs to the composition, not the request — a client
        mints one per composition and reuses it only when retrying that one, so
        a phone on a bad connection gets a lookup instead of a second task.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkSessionCreateRequest' }
      responses:
        '200':
          description: The task an earlier request with this key already created.
          content: { application/json: { schema: { $ref: '#/components/schemas/WorkSessionResponse' } } }
        '201':
          description: The created task.
          content: { application/json: { schema: { $ref: '#/components/schemas/WorkSessionResponse' } } }
        '400': { $ref: '#/components/responses/GeneralRouteError' }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
        '402': { $ref: '#/components/responses/GeneralRouteError' }
        '404': { $ref: '#/components/responses/GeneralRouteError' }
        '429': { $ref: '#/components/responses/GeneralRouteError' }
  /work/sessions/{sessionId}:
    get:
      servers: [{ url: /api }]
      operationId: getNativeWorkSession
      description: >-
        The task, its current attempt, and that attempt's pending approvals.
        `approvals` is required rather than optional: while the route omitted
        it, a task stopped waiting for permission looked exactly like a task
        that was still working.
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Task, current run and pending approvals.
          content: { application/json: { schema: { $ref: '#/components/schemas/WorkSessionDetailResponse' } } }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
        '404': { $ref: '#/components/responses/GeneralRouteError' }
    patch:
      servers: [{ url: /api }]
      operationId: updateNativeWorkSession
      description: Title, pin and archive. Everything that shapes execution lives on /context.
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkSessionEditRequest' }
      responses:
        '200':
          description: The updated task.
          content: { application/json: { schema: { $ref: '#/components/schemas/WorkSessionResponse' } } }
        '400': { $ref: '#/components/responses/GeneralRouteError' }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
        '404': { $ref: '#/components/responses/GeneralRouteError' }
    delete:
      servers: [{ url: /api }]
      operationId: deleteNativeWorkSession
      description: Soft-deletes the task and stops any live attempt.
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Acknowledged.
          content: { application/json: { schema: { $ref: '#/components/schemas/WorkOkResponse' } } }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
        '404': { $ref: '#/components/responses/GeneralRouteError' }
  /work/sessions/{sessionId}/context:
    get:
      servers: [{ url: /api }]
      operationId: getNativeWorkSessionContext
      summary: The durable choices that shape a task before any attempt runs
      description: >-
        `connectorIds` is ABSENT, not empty, when the user was never asked which
        apps this task may reach. The two are different facts — "inherits the
        account's apps" and "was offered them and chose none" — and a client
        that materialises `[]` for the missing key turns every older task's
        implicit access into an explicit refusal. Clients must preserve absence.
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Model, effort, approval posture, apps and files.
          content: { application/json: { schema: { $ref: '#/components/schemas/WorkSessionContextResponse' } } }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
        '404': { $ref: '#/components/responses/GeneralRouteError' }
    patch:
      servers: [{ url: /api }]
      operationId: updateNativeWorkSessionContext
      summary: Change a task's context and read back when each change takes effect
      description: >-
        A model or approval change applies to the next attempt; taking an app or
        file away can apply immediately. The route answers with `applied` and
        `currentRun` so a client states the server's verdict rather than
        guessing from the control that was pressed.
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkSessionContextEditRequest' }
      responses:
        '200':
          description: The stored context, the task, and when each change lands.
          content: { application/json: { schema: { $ref: '#/components/schemas/WorkSessionContextUpdateResponse' } } }
        '400': { $ref: '#/components/responses/GeneralRouteError' }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
        '404': { $ref: '#/components/responses/GeneralRouteError' }
        '429': { $ref: '#/components/responses/GeneralRouteError' }
  /work/sessions/{sessionId}/runs:
    post:
      servers: [{ url: /api }]
      operationId: startNativeWorkRun
      summary: Dispatch a new attempt
      description: >-
        `requestedTarget` is a request, not an outcome. The server picks the
        effective target from the capabilities the plan needs and the hosts that
        are actually reachable, and reports any difference as a degradation on
        the run and in `selection`. A client that renders the requested target
        as the result tells its user the task ran on their Mac when it ran in
        the cloud without their files.
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkRunStartRequest' }
      responses:
        '200':
          description: The attempt an earlier request with this key already started.
          content: { application/json: { schema: { $ref: '#/components/schemas/WorkRunResponse' } } }
        '201':
          description: The dispatched attempt and the target selection behind it.
          content: { application/json: { schema: { $ref: '#/components/schemas/WorkRunDispatchResponse' } } }
        '400': { $ref: '#/components/responses/GeneralRouteError' }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
        '402': { $ref: '#/components/responses/GeneralRouteError' }
        '404': { $ref: '#/components/responses/GeneralRouteError' }
        '409': { $ref: '#/components/responses/GeneralRouteError' }
        '429': { $ref: '#/components/responses/GeneralRouteError' }
  /work/sessions/{sessionId}/events:
    get:
      servers: [{ url: /api }]
      operationId: streamNativeWorkEvents
      summary: Follow a task's event log from a cursor
      description: >-
        Server-sent events, strictly after `after`. Resuming from the last
        applied sequence is what makes a reconnect cheap and a replayed page
        recognisable as already-applied by sequence rather than by content.
        Clients must reject a 200 whose content-type is not text/event-stream:
        a captive portal answers 200 with HTML, and a parser that grinds through
        a login page reports "malformed event" for something that is not one.
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string }
        - in: query
          name: after
          required: true
          description: Last applied event `seq`. 0 streams from the beginning.
          schema: { type: integer, minimum: 0 }
      responses:
        '200':
          description: >-
            Progressive Work events, each frame encoded as `data: {json}\n\n`.
          content:
            text/event-stream:
              schema:
                type: string
                x-juno-event-schema: '#/components/schemas/WorkEvent'
        '401': { $ref: '#/components/responses/GeneralRouteError' }
        '404': { $ref: '#/components/responses/GeneralRouteError' }
  /work/sessions/{sessionId}/answer:
    post:
      servers: [{ url: /api }]
      operationId: submitNativeWorkSubmission
      summary: Reply to a question, or steer a run that asked nothing
      description: >-
        One route, two submissions, told apart by the mere PRESENCE of
        `questionId`. A client must never put an empty or placeholder
        `questionId` on the wire: a note typed while Juno works would then be
        recorded as the reply to whatever it asks next. The two have opposite
        preconditions — an answer needs a run that is waiting for one, an
        instruction needs a run that is not — and only the instruction form
        carries `delivered`/`explanation`, because only it can be accepted by
        the log and still fail to reach a Mac.
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkSubmissionRequest' }
      responses:
        '200':
          description: The relay cursor, plus the delivery verdict for an instruction.
          content: { application/json: { schema: { $ref: '#/components/schemas/WorkSubmissionResponse' } } }
        '400': { $ref: '#/components/responses/GeneralRouteError' }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
        '404': { $ref: '#/components/responses/GeneralRouteError' }
        '409': { $ref: '#/components/responses/GeneralRouteError' }
        '503': { $ref: '#/components/responses/GeneralRouteError' }
  /work/runs/{runId}/control:
    post:
      servers: [{ url: /api }]
      operationId: controlNativeWorkRun
      summary: Pause, resume, stop or undo an attempt
      description: >-
        `command` is null for a cloud run, which has no Mac to instruct, and for
        a Mac that could not be told. Stated either way rather than omitted, so
        a client can distinguish "recorded" from "recorded and delivered".
      parameters:
        - in: path
          name: runId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkRunControlRequest' }
      responses:
        '200':
          description: The attempt after the control, and the command queued for a host.
          content: { application/json: { schema: { $ref: '#/components/schemas/WorkRunControlResponse' } } }
        '400': { $ref: '#/components/responses/GeneralRouteError' }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
        '404': { $ref: '#/components/responses/GeneralRouteError' }
        '409': { $ref: '#/components/responses/GeneralRouteError' }
  /work/approvals/{approvalId}/decision:
    post:
      servers: [{ url: /api }]
      operationId: decideNativeWorkApproval
      summary: Answer one approval request
      description: >-
        `actionDigest` is required and is the point of the route. An approval
        that says "allow file writes" can be replayed against a different write
        than the one shown; an approval bound to the hash of the exact
        normalised action cannot. The server echoes the row it wrote, and a
        client must refuse a response whose digest is not the one it rendered —
        that means the request was superseded between render and tap, and
        showing a decided card for an action the user was never shown is the
        failure this check exists for.
      parameters:
        - in: path
          name: approvalId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkApprovalDecisionRequest' }
      responses:
        '200':
          description: The decided approval, and the command queued for a host.
          content: { application/json: { schema: { $ref: '#/components/schemas/WorkApprovalDecisionResponse' } } }
        '400': { $ref: '#/components/responses/GeneralRouteError' }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
        '404': { $ref: '#/components/responses/GeneralRouteError' }
        '409': { $ref: '#/components/responses/GeneralRouteError' }
        '410': { $ref: '#/components/responses/GeneralRouteError' }
  /work/artifacts:
    get:
      servers: [{ url: /api }]
      operationId: listNativeWorkArtifacts
      summary: The durable deliverables attached to one task
      description: >-
        The authoritative catalogue for actions such as Save. The event log is
        not one: an event can arrive before the object is stored, an update can
        replace an earlier version, and a reconnect can replay it.
      parameters:
        - in: query
          name: sessionId
          required: true
          schema: { type: string }
        - in: query
          name: kind
          schema: { type: string }
          x-juno-work-vocabulary: artifactKinds
      responses:
        '200':
          description: Deliverable head rows, newest-updated first.
          content: { application/json: { schema: { $ref: '#/components/schemas/WorkArtifactsResponse' } } }
        '400': { $ref: '#/components/responses/GeneralRouteError' }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
  /work/artifacts/{artifactId}:
    get:
      servers: [{ url: /api }]
      operationId: getNativeWorkArtifact
      description: >-
        One deliverable and a bounded, immutable version history, newest first.
        `truncated` says the history was cut at the route's ceiling rather than
        that it is complete.
      parameters:
        - in: path
          name: artifactId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The deliverable with its version history.
          content: { application/json: { schema: { $ref: '#/components/schemas/WorkArtifactDetailResponse' } } }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
        '404': { $ref: '#/components/responses/GeneralRouteError' }
  /work/artifacts/{artifactId}/download:
    get:
      servers: [{ url: /api }]
      operationId: downloadNativeWorkArtifact
      summary: The stored bytes, after their recorded SHA-256 has been re-checked
      description: >-
        Bytes are served only once the route has verified the content hash it
        stored. `x-juno-validated` reports whether the export validator ever
        opened the file back up — a file can be served by explicit user request
        and still never have passed validation, and the save UI has to be able
        to say so.
      parameters:
        - in: path
          name: artifactId
          required: true
          schema: { type: string }
        - in: query
          name: version
          description: Defaults to the current version.
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: The stored bytes.
          headers:
            x-juno-artifact-version:
              required: true
              description: The version actually served.
              schema: { type: integer, minimum: 1 }
            x-juno-validated:
              required: true
              description: '"true" only when the export validator parsed this exact version.'
              schema: { type: string, enum: ['true', 'false'] }
            x-juno-validation-warning:
              description: Present when the file is served despite a validator complaint.
              schema: { type: string }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
        '404': { $ref: '#/components/responses/GeneralRouteError' }
        '409': { $ref: '#/components/responses/GeneralRouteError' }
  /work/schedules:
    get:
      servers: [{ url: /api }]
      operationId: listNativeWorkSchedules
      description: Durable automations for this account, each with its full trigger set.
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
        - in: query
          name: enabled
          schema: { type: string, enum: ['true', 'false'] }
        - in: query
          name: sessionId
          schema: { type: string }
      responses:
        '200':
          description: Schedules with their triggers.
          content: { application/json: { schema: { $ref: '#/components/schemas/WorkSchedulesResponse' } } }
        '400': { $ref: '#/components/responses/GeneralRouteError' }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
    post:
      servers: [{ url: /api }]
      operationId: createNativeWorkSchedule
      description: Creates a schedule and its triggers together.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkScheduleWriteRequest' }
      responses:
        '201':
          description: The created schedule.
          content: { application/json: { schema: { $ref: '#/components/schemas/WorkScheduleResponse' } } }
        '400': { $ref: '#/components/responses/GeneralRouteError' }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
        '404': { $ref: '#/components/responses/GeneralRouteError' }
        '409': { $ref: '#/components/responses/GeneralRouteError' }
  /work/schedules/{scheduleId}:
    get:
      servers: [{ url: /api }]
      operationId: getNativeWorkSchedule
      summary: One schedule
      description: For an automation page opened before the list holds it.
      parameters:
        - in: path
          name: scheduleId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The schedule.
          content: { application/json: { schema: { $ref: '#/components/schemas/WorkScheduleResponse' } } }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
        '404': { $ref: '#/components/responses/GeneralRouteError' }
    patch:
      servers: [{ url: /api }]
      operationId: updateNativeWorkSchedule
      summary: Replace the editable fields of a schedule
      description: >-
        When `triggers` is present it REPLACES the set. That is deliberate: a
        merge would leave a trigger the user deleted still firing, because
        nothing in a partial edit says "and no others". A request that only
        flips `enabled` omits `triggers` entirely and leaves them untouched.
      parameters:
        - in: path
          name: scheduleId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkScheduleWriteRequest' }
      responses:
        '200':
          description: The updated schedule.
          content: { application/json: { schema: { $ref: '#/components/schemas/WorkScheduleResponse' } } }
        '400': { $ref: '#/components/responses/GeneralRouteError' }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
        '404': { $ref: '#/components/responses/GeneralRouteError' }
        '409': { $ref: '#/components/responses/GeneralRouteError' }
    delete:
      servers: [{ url: /api }]
      operationId: deleteNativeWorkSchedule
      description: Removes the schedule and its triggers. Runs it already started are untouched.
      parameters:
        - in: path
          name: scheduleId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Acknowledged.
          content: { application/json: { schema: { $ref: '#/components/schemas/WorkOkResponse' } } }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
        '404': { $ref: '#/components/responses/GeneralRouteError' }
  /work/schedules/{scheduleId}/run-now:
    post:
      servers: [{ url: /api }]
      operationId: runNativeWorkScheduleNow
      summary: Fire a schedule once without moving its clock
      description: >-
        `nextRunAt` is stated back rather than omitted, so a client never has to
        infer from the absence of a change that this route left the schedule's
        own clock alone. It did.
      parameters:
        - in: path
          name: scheduleId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [idempotencyKey]
              properties:
                idempotencyKey: { type: string, minLength: 8, maxLength: 200 }
      responses:
        '200':
          description: The attempt an earlier request with this key already started.
          content: { application/json: { schema: { $ref: '#/components/schemas/WorkScheduleRunNowResponse' } } }
        '201':
          description: The dispatched attempt and the target selection behind it.
          content: { application/json: { schema: { $ref: '#/components/schemas/WorkScheduleRunNowResponse' } } }
        '400': { $ref: '#/components/responses/GeneralRouteError' }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
        '404': { $ref: '#/components/responses/GeneralRouteError' }
        '409': { $ref: '#/components/responses/GeneralRouteError' }
        '429': { $ref: '#/components/responses/GeneralRouteError' }
  /work/schedules/{scheduleId}/runs:
    get:
      servers: [{ url: /api }]
      operationId: listNativeWorkScheduleRuns
      description: >-
        This schedule's attempts, newest first. `nextBefore` is ABSENT on a
        short page — a cursor echoed back unconditionally is how a client that
        pages until it disappears loops for ever.
      parameters:
        - in: path
          name: scheduleId
          required: true
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: before
          description: Keyset cursor — the `createdAt` of the last row already seen.
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Attempts for this schedule.
          content: { application/json: { schema: { $ref: '#/components/schemas/WorkScheduleRunsResponse' } } }
        '400': { $ref: '#/components/responses/GeneralRouteError' }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
        '404': { $ref: '#/components/responses/GeneralRouteError' }
  /memory/{memoryId}:
    parameters:
      - in: path
        name: memoryId
        required: true
        schema: { type: string }
    patch:
      servers: [{ url: /api }]
      operationId: updateNativeMemoryEntry
      description: >-
        One body shape per verb, as the memory page sends it: `{ content }`
        rewrites a fact (reclassified and re-dated server-side), `{ forget: true }`
        retires it and adds a never-remember entry, `{ projectId }` files it in a
        project or, with null, back under the whole account. Refusals answer
        `{ error, code? }` with a sentence written for the reader.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MemoryEntryPatch' } } }
      responses:
        '200': { description: Changed., content: { application/json: { schema: { $ref: '#/components/schemas/MemoryOkResponse' } } } }
        '400': { $ref: '#/components/responses/GeneralRouteError' }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
        '404': { $ref: '#/components/responses/GeneralRouteError' }
        '409': { $ref: '#/components/responses/GeneralRouteError' }
    delete:
      servers: [{ url: /api }]
      operationId: deleteNativeMemoryEntry
      description: Deletes one row. A 404 is the outcome asked for (already gone), and clients treat it as success.
      responses:
        '200': { description: Deleted., content: { application/json: { schema: { $ref: '#/components/schemas/MemoryOkResponse' } } } }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
        '404': { $ref: '#/components/responses/GeneralRouteError' }
  /memory/edit:
    post:
      servers: [{ url: /api }]
      operationId: draftNativeMemoryEdit
      description: >-
        Drafts a natural-language instruction into a reviewable change and
        writes nothing: `{ proposal: { summary, operations } }`, or
        `{ refusal }` when the model declines. 409 with `code:
        background_policy_denied` when the account's provider policy refuses
        background work.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [instruction]
              properties: { instruction: { type: string, minLength: 1, maxLength: 600 } }
      responses:
        '200': { description: A proposal or a refusal., content: { application/json: { schema: { $ref: '#/components/schemas/MemoryDraftResponse' } } } }
        '400': { $ref: '#/components/responses/GeneralRouteError' }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
        '409': { $ref: '#/components/responses/GeneralRouteError' }
        '502': { $ref: '#/components/responses/GeneralRouteError' }
        '503': { $ref: '#/components/responses/GeneralRouteError' }
  /memory/edit/apply:
    post:
      servers: [{ url: /api }]
      operationId: applyNativeMemoryEdit
      description: Commits operations and answers with the whole fresh list and the inverse an Undo applies.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operations]
              properties: { operations: { type: array, items: { $ref: '#/components/schemas/MemoryOperation' } } }
      responses:
        '200': { description: Applied., content: { application/json: { schema: { $ref: '#/components/schemas/MemoryApplyResponse' } } } }
        '400': { $ref: '#/components/responses/GeneralRouteError' }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
        '409': { $ref: '#/components/responses/GeneralRouteError' }
  /memory/edits:
    get:
      servers: [{ url: /api }]
      operationId: listNativeMemoryEdits
      description: The server-synced edit ledger, newest first, capped at 20.
      responses:
        '200': { description: The ledger., content: { application/json: { schema: { $ref: '#/components/schemas/MemoryEditsResponse' } } } }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
    post:
      servers: [{ url: /api }]
      operationId: createNativeMemoryEdits
      description: Records drafted, refused or imported edits; `clientId` is the idempotency key. Answers with the whole ledger.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [edits]
              properties: { edits: { type: array, items: { $ref: '#/components/schemas/MemoryEditDraft' } } }
      responses:
        '201': { description: The ledger., content: { application/json: { schema: { $ref: '#/components/schemas/MemoryEditsResponse' } } } }
        '400': { $ref: '#/components/responses/GeneralRouteError' }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
  /memory/edits/{editId}:
    parameters:
      - in: path
        name: editId
        required: true
        schema: { type: string }
    patch:
      servers: [{ url: /api }]
      operationId: updateNativeMemoryEdit
      description: Marks an edit applied (with the server's inverse), rejected (with a note) or pending again after an Undo (inverse null).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [pending, applied, rejected] }
                note: { type: string }
                inverse: { type: [array, 'null'], items: { $ref: '#/components/schemas/MemoryOperation' } }
      responses:
        '200': { description: The ledger., content: { application/json: { schema: { $ref: '#/components/schemas/MemoryEditsResponse' } } } }
        '400': { $ref: '#/components/responses/GeneralRouteError' }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
        '404': { $ref: '#/components/responses/GeneralRouteError' }
    delete:
      servers: [{ url: /api }]
      operationId: deleteNativeMemoryEdit
      description: Discards a waiting edit or removes one from the history. Answers with the ledger.
      responses:
        '200': { description: The ledger., content: { application/json: { schema: { $ref: '#/components/schemas/MemoryEditsResponse' } } } }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
        '404': { $ref: '#/components/responses/GeneralRouteError' }
  /memory/recap:
    get:
      servers: [{ url: /api }]
      operationId: getNativeMemoryRecap
      description: The recap's server half — chat themes and the chat count over a period. The rest is computed client-side from GET /memory.
      parameters:
        - in: query
          name: days
          schema: { type: integer, enum: [7, 30, 90] }
      responses:
        '200':
          description: Themes and a count.
          content:
            application/json:
              schema:
                type: object
