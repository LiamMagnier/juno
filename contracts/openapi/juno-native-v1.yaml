      responses:
        '200': { description: The library., content: { application/json: { schema: { $ref: '#/components/schemas/SkillLibraryResponse' } } } }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
  /skills/sources/{sourceId}:
    parameters:
