      responses:
        '200': { description: The new summary, or null when there is nothing to write it from., content: { application/json: { schema: { type: object, additionalProperties: true, properties: { summary: { oneOf: [{ $ref: '#/components/schemas/MemorySummary' }, { type: 'null' }] } } } } } }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
        '409': { $ref: '#/components/responses/GeneralRouteError' }
        '502': { $ref: '#/components/responses/GeneralRouteError' }
        '503': { $ref: '#/components/responses/GeneralRouteError' }
  /projects/{projectId}/memory:
    post:
      servers: [{ url: /api }]
