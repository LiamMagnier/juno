        '200': { description: The approved version., content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
        '404': { $ref: '#/components/responses/GeneralRouteError' }
        '409': { $ref: '#/components/responses/GeneralRouteError' }
  /assistants:
    get:
      servers: [{ url: /api }]
      operationId: listNativeAssistants
      description: The account's reusable assistants (WorkSkill rows of kind assistant), most recently updated first.
      responses:
        '200': { description: The gallery., content: { application/json: { schema: { type: object, additionalProperties: true, properties: { assistants: { type: array, items: { $ref: '#/components/schemas/Assistant' } } } } } } }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
        '500': { $ref: '#/components/responses/GeneralRouteError' }
    post:
      servers: [{ url: /api }]
      operationId: createNativeAssistant
      description: Creates an assistant. Auto is sent as an absent `preferredModelId`.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AssistantWrite' } } }
      responses:
        '201': { description: The assistant., content: { application/json: { schema: { type: object, additionalProperties: true, properties: { assistant: { $ref: '#/components/schemas/Assistant' } } } } } }
        '400': { $ref: '#/components/responses/GeneralRouteError' }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
        '500': { $ref: '#/components/responses/GeneralRouteError' }
  /assistants/{assistantId}:
    parameters:
      - in: path
        name: assistantId
        required: true
        schema: { type: string }
    patch:
      servers: [{ url: /api }]
      operationId: updateNativeAssistant
      description: Saves an edit, or `{ isPinned }` alone to pin or unpin.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: true } } }
      responses:
        '200': { description: The assistant., content: { application/json: { schema: { type: object, additionalProperties: true, properties: { assistant: { $ref: '#/components/schemas/Assistant' } } } } } }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
        '404': { $ref: '#/components/responses/GeneralRouteError' }
    delete:
      servers: [{ url: /api }]
      operationId: deleteNativeAssistant
      description: Removes it from the library; existing chats are not deleted.
      responses:
        '200': { description: Deleted., content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
        '404': { $ref: '#/components/responses/GeneralRouteError' }
  /work/schedules/{scheduleId}/token:
    post:
      servers: [{ url: /api }]
      operationId: issueNativeWorkScheduleFireToken
      summary: Issue (or roll) the token something outside Juno fires this automation with
      description: >-
        Returned once: only its hash is stored. Issuing another replaces the one
        before, which stops working.
      parameters:
        - in: path
          name: scheduleId
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '200':
          description: The token, when it was issued, and the fire URL.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required: [token]
                properties:
                  token: { type: string }
                  issuedAt: { type: string, format: date-time }
                  url: { type: string }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
        '404': { $ref: '#/components/responses/GeneralRouteError' }
        '409': { $ref: '#/components/responses/GeneralRouteError' }
    delete:
      servers: [{ url: /api }]
      operationId: revokeNativeWorkScheduleFireToken
      summary: Revoke the fire token
      parameters:
        - in: path
          name: scheduleId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Acknowledged. Anything still calling with the token now gets a 401.
          content: { application/json: { schema: { type: object, additionalProperties: true } } }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
        '404': { $ref: '#/components/responses/GeneralRouteError' }
components:
  securitySchemes:
    nativeBearer: { type: http, scheme: bearer, bearerFormat: JWT }
  responses:
    InvalidGrant:
      description: Grant invalid, expired, reused, or mismatched.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    Unauthorized:
      description: Credential missing, expired, invalid, reused, or revoked.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    NotFound:
      description: Resource not found within the authenticated account.
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorEnvelope' } } }
    GeneralRouteError:
      description: Legacy general-route error; normalization is tracked by GAP-006.
      content: { application/json: { schema: { $ref: '#/components/schemas/GeneralRouteErrorEnvelope' } } }
  schemas:
    TokenExchangeRequest:
      type: object
      additionalProperties: false
      required: [code, codeVerifier, redirectUri, installationId, deviceName, platform, appVersion]
      properties:
        code: { type: string }
        codeVerifier: { type: string, minLength: 43, maxLength: 256 }
        redirectUri:
          type: string
          enum: ['com.liammagnier.juno://auth/callback', 'juno://auth/callback']
          default: 'com.liammagnier.juno://auth/callback'
          description: New clients use the canonical reverse-DNS URI; the legacy URI remains allowlisted only for installed-client migration.
        installationId: { type: string, minLength: 16, maxLength: 200 }
        deviceName: { type: string, minLength: 1, maxLength: 120 }
        platform: { type: string, minLength: 1, maxLength: 40 }
        appVersion: { type: string, minLength: 1, maxLength: 40 }
    PasswordSignInRequest:
      type: object
      additionalProperties: false
      required: [email, password, installationId, deviceName, platform, appVersion]
      properties:
        email: { type: string, format: email, maxLength: 320 }
        password: { type: string, minLength: 8, maxLength: 200 }
        installationId: { type: string, minLength: 16, maxLength: 200 }
        deviceName: { type: string, minLength: 1, maxLength: 120 }
        platform: { type: string, minLength: 1, maxLength: 40 }
        appVersion: { type: string, minLength: 1, maxLength: 40 }
        # Two-step verification. Optional and additive: an older client that
        # never sends it is unaffected unless its user has enrolled, in which
        # case the sign-in answers `mfa_required` (401) and the client must
        # collect a TOTP or recovery code and retry with this field. Sending a
        # code for an account without two-step is accepted and ignored.
        code: { type: string, minLength: 1, maxLength: 64 }
    RefreshResponse:
      type: object
      required: [tokenType, accessToken, accessTokenExpiresAt, refreshToken, refreshTokenExpiresAt]
      properties:
        tokenType: { const: Bearer }
        accessToken: { type: string }
        accessTokenExpiresAt: { type: string, format: date-time }
        refreshToken: { type: string }
        refreshTokenExpiresAt: { type: string, format: date-time }
    TokenResponse:
      allOf:
        - { $ref: '#/components/schemas/RefreshResponse' }
        - type: object
          required: [deviceSession]
          properties: { deviceSession: { $ref: '#/components/schemas/DeviceSession' } }
    DeviceSession:
      type: object
      required: [id, name, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        platform: { type: string }
        appVersion: { type: string }
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        revokedAt: { type: [string, 'null'], format: date-time }
        current: { type: boolean }
    SessionResponse:
      type: object
      required: [profile, deviceSession, accessTokenExpiresAt, contractVersion, minimumSupportedAppVersion]
      properties:
        profile:
          type: object
          required: [id, email]
          properties:
            id: { type: string }
            name: { type: [string, 'null'] }
            email: { type: string, format: email }
            image: { type: [string, 'null'] }
        deviceSession: { $ref: '#/components/schemas/DeviceSession' }
        accessTokenExpiresAt: { type: string, format: date-time }
        contractVersion: { type: string }
        minimumSupportedAppVersion: { type: string }
    ModelManifest:
      type: object
      description: >-
        Account-specific: `availability` is computed against the caller's plan,
        and the list order is the display order every Juno client renders
        verbatim — per lab: current models before superseded ones, newest
        release first, then most capable first within a release. `juno:auto` is
        included as a real, selectable entry whenever the account has at least
        one usable chat model.
      required: [manifestVersion, contractDigest, generatedAt, models]
      properties:
        manifestVersion: { type: string }
        contractDigest: { type: string }
        generatedAt: { type: string, format: date-time }
        models:
          type: array
          items:
            type: object
            required: [id, provider, displayName, description, highlights, lifecycle, modality, legacy, released, availability, minimumPlan, requiredPlan, modalities, contextWindowTokens, pricing, metrics, supportedReasoningEfforts, reasoning, capabilities]
            additionalProperties: true
            properties:
              modality:
                type: string
                enum: [chat, image, video]
                description: >-
                  What the model produces. Clients section the picker by this
                  (Chat · Image · Video). Only `chat` entries stream, so only
                  they are selectable in a chat composer.
              legacy:
                type: boolean
                description: >-
                  Superseded within its family. Clients collapse these behind an
                  "Older models" disclosure rather than interleaving them with
                  the current generation.
              released:
                type: [string, 'null']
                description: '"YYYY-MM", or null when the lab published no date.'
              retiresOn:
                type: [string, 'null']
                description: >-
                  The last day the provider serves this model, "YYYY-MM-DD", or
                  null when no retirement has been announced — which is most of
                  the catalog. A client should surface it on the model ("Available
                  until 23 Oct 2026") rather than only in `deprecationNote`,
                  whose text is prose and not parseable. The server stops listing
                  the model once the day has passed, so a client never has to
                  decide what an elapsed date means.
              availability:
                type: string
                enum: [available, coming_soon, requires_plan]
                description: >-
                  `requires_plan` means the model exists and streams but the
                  caller's plan cannot call it. A client must show it disabled
                  with `requiredPlan` as the reason, never as a selection.
              requiredPlan:
                type: string
                description: The plan the chat route actually enforces (paid models are Pro-floored).
              highlights:
                type: [array, 'null']
                items: { type: string }
                description: Product-authored bullets; non-null only for `juno:auto`.
              contextWindowTokens:
                type: [integer, 'null']
                description: Null for `juno:auto`, which has no single context window.
              pricing:
                type: [object, 'null']
                description: Null for `juno:auto`, which has no single price.
              metrics:
                type: [object, 'null']
                description: >-
                  The 1–10 grades the selectors' bars read from. Null for
                  `juno:auto` — it is a router, not one model. Clients must not
                  synthesize these values when null.
                required: [speed, intelligence]
                properties:
                  speed: { type: integer, minimum: 1, maximum: 10 }
                  intelligence: { type: integer, minimum: 1, maximum: 10 }
              reasoning:
                type: object
                required: [supported, canDisable, onOffOnly, automatic]
                properties:
                  supported: { type: boolean }
                  canDisable: { type: boolean }
                  onOffOnly: { type: boolean }
                  automatic:
                    type: boolean
                    description: >-
                      True only for `juno:auto`: the router chooses the thinking
                      depth per message, `supportedReasoningEfforts` is empty,
                      and a client must not send `reasoningEffort` with it.
    BootstrapResponse:
      type: object
      required: [profile, subscription, usage, settings, featureFlags, currentChangeCursor, compactionFloorCursor, modelManifestVersion, contractVersion, minimumClientVersions, announcements]
      additionalProperties: true
      properties:
        currentChangeCursor: { type: string }
        compactionFloorCursor: { type: string }
        modelManifestVersion: { type: string }
        chat:
          type: object
          description: >-
            Optional. The chat grammar features this server understands (the
            same names clients declare in `clientFeatures`). Absent on older
            servers, which speak only the frozen profile-1 grammar. Not a gate:
            chatBodySchema strips unknown request keys, so native clients always
            send their features and decode whichever grammar comes back.
          additionalProperties: true
          properties:
            clientFeatures:
              type: array
              items: { type: string, enum: [timeline, resume, research_background, suggest_research, citations] }
    AccountChange:
      type: object
      additionalProperties: false
      required: [cursor, entityType, entityId, parentEntityId, revision, operation, changedAt]
      properties:
        cursor: { type: string }
        entityType: { type: string }
        entityId: { type: string }
        parentEntityId: { type: [string, 'null'] }
        revision: { type: integer, minimum: 1 }
        operation: { type: string, enum: [upsert, delete] }
        changedAt: { type: string, format: date-time }
    ChangesResponse:
      type: object
      additionalProperties: false
      required: [after, changes, nextCursor, compactionFloorCursor, hasMore]
      properties:
        after: { type: string }
        changes: { type: array, items: { $ref: '#/components/schemas/AccountChange' } }
        nextCursor: { type: string }
        compactionFloorCursor: { type: string }
        hasMore: { type: boolean }
    MutationRequest:
      type: object
      additionalProperties: false
      required: [clientMutationId, baseRevision, operation]
      properties:
        clientMutationId: { type: string, format: uuid }
        baseRevision: { type: integer, minimum: 0 }
        operation:
          type: object
          description: >-
            Strict operation union implemented by the server. project.update accepts
            entityId plus optional name, instructions, starred and workDefaults
            fields. workDefaults is the Work bundle a task filed in the project
            inherits (target, preferredHostId, model, reasoningEffort, budget,
            permissionPolicy, connectorIds, grantIds, skillIds,
            allowKnowledgeWrites); like `config` below it REPLACES the stored
            object rather than patching it, an omitted key means "inherit", and
            every field is resolved against the acting account's own ceilings
            when a session is created — a project can narrow and never widen.
            project_workspace.upsert accepts projectId plus a whole `config` object
            (custom-assistant settings: personaName, instructionsOverride,
            allowedTools, allowedConnectorIds, knowledgeFileIds, preferredModelId).
            The config REPLACES the stored object rather than patching it, and an
            omitted key means "no opinion" — which is NOT the same as an empty
            array. Like settings.update it is keyed by the parent (projectId), so
            baseRevision 0 is the correct value for a workspace that does not exist
            on the server yet.
          required: [type]
          additionalProperties: true
          properties:
            type:
              type: string
              enum: [conversation.create, conversation.rename, conversation.update, conversation.archive, conversation.delete, folder.create, folder.rename, folder.delete, project.create, project.update, project.delete, project_workspace.upsert, project_workspace.delete, memory.create, memory.update, memory.delete, settings.update]
    AppendMessagesRequest:
      type: object
      additionalProperties: false
      required: [turns]
      properties:
        turns:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/AppendMessageTurn' }
    AppendMessageTurn:
      type: object
      additionalProperties: false
      required: [clientId, role, content]
      properties:
        clientId: { type: string, minLength: 8, maxLength: 64, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$' }
        role: { type: string, enum: [USER, ASSISTANT] }
        content: { type: string, minLength: 1 }
        createdAt: { type: string, format: date-time }
        model: { type: string, minLength: 1, maxLength: 200 }
        promptTokens: { type: integer, minimum: 0 }
        completionTokens: { type: integer, minimum: 0 }
    AppendMessagesResponse:
      type: object
      additionalProperties: false
      required: [conversationId, messages]
      properties:
        conversationId: { type: string }
        messages:
          type: array
          items: { $ref: '#/components/schemas/AppendedMessage' }
    AppendedMessage:
      type: object
      additionalProperties: false
      required: [clientId, id, role, content, model, promptTokens, completionTokens, createdAt, created]
      properties:
        clientId: { type: string }
        id: { type: string }
        role: { type: string, enum: [USER, ASSISTANT] }
        content: { type: string }
        model: { type: [string, 'null'] }
        promptTokens: { type: [integer, 'null'], minimum: 0 }
        completionTokens: { type: [integer, 'null'], minimum: 0 }
        createdAt: { type: string, format: date-time }
        created: { type: boolean }
    NativeChatGenerationRequest:
      type: object
      additionalProperties: false
      required: [conversationId, model, regenerate, generationId, client]
      properties:
        conversationId: { type: string }
        model: { type: string, minLength: 1, maxLength: 200 }
        regenerate: { const: true }
        reasoningEffort: { type: string, enum: [minimal, low, medium, high, xhigh, max] }
        generationId: { type: string, minLength: 8, maxLength: 120 }
        client: { const: app }
        deepResearch: { type: boolean, description: Research this message. Omitted when off. }
        webSearch: { type: boolean }
        canvasEnabled: { type: boolean, description: Legacy; the server default is on, so only false is sent. }
        connectors: { type: array, items: { type: string } }
        fastMode: { type: boolean }
        proMode: { type: boolean }
        regenerateInstruction: { type: string, minLength: 1, maxLength: 400 }
        workHandoff:
          type: boolean
          description: >-
            This client draws a task the model starts: the server may give the
            model `start_task`, and the stream then carries a `work` frame. Sent
            only as true, only on a saved chat, and only by an app that draws the
            task card (the Mac); omitted otherwise.
        clientFeatures:
          type: array
          description: >-
            The grammar this client renders. Lenient: unknown names are dropped
            and an older server strips the key. `timeline` opts into typed run
            records and round/phase keys; `resume` into resume frames;
            `research_background` into background research and the handoff
            frame; `suggest_research` into the "Research this" tool;
            `citations` into numbered [n] citations.
          items: { type: string, enum: [timeline, resume, research_background, suggest_research, citations] }
        timeZone: { type: string, maxLength: 64, description: IANA time zone. }
        locale: { type: string, maxLength: 35, description: BCP-47 UI locale. }
    ChatSource:
      type: object
      additionalProperties: true
      required: [title, url, snippet]
      properties:
        title: { type: string }
        url: { type: string, format: uri }
        snippet: { type: string }
        cited: { type: boolean }
        origin: { type: string, enum: [juno_search, juno_fetch, provider_search, provider_grounding, research] }
    ChatMessage:
      type: object
      additionalProperties: true
      required: [id, role, content, createdAt]
      properties:
        id: { type: string }
        role: { type: string, enum: [ASSISTANT] }
        content: { type: string }
        reasoning: { type: [string, 'null'] }
        model: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        sources: { type: array, items: { $ref: '#/components/schemas/ChatSource' } }
        finishReason: { type: [string, 'null'] }
    ChatSSEEvent:
      oneOf:
        - { $ref: '#/components/schemas/ChatMetaEvent' }
        - { $ref: '#/components/schemas/ChatTitleEvent' }
        - { $ref: '#/components/schemas/ChatActivityEvent' }
        - { $ref: '#/components/schemas/ChatApprovalEvent' }
        - { $ref: '#/components/schemas/ChatDeltaEvent' }
        - { $ref: '#/components/schemas/ChatReasoningEvent' }
        - { $ref: '#/components/schemas/ChatSourcesEvent' }
        - { $ref: '#/components/schemas/ChatProgressEvent' }
        - { $ref: '#/components/schemas/ChatResumeEvent' }
        - { $ref: '#/components/schemas/ChatHandoffEvent' }
        - { $ref: '#/components/schemas/ChatWorkEvent' }
        - { $ref: '#/components/schemas/ChatPingEvent' }
        - { $ref: '#/components/schemas/ChatDoneEvent' }
        - { $ref: '#/components/schemas/ChatErrorEvent' }
      discriminator: { propertyName: type }
    ChatTitleEvent:
      type: object
      additionalProperties: true
      required: [type, conversationId, title]
      properties:
        type: { const: title }
        conversationId: { type: string }
        title: { type: string }
    ChatApprovalEvent:
      type: object
      additionalProperties: true
      required: [type, approval]
      properties:
        type: { const: approval }
        approval: { type: object, additionalProperties: true }
    ChatProgressEvent:
      type: object
      additionalProperties: true
      required: [type]
      description: /api/generate only.
      properties:
        type: { const: progress }
        stage: { type: string }
        pct: { type: number }
    ChatResumeEvent:
      type: object
      additionalProperties: true
      required: [type]
      description: Sent only to clients that declared the `resume` feature.
      properties:
        type: { const: resume }
        available: { type: boolean }
        refetch: { type: boolean }
    ChatHandoffEvent:
      type: object
      additionalProperties: true
      required: [type, to, runId, userMessageId]
      description: >-
        Terminal. Sent only to clients that declared `research_background`: the
        chat request became a background research run, no `done` follows and
        no assistant row is written; follow the run at /api/research/{runId}.
      properties:
        type: { const: handoff }
        to: { const: research }
        runId: { type: string }
        userMessageId: { type: [string, 'null'] }
    ChatWorkEvent:
      type: object
      additionalProperties: true
      required: [type, session]
      description: >-
        Not terminal. Sent only to a request that carried `workHandoff: true`,
        at most once per generation, once a task the model started with
        `start_task` has left `draft`. The session is `serializeSession`'s; the
        client follows it through /api/work/sessions/{id}/events.
      properties:
        type: { const: work }
        session: { $ref: '#/components/schemas/WorkSession' }
    ChatMetaEvent:
      type: object
      additionalProperties: true
      required: [type, conversationId, userMessageId, title, generationId]
      properties:
        type: { const: meta }
        conversationId: { type: string }
        userMessageId: { type: [string, 'null'] }
        title: { type: string }
        titleSource: { type: string }
        generationId: { type: string }
        receiptState: { type: string }
    ChatActivityEvent:
      type: object
      additionalProperties: true
      required: [type, event]
      properties:
        type: { const: activity }
        event:
          type: object
          additionalProperties: true
          description: >-
            ClientActivityEvent. Always id, kind, title; the timeline grammar adds
            seq, round, call (ToolCallRecord, re-sent in place by callId, status
            one of queued awaiting_approval running succeeded failed denied
            expired cancelled), segment, commentary, fact and notice.
    ChatDeltaEvent:
      type: object
      additionalProperties: true
      required: [type, text]
      properties:
        type: { const: delta }
        text: { type: string }
        round: { type: integer, minimum: 0, description: Timeline grammar only. }
        phase: { type: string, enum: [commentary, answer], description: Timeline grammar only. }
    ChatReasoningEvent:
      type: object
      additionalProperties: true
      required: [type, text]
      properties:
        type: { const: reasoning }
        text: { type: string }
        part: { type: integer, minimum: 0 }
        round: { type: integer, minimum: 0, description: Timeline grammar only. }
    ChatSourcesEvent:
      type: object
      additionalProperties: false
      required: [type, sources]
      properties:
        type: { const: sources }
        sources: { type: array, items: { $ref: '#/components/schemas/ChatSource' } }
    ChatPingEvent:
      type: object
      additionalProperties: false
      required: [type]
      properties: { type: { const: ping } }
    ChatDoneEvent:
      type: object
      additionalProperties: true
      required: [type, message, finishReason]
      properties:
        type: { const: done }
        message: { $ref: '#/components/schemas/ChatMessage' }
        finishReason: { type: string }
        title: { type: string }
    ChatErrorEvent:
      type: object
      additionalProperties: true
      required: [type, message, finishReason]
      properties:
        type: { const: error }
        message: { type: string }
        finishReason: { type: string }
        conversationId: { type: string }
        userMessageId: { type: string }
        generationId: { type: string }
        receiptState: { type: string }
        failureCode: { type: string }
    ChatCancellationRequest:
      type: object
      additionalProperties: false
      required: [generationId]
      properties: { generationId: { type: string, minLength: 8, maxLength: 120 } }
    ChatCancellationResponse:
      type: object
      additionalProperties: false
      required: [ok, cancelled]
      properties:
        ok: { const: true }
        cancelled: { type: boolean }
    ChatReceiptResponse:
      type: object
      additionalProperties: false
      required: [conversationId, userMessageId, generationId, receiptState, finishReason, failureCode]
      properties:
        conversationId: { type: string }
        userMessageId: { type: string }
        generationId: { type: string }
        receiptState: { type: string, enum: [claimed, accepted, running, completed, failed] }
        finishReason: { type: [string, 'null'] }
        failureCode: { type: [string, 'null'] }
    LibraryAttachment:
      type: object
      additionalProperties: false
