      responses:
        '200': { description: The project's new summary., content: { application/json: { schema: { type: object, additionalProperties: true } } } }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
        '404': { $ref: '#/components/responses/GeneralRouteError' }
        '409': { $ref: '#/components/responses/GeneralRouteError' }
  /skills:
    get:
      servers: [{ url: /api }]
      operationId: getNativeSkillLibrary
