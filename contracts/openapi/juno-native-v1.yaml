    # -------------------------------------------------------------------------
    # Push and the inbox (src/lib/notify/types.ts). A push's own payload is not
    # an HTTP body and is not described here: beside `aps` it carries flat
    # string keys — `notificationId`, `path`, `kind` (work | agent) and, when
    # known, `agentId`, `conversationId`, `sessionId`, `runId` — under the
    # category JUNO_NEEDS_YOU or JUNO_UPDATE.
    # -------------------------------------------------------------------------
    ApnsDeviceRegistrationRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string, minLength: 10, maxLength: 512, description: 'The APNs device token as hex; spaces and angle brackets are stripped.' }
        platform: { type: string, enum: [ios, macos], default: ios }
        bundleId: { type: string, pattern: '^com\.liammagnier\.[A-Za-z0-9][A-Za-z0-9.-]{0,120}$', description: "The app's own bundle id, which is the APNs topic." }
        environment: { type: string, enum: [production, sandbox], default: production }
        notifyNeedsYou: { type: boolean, description: 'Approvals and questions a task is waiting on. Omitted keeps the current choice.' }
        notifyUpdates: { type: boolean, description: 'Everything else. Omitted keeps the current choice.' }
    ApnsDeviceRegistrationResponse:
      type: object
      required: [registered, devicePushToken]
      properties:
        registered: { const: true }
        devicePushToken:
          type: object
          required: [id, platform, environment, active, notifyNeedsYou, notifyUpdates, updatedAt]
          properties:
            id: { type: string }
            platform: { type: string, enum: [ios, macos] }
            environment: { type: string, enum: [production, sandbox] }
            active: { type: boolean }
            notifyNeedsYou: { type: boolean }
            notifyUpdates: { type: boolean }
            updatedAt: { type: string, format: date-time }
    ClientNotification:
      type: object
      required: [id, type, title, body, priority, sourceType, sourceId, actionable, href, agent, readAt, createdAt]
      properties:
        id: { type: string }
        type: { type: string }
        title: { type: string }
        body: { type: string }
        priority: { type: string, enum: [urgent, high, normal, low] }
        sourceType: { type: [string, 'null'] }
        sourceId: { type: [string, 'null'] }
        actionable: { type: boolean }
        href: { type: [string, 'null'], description: 'The relative in-app path it opens, e.g. /agents/{id}, /chat/{id} or /work/{id}.' }
        agent:
          oneOf:
            - type: 'null'
            - type: object
              required: [id, name, avatar]
              properties:
                id: { type: string }
                name: { type: string }
                avatar: { $ref: '#/components/schemas/AgentFace' }
        readAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    NotificationsPage:
      type: object
      required: [notifications, unreadCount, nextBefore]
      properties:
        notifications: { type: array, items: { $ref: '#/components/schemas/ClientNotification' } }
        unreadCount: { type: integer, minimum: 0 }
        nextBefore: { type: [string, 'null'], description: Pass back as `before` for the page before; null at the end. }
    NotificationsCount:
      type: object
      required: [unreadCount, urgent]
      properties:
        unreadCount: { type: integer, minimum: 0 }
        urgent: { type: boolean, description: Any unread notification is urgent or high. }
