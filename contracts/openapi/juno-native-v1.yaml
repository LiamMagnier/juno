                  themes: { type: array, items: { type: string } }
                  conversations: { type: integer, minimum: 0 }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
  /memory/backfill:
    get:
      servers: [{ url: /api }]
      operationId: getNativeMemoryBackfill
      description: How many past chats Juno has not learned from yet.
      responses:
        '200':
          description: The queue length.
          content: { application/json: { schema: { type: object, additionalProperties: true, properties: { remaining: { type: integer, minimum: 0 } } } } }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
    post:
      servers: [{ url: /api }]
      operationId: runNativeMemoryBackfill
      description: Reads two past chats per call; clients loop until `remaining` is 0 or nothing was processed.
      responses:
        '200':
          description: One batch.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  processedConversations: { type: integer, minimum: 0 }
                  created: { type: integer, minimum: 0 }
                  remaining: { type: integer, minimum: 0 }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
        '409': { $ref: '#/components/responses/GeneralRouteError' }
        '503': { $ref: '#/components/responses/GeneralRouteError' }
  /memory/import/preview:
    post:
      servers: [{ url: /api }]
      operationId: previewNativeMemoryImport
      description: Parses another assistant's pasted answer deterministically (never shown to a model) and annotates each candidate against what the account already has. Writes nothing.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [text], properties: { text: { type: string, maxLength: 60000 } } } } }
      responses:
        '200':
          description: Candidates to review.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  candidates:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      required: [content, status, selected]
                      properties:
                        content: { type: string }
                        category: { type: [string, 'null'] }
                        sensitive: { type: [string, 'null'] }
                        status: { type: string, enum: [new, known, forgotten, secret] }
                        selected: { type: boolean }
        '400': { $ref: '#/components/responses/GeneralRouteError' }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
  /memory/import:
    post:
      servers: [{ url: /api }]
      operationId: commitNativeMemoryImport
      description: Saves the facts the reader kept ticked.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [facts], properties: { facts: { type: array, items: { type: string } } } } } }
      responses:
        '200':
          description: What landed.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  created: { type: integer }
                  refreshed: { type: integer }
                  superseded: { type: integer }
                  rejected: { type: integer }
        '400': { $ref: '#/components/responses/GeneralRouteError' }
        '401': { $ref: '#/components/responses/GeneralRouteError' }
  /memory/consolidate:
    post:
      servers: [{ url: /api }]
      operationId: consolidateNativeMemory
