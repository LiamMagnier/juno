:root{
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  --serif:"Newsreader",ui-serif,Georgia,serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --sf:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;
  --slow:1;
  --dur-press:70ms;--dur-fast:120ms;--dur-exit:160ms;--dur-base:220ms;--dur-slow:360ms;
  --ease-out-soft:cubic-bezier(.33,1,.68,1);--ease-out-strong:cubic-bezier(.32,.72,0,1);
  --ease-in:cubic-bezier(.4,0,1,1);--ease-in-out:cubic-bezier(.65,0,.35,1);--ease-breathe:cubic-bezier(.45,0,.55,1);
  --spring-snap:linear(0,.006,.023,.048,.08,.116,.155,.196,.239,.282,.324,.366,.407,.446,.484,.521,.555,.588,.619,.648,.675,.701,.725,.747,.768,.787,.805,.821,.836,.85,.863,.875,.886,.896,.905,.914,.921,.928,.935,.941,.946,.951,.956,.96,.963,.967,.97,.973,.975,.978,.98,.982,.983,.985,.986,.988,.989,.99,.991,.992,.993,.993,.994,.995,1);
  --spring-snap-dur:256ms;
  --spring-standard:linear(0,.008,.031,.064,.104,.15,.199,.249,.301,.351,.401,.449,.495,.539,.58,.619,.655,.688,.719,.748,.774,.797,.819,.839,.856,.872,.887,.9,.912,.922,.931,.94,.947,.954,.96,.965,.969,.973,.977,.98,.983,.985,.987,.989,.991,.992,.993,.994,1);
  --spring-standard-dur:272ms;
  --board:#e7e8ea;--board-ink:#191b1e;--board-mute:#5f6268;--board-line:rgba(25,27,30,.1);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--board);color:var(--board-ink);font:400 14px/20px var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body[data-view="dark"]{--board:#0c0d0e;--board-ink:#e8e9eb;--board-mute:#95979c;--board-line:rgba(255,255,255,.09)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:default}
input,textarea{font:inherit;color:inherit}
svg.ic{display:block;flex:none;overflow:visible;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.tnum{font-variant-numeric:tabular-nums}

/* ---------------- board chrome ---------------- */
.board-head{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:16px;height:56px;padding:0 24px;background:color-mix(in srgb,var(--board) 88%,transparent);border-bottom:1px solid var(--board-line)}
.board-head .brand{display:flex;align-items:center;gap:10px;min-width:0}
.board-head .brand b{font:600 14px/20px var(--sans);white-space:nowrap}
.board-head .brand span{font:400 13px/18px var(--sans);color:var(--board-mute);white-space:nowrap}
.board-head nav{display:flex;gap:2px;margin-left:auto;margin-right:auto;overflow:auto;scrollbar-width:none}
.board-head nav a{font:500 13px/18px var(--sans);color:var(--board-mute);text-decoration:none;padding:6px 10px;border-radius:8px;white-space:nowrap}
.board-head nav a:hover{color:var(--board-ink);background:rgba(127,127,127,.12)}
.ctrls{display:flex;align-items:center;gap:8px;flex:none}
.bseg{display:flex;padding:2px;border-radius:8px;background:rgba(127,127,127,.14);height:32px}
.bseg button{height:28px;padding:0 10px;border-radius:6px;font:500 13px/18px var(--sans);color:var(--board-mute)}
.bseg button[aria-pressed="true"]{background:var(--board-key,#fff);color:#191b1e;box-shadow:0 .5px 1px rgba(0,0,0,.1),0 1px 3px rgba(0,0,0,.08)}
body[data-view="dark"] .bseg button[aria-pressed="true"]{background:#3c3e43;color:#e8e9eb}
.btog{height:32px;padding:0 10px 0 8px;border-radius:8px;display:flex;align-items:center;gap:8px;font:500 13px/18px var(--sans);color:var(--board-mute);background:rgba(127,127,127,.14)}
.btog i{width:26px;height:16px;border-radius:8px;background:rgba(127,127,127,.35);position:relative;transition:background-color 120ms}
.btog i::after{content:"";position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform calc(272ms * var(--slow)) var(--spring-standard)}
.btog[aria-pressed="true"]{color:var(--board-ink)}
.btog[aria-pressed="true"] i{background:#2d49c9}
.btog[aria-pressed="true"] i::after{transform:translateX(10px)}

main.board{max-width:1440px;margin:0 auto;padding:28px 24px 80px}
.intro{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;margin:8px 0 40px;align-items:end}
.intro h1{font:400 44px/52px var(--serif);letter-spacing:-.03em;margin:0 0 10px}
.intro p{margin:0;color:var(--board-mute);font-size:15px;line-height:24px;max-width:640px}
.intro ol{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:6px 20px;font-size:12.5px;line-height:18px;color:var(--board-mute)}
.intro ol li{display:flex;gap:8px}
.intro ol li b{color:var(--board-ink);font-weight:600;font-variant-numeric:tabular-nums;min-width:16px}

section.sec{margin:0 0 56px;scroll-margin-top:72px}
.sec-head{display:flex;align-items:flex-start;gap:14px;margin:0 0 16px}
.sec-head .k{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--board-ink);color:var(--board);font:600 13px/1 var(--sans)}
.sec-head h2{font:600 20px/28px var(--sans);letter-spacing:-.01em;margin:0}
.sec-head p{margin:2px 0 0;color:var(--board-mute);font-size:13.5px;line-height:20px;max-width:880px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.solo{display:block}
body[data-view="light"] .pair, body[data-view="dark"] .pair{grid-template-columns:1fr}
body[data-view="light"] .t-dark.panel, body[data-view="dark"] .t-light.panel{display:none}
.panel{position:relative;border-radius:20px;padding:28px;min-width:0;background:var(--bg);color:var(--fg);box-shadow:0 0 0 1px var(--panel-edge)}
.ptag{position:absolute;top:14px;right:16px;font:500 11px/16px var(--mono);letter-spacing:.02em;color:var(--mf);display:flex;align-items:center;gap:6px}
.ptag::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--fg);box-shadow:0 0 0 1px var(--hair)}
.sub{margin:0 0 32px}
.sub:last-child{margin-bottom:0}
.sub>h3{font:600 13px/18px var(--sans);margin:0 0 2px;color:var(--fg)}
.sub>.cap{font:400 12px/16px var(--sans);color:var(--mf);margin:0 0 14px;max-width:720px}
.note{font:400 11px/16px var(--mono);color:var(--mf);letter-spacing:.01em}
.note b{font-weight:600;color:var(--fg)}
.row-wrap{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.stack{display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.spec-cell{display:flex;flex-direction:column;gap:8px;min-width:0}
.stage{position:relative;border-radius:14px;background:var(--stage);box-shadow:inset 0 0 0 1px var(--hair);padding:20px;min-width:0}
.stage.tight{padding:14px}
.blbl{font:500 11px/16px var(--mono);color:var(--mf);letter-spacing:.02em}
hr.div{border:0;height:1px;background:var(--hair);margin:24px 0}

/* ---------------- theme tokens ---------------- */
.t-light{
  color-scheme:light;
  --bg:#fcfcfd;--sidebar:#f3f4f5;--card:#fff;--float:#fff;--modal:#fff;--stage:#f6f7f8;--panel-edge:rgba(25,27,30,.06);
  --fg:#191b1e;--mf:#686b70;--mof:#5f6268;--icon:#3d3f43;--ink3:#9a9da2;
  --hair:rgba(25,27,30,.10);--hair-hi:rgba(25,27,30,.16);--border:#dfe0e2;--input:#86898d;--ring:#191b1e;
  --hover:rgba(25,27,30,.05);--sel:rgba(25,27,30,.075);--press:rgba(25,27,30,.10);
  --sb-hover:#e8e9ea;--sb-sel:#e2e3e5;
  --primary:#191b1e;--primary-hover:#2e3135;--on-primary:#fff;--secondary:#eff0f1;
  --destructive:#b81e28;--destructive-ink:#b81e28;--destructive-hl:rgba(184,30,40,.10);
  --presence:#2d49c9;--signal:#d36317;--signal-ink:#b65116;--success:#1b7a3a;--attention:#8f5406;
  --key:#fff;--switch-off:#cbcdd1;--tooltip:#1f2125;--tooltip-fg:#fafafa;--tooltip-mute:#a9acb2;
  --scrim:rgba(18,20,23,.30);--grabber:rgba(25,27,30,.20);--user-bubble:#eff0f1;--field:#fff;
  --sh-raised:0 .5px 1px rgba(25,27,30,.10),0 1px 3px rgba(25,27,30,.08);
  --sh-float:0 1px 2px rgba(25,27,30,.05),0 8px 24px -6px rgba(25,27,30,.16);
  --sh-modal:0 2px 4px rgba(25,27,30,.05),0 24px 64px -16px rgba(25,27,30,.28);
  --sh-composer:0 1px 2px rgba(25,27,30,.04),0 6px 20px -8px rgba(25,27,30,.12);
  --sh-composer-focus:0 1px 2px rgba(25,27,30,.05),0 10px 28px -10px rgba(25,27,30,.18);
  --sh-tooltip:0 2px 8px -2px rgba(25,27,30,.24);
  --c-hair:rgba(25,27,30,.10);--c-hair-hover:rgba(25,27,30,.14);--c-hair-focus:rgba(25,27,30,.18);
}
.t-dark{
  color-scheme:dark;
  --bg:#18191b;--sidebar:#111213;--card:#222326;--float:#2a2c2f;--modal:#2f3135;--stage:#1d1e21;--panel-edge:rgba(255,255,255,.06);
  --fg:#e8e9eb;--mf:#95979c;--mof:#a6a8ad;--icon:#c4c6ca;--ink3:#64676c;
  --hair:rgba(255,255,255,.09);--hair-hi:rgba(255,255,255,.14);--border:#36373a;--input:#707276;--ring:#e8e9eb;
  --hover:rgba(255,255,255,.06);--sel:rgba(255,255,255,.085);--press:rgba(255,255,255,.11);
  --sb-hover:#1d1e1f;--sb-sel:#232427;
  --primary:#e6e8ea;--primary-hover:#d2d4d8;--on-primary:#191b1e;--secondary:#2d2e31;
  --destructive:#e35f67;--destructive-ink:#e56c74;--destructive-hl:rgba(227,95,103,.16);
  --presence:#97a6e6;--signal:#fbae6a;--signal-ink:#fbb478;--success:#74c68a;--attention:#e0b06a;
  --key:#3c3e43;--switch-off:#46484d;--tooltip:#3f4146;--tooltip-fg:#fafafa;--tooltip-mute:#b4b6bb;
  --scrim:rgba(0,0,0,.55);--grabber:rgba(255,255,255,.24);--user-bubble:#26272a;--field:#1f2023;
  --sh-raised:0 1px 2px rgba(0,0,0,.35);
  --sh-float:0 1px 2px rgba(0,0,0,.30),0 10px 24px -8px rgba(0,0,0,.45);
  --sh-modal:0 2px 6px rgba(0,0,0,.35),0 24px 56px -16px rgba(0,0,0,.60);
  --sh-composer:0 1px 2px rgba(0,0,0,.30),0 8px 24px -10px rgba(0,0,0,.50);
  --sh-composer-focus:0 1px 2px rgba(0,0,0,.35),0 12px 32px -10px rgba(0,0,0,.60);
  --sh-tooltip:0 0 0 1px rgba(255,255,255,.08),0 2px 8px rgba(0,0,0,.40);
  --c-hair:rgba(255,255,255,.09);--c-hair-hover:rgba(255,255,255,.12);--c-hair-focus:rgba(255,255,255,.16);
}
.t-light,.t-dark{color:var(--fg)}
.kbd-mode .q-row[data-hl]{box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--ring) 55%,transparent)}

/* ---------------- primitives ---------------- */
.hl-edge{border:1px solid var(--hair)}
@media (min-resolution:2dppx){.hl-edge{border-width:.5px;border-color:var(--hair-hi)}}

/* buttons */
.q-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;font:500 13px/18px var(--sans);white-space:nowrap;position:relative;
  transition:background-color calc(var(--dur-fast)*var(--slow)) var(--ease-out-soft),color calc(var(--dur-fast)*var(--slow)) var(--ease-out-soft),transform calc(var(--dur-press)*var(--slow)) var(--ease-out-soft)}
.q-btn:hover{transition:background-color 0ms,transform calc(var(--dur-press)*var(--slow)) var(--ease-out-soft)}
.q-btn:active{transform:scale(.97)}
.q-btn.sm{height:28px;padding:0 10px}
.q-btn.lg{height:36px;padding:0 14px;font-size:14px;line-height:20px;gap:8px}
.q-btn.xl{height:44px;padding:0 16px;font-size:16px;line-height:22px;border-radius:12px;gap:8px}
.q-btn.primary{background:var(--primary);color:var(--on-primary)}
.q-btn.primary:hover,.q-btn.primary.is-hover{background:var(--primary-hover)}
.q-btn.secondary{background:var(--sel);color:var(--fg)}
.q-btn.secondary:hover,.q-btn.secondary.is-hover{background:var(--press)}
.q-btn.ghost{color:var(--fg)}
.q-btn.ghost:hover,.q-btn.ghost.is-hover{background:var(--hover)}
.q-btn.ghost:active,.q-btn.ghost.is-press{background:var(--press)}
.q-btn.danger{background:var(--destructive);color:#fff}
.t-dark .q-btn.danger{color:#1b0b0c}
.q-btn.danger:hover{filter:none;background:color-mix(in srgb,var(--destructive) 90%,#000)}
.q-btn.link{height:auto;padding:0;color:var(--fg);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--hair-hi)}
.q-btn[disabled],.is-disabled{opacity:.5;pointer-events:none}
.q-btn.is-press{transform:scale(.97)}
.q-btn .spin{position:absolute;inset:0;margin:auto}
.q-btn.loading .t{opacity:0}
.focus-ring{outline:2px solid var(--ring);outline-offset:2px}

/* icon buttons */
.q-ib{width:32px;height:32px;border-radius:8px;display:inline-grid;place-items:center;color:var(--icon);position:relative;flex:none;
  transition:background-color calc(var(--dur-fast)*var(--slow)) var(--ease-out-soft),transform calc(var(--dur-press)*var(--slow)) var(--ease-out-soft)}
.q-ib:hover,.q-ib.is-hover{background:var(--hover);color:var(--fg);transition:background-color 0ms,transform calc(var(--dur-press)*var(--slow)) var(--ease-out-soft)}
.q-ib:active{transform:scale(.97)}
.q-ib.is-press{background:var(--press);transform:scale(.97)}
.q-ib[aria-pressed="true"],.q-ib[aria-expanded="true"]{background:var(--sel);color:var(--fg)}
.q-ib.xs{width:24px;height:24px;border-radius:6px}
.q-ib.sm{width:28px;height:28px}
.q-ib.lg{width:36px;height:36px;border-radius:50%}
.q-ib.round{border-radius:50%}
.q-close{width:28px;height:28px;border-radius:50%;display:inline-grid;place-items:center;background:var(--hover);color:var(--icon);flex:none;transition:background-color calc(var(--dur-fast)*var(--slow)) var(--ease-out-soft)}
.q-close:hover{background:var(--sel);color:var(--fg);transition:background-color 0ms}

/* segmented */
.q-seg{display:inline-flex;position:relative;height:32px;padding:2px;border-radius:8px;background:var(--hover);isolation:isolate}
.q-seg.sm{height:28px}
.q-seg.full{display:flex;width:100%}
.q-seg .thumb{position:absolute;top:2px;bottom:2px;left:0;border-radius:6px;background:var(--key);box-shadow:var(--sh-raised);z-index:-1;transition:transform calc(var(--spring-standard-dur)*var(--slow)) var(--spring-standard),width calc(var(--spring-standard-dur)*var(--slow)) var(--spring-standard)}
.q-seg button{flex:1;min-width:64px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;border-radius:6px;font:500 13px/18px var(--sans);color:var(--mf);transition:color calc(var(--dur-fast)*var(--slow)) var(--ease-out-soft)}
.q-seg button[aria-selected="true"]{color:var(--fg)}
.q-seg button .c{font:500 12px/16px var(--sans);font-variant-numeric:tabular-nums;color:var(--mf)}

/* switch */
.q-sw{width:36px;height:20px;border-radius:10px;padding:2px;background:var(--switch-off);position:relative;flex:none;transition:background-color calc(var(--dur-fast)*var(--slow)) var(--ease-out-soft)}
.q-sw::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:8px;background:#fff;box-shadow:0 .5px 1px rgba(0,0,0,.16),0 1px 3px rgba(0,0,0,.12);
  transition:transform calc(var(--spring-standard-dur)*var(--slow)) var(--spring-standard),width calc(var(--dur-fast)*var(--slow)) var(--ease-out-soft),background-color calc(var(--dur-fast)*var(--slow)) var(--ease-out-soft)}
.q-sw[aria-checked="true"]{background:var(--primary)}
.q-sw[aria-checked="true"]::after{transform:translateX(16px)}
.t-dark .q-sw[aria-checked="true"]::after{background:var(--on-primary);box-shadow:none}
.q-sw:active::after{width:19px}
.q-sw[aria-checked="true"]:active::after{transform:translateX(13px)}
/* checkbox / radio */
.q-cb{width:16px;height:16px;border-radius:4px;border:1px solid var(--input);background:var(--field);display:inline-grid;place-items:center;flex:none;color:var(--on-primary);transition:background-color calc(var(--dur-press)*var(--slow)) var(--ease-out-soft),border-color calc(var(--dur-press)*var(--slow))}
.q-cb[aria-checked="true"],.q-cb[aria-checked="mixed"]{background:var(--primary);border-color:var(--primary)}
.q-cb svg path{stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset calc(var(--dur-fast)*var(--slow)) var(--ease-out-soft)}
.q-cb[aria-checked="true"] svg path{stroke-dashoffset:0}
.q-cb .bar{width:8px;height:1.5px;border-radius:1px;background:currentColor}
.q-rd{width:16px;height:16px;border-radius:50%;border:1px solid var(--input);background:var(--field);display:inline-grid;place-items:center;flex:none}
.q-rd[aria-checked="true"]{background:var(--primary);border-color:var(--primary)}
.q-rd i{width:6px;height:6px;border-radius:50%;background:var(--on-primary);transform:scale(0);transition:transform calc(var(--spring-snap-dur)*var(--slow)) var(--spring-snap)}
.q-rd[aria-checked="true"] i{transform:scale(1)}
.choice{display:inline-flex;align-items:center;gap:8px;font:400 14px/20px var(--sans)}

/* inputs */
.q-field{display:flex;flex-direction:column;gap:6px;min-width:0}
.q-field>label{font:500 13px/18px var(--sans)}
.q-input{height:36px;border-radius:8px;border:1px solid var(--input);background:var(--field);padding:0 12px;font:400 14px/20px var(--sans);color:var(--fg);outline:none;width:100%;
  transition:border-color calc(var(--dur-fast)*var(--slow)) var(--ease-out-soft)}
.q-input::placeholder{color:var(--mf)}
.q-input:hover{border-color:color-mix(in srgb,var(--fg) 50%,var(--input))}
.q-input:focus,.q-input.is-focus{border-color:var(--fg)}
.q-input.is-kbd{border-color:var(--fg);outline:2px solid var(--ring);outline-offset:2px}
.q-input.invalid{border-color:var(--destructive)}
.q-hint{font:400 12px/16px var(--sans);color:var(--mf)}
.q-err{font:400 12px/16px var(--sans);color:var(--destructive-ink);display:flex;gap:6px;align-items:center}
textarea.q-input{height:auto;min-height:80px;padding:8px 12px;resize:vertical}
.q-search{position:relative;display:flex;align-items:center;height:32px;border-radius:8px;background:var(--hover);min-width:0;transition:background-color calc(var(--dur-fast)*var(--slow))}
.q-search .ic{position:absolute;left:10px;color:var(--mf)}
.q-search input{border:0;outline:0;background:transparent;height:100%;width:100%;padding:0 40px 0 34px;font:400 14px/20px var(--sans);color:var(--fg);border-radius:8px}
.q-search input::placeholder{color:var(--mf)}
.q-search:focus-within{background:var(--field);box-shadow:inset 0 0 0 1px var(--input)}
.q-search .kbd{position:absolute;right:6px}

/* chips / badges / kbd */
.q-chip{height:28px;padding:0 12px;border-radius:14px;display:inline-flex;align-items:center;gap:6px;font:500 13px/18px var(--sans);color:var(--mf);box-shadow:inset 0 0 0 1px var(--border);transition:background-color calc(var(--dur-fast)*var(--slow))}
.q-chip:hover{background:var(--hover)}
.q-chip[aria-pressed="true"]{box-shadow:none;background:var(--sel);color:var(--fg);padding-left:9px}
.q-pill{height:28px;padding:0 10px 0 8px;border-radius:14px;display:inline-flex;align-items:center;gap:6px;background:var(--sel);font:500 13px/18px var(--sans);color:var(--fg);flex:none;transition:background-color calc(var(--dur-fast)*var(--slow))}
.q-pill .ic{color:var(--icon)}
.q-pill:hover{background:var(--press)}
.q-badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;display:inline-grid;place-items:center;font:600 11px/18px var(--sans);font-variant-numeric:tabular-nums;background:var(--sel);color:var(--fg)}
.q-badge.signal{background:var(--signal);color:#fff}
.t-dark .q-badge.signal{color:#2a1505}
.q-status{height:22px;padding:0 8px 0 7px;border-radius:11px;display:inline-flex;align-items:center;gap:6px;background:var(--hover);font:500 12px/16px var(--sans);color:var(--fg)}
.q-status .dot{width:6px;height:6px;border-radius:50%}
.kbd{height:20px;min-width:20px;padding:0 5px;border-radius:6px;display:inline-grid;place-items:center;background:var(--hover);font:500 11px/16px var(--mono);letter-spacing:.02em;color:var(--mf)}

/* tabs */
.q-tabs{display:flex;gap:20px;position:relative;box-shadow:inset 0 -1px 0 var(--border);overflow-x:auto;scrollbar-width:none}
.q-tabs button{height:36px;font:500 14px/20px var(--sans);color:var(--mf);white-space:nowrap;transition:color calc(var(--dur-fast)*var(--slow))}
.q-tabs button:hover{color:var(--fg)}
.q-tabs button[aria-selected="true"]{color:var(--fg)}
.q-tabs .bar{position:absolute;bottom:0;left:0;height:2px;border-radius:1px;background:var(--fg);transition:transform calc(var(--spring-standard-dur)*var(--slow)) var(--spring-standard),width calc(var(--spring-standard-dur)*var(--slow)) var(--spring-standard)}

/* tooltip */
.q-tip{position:fixed;z-index:80;pointer-events:none;height:24px;padding:0 8px;border-radius:6px;background:var(--tooltip);color:var(--tooltip-fg);font:500 12px/24px var(--sans);white-space:nowrap;box-shadow:var(--sh-tooltip);display:flex;gap:8px}
.q-tip.static{position:relative;display:inline-flex}
.q-tip .sc{color:var(--tooltip-mute);font-variant-numeric:tabular-nums}

/* avatars */
.q-av{border-radius:50%;display:inline-grid;place-items:center;background:var(--sel);color:var(--mof);font-weight:500;position:relative;flex:none;overflow:hidden}
.q-av::after{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 0 .5px rgba(127,127,127,.35)}
.q-av.img{background:linear-gradient(135deg,#c9b8a6,#7d8a99 60%,#3f4a5a);color:#fff}
.avstack{display:flex}
.avstack .q-av{box-shadow:0 0 0 2px var(--bg)}
.avstack .q-av+.q-av{margin-left:-4px}

/* list rows */
.q-list{display:flex;flex-direction:column;gap:2px}
.q-li{display:flex;align-items:center;gap:8px;min-height:36px;padding:0 8px;border-radius:8px;color:var(--fg);font:400 14px/20px var(--sans);transition:background-color calc(var(--dur-fast)*var(--slow)) var(--ease-out-soft)}
.q-li:hover,.q-li.is-hover{background:var(--hover);transition:background-color 0ms}
.q-li.is-sel{background:var(--sel)}
.q-li .ic{color:var(--icon)}
.q-li .meta{margin-left:auto;font:400 12px/16px var(--sans);color:var(--mf);font-variant-numeric:tabular-nums}
.q-li.two{min-height:52px;padding:8px 12px;align-items:center}
.q-li.two .t{display:flex;flex-direction:column;min-width:0}
.q-li.two .t b{font-weight:500}
.q-li.two .t span{font:400 12px/16px var(--sans);color:var(--mf)}
.q-li.is-sel .t span,.q-li.is-hover .t span{color:var(--mof)}

/* cards */
.q-card{border-radius:12px;background:var(--card);box-shadow:inset 0 0 0 1px var(--border);padding:16px}
.q-card.int{transition:box-shadow calc(var(--dur-fast)*var(--slow)) var(--ease-out-soft)}
.q-card.int:hover,.q-card.int.is-hover{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--fg) 18%,transparent)}
.q-art{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 10px}
.q-art .tile{width:36px;height:36px;border-radius:8px;background:var(--hover);display:grid;place-items:center;color:var(--icon);flex:none}
.q-art .t{display:flex;flex-direction:column;min-width:0;flex:1}
.q-art .t b{font:500 14px/20px var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q-art .t span{font:400 12px/16px var(--sans);color:var(--mf)}

/* sidebar (web) */
.q-sidebar{width:260px;background:var(--sidebar);border-radius:14px;padding:6px 8px 8px;display:flex;flex-direction:column;gap:2px;flex:none;box-shadow:inset 0 0 0 1px var(--hair)}
.sb-head{height:44px;display:flex;align-items:center;padding:0 2px 0 8px;gap:4px}
.sb-logo{display:flex;align-items:center;gap:8px;font:600 15px/20px var(--sans);letter-spacing:-.01em;margin-right:auto}
.sb-logo .mark{width:18px;height:18px}
.sb-row{display:flex;align-items:center;gap:8px;height:32px;padding:0 8px;border-radius:8px;font:400 14px/20px var(--sans);color:var(--fg);position:relative;transition:background-color calc(var(--dur-fast)*var(--slow)) var(--ease-out-soft)}
.sb-row .ic{color:var(--icon)}
.sb-row:hover,.sb-row.is-hover{background:var(--sb-hover);transition:background-color 0ms}
.sb-row.is-sel{background:var(--sb-sel)}
.sb-row .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-row .trail{display:flex;align-items:center;justify-content:center;width:24px;height:24px;margin-right:-4px;color:var(--mf)}
.sb-row .kebab{display:none}
.sb-row:hover .kebab,.sb-row.is-hover .kebab,.sb-row .kebab[aria-expanded="true"]{display:inline-grid}
.sb-row:hover .sig,.sb-row.is-hover .sig{display:none}
.sb-sec{height:28px;display:flex;align-items:center;padding:0 8px;margin-top:10px;font:500 12px/16px var(--sans);color:var(--mf)}
.sb-sec .ic{margin-left:auto;opacity:0}
.sb-acct{display:flex;align-items:center;gap:10px;height:48px;padding:0 8px;border-radius:8px;margin-top:auto}
.sb-acct .n{display:flex;flex-direction:column;flex:1;min-width:0}
.sb-acct .n b{font:500 14px/20px var(--sans)}
.sb-acct .n span{font:400 12px/16px var(--sans);color:var(--mf)}
.dotp{width:6px;height:6px;border-radius:50%;background:var(--presence)}
.dots{width:6px;height:6px;border-radius:50%;background:var(--signal)}

/* skeleton, spinner, progress */
.q-skel{background:var(--hover);border-radius:6px;height:12px;animation:breathe calc(1.8s*var(--slow)) var(--ease-breathe) infinite alternate}
@keyframes breathe{from{opacity:1}to{opacity:.55}}
.q-spin{width:16px;height:16px;animation:spin calc(.8s*var(--slow)) linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.q-prog{height:4px;border-radius:2px;background:var(--sel);overflow:hidden;position:relative}
.q-prog i{position:absolute;inset:0;background:var(--fg);transform-origin:left;transform:scaleX(.42);border-radius:2px}
.q-prog.ind i{width:30%;transform:none;animation:ind calc(1.4s*var(--slow)) var(--ease-in-out) infinite}
@keyframes ind{from{transform:translateX(-100%)}to{transform:translateX(340%)}}
.rm .q-skel{animation:none;opacity:.8}
.rm .q-spin{animation:pulse calc(1.2s*var(--slow)) var(--ease-breathe) infinite alternate}
@keyframes pulse{from{opacity:1}to{opacity:.35}}

/* ---------------- menus ---------------- */
.q-menu{position:fixed;z-index:55;min-width:180px;width:240px;max-height:480px;padding:4px;border-radius:12px;background:var(--float);box-shadow:var(--sh-float);border:1px solid var(--hair);font:400 14px/20px var(--sans);color:var(--fg);outline:none;display:flex;flex-direction:column}
@media (min-resolution:2dppx){.q-menu{border-width:.5px;border-color:var(--hair-hi)}}
.q-menu.static{position:relative;z-index:auto}
.q-menu.w288{width:288px}.q-menu.w320{width:320px}
.q-menu .scroller{overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;min-height:0;display:flex;flex-direction:column}
.q-menu .scroller.fade-b{-webkit-mask-image:linear-gradient(#000 calc(100% - 12px),transparent);mask-image:linear-gradient(#000 calc(100% - 12px),transparent)}
.q-row{display:flex;align-items:center;gap:8px;min-height:32px;padding:0 8px;border-radius:8px;position:relative;flex:none;cursor:default;user-select:none;
  transition:background-color calc(var(--dur-fast)*var(--slow)) var(--ease-out-soft)}
.q-row[data-hl]{background:var(--sel);transition:background-color 0ms}
.q-row[data-press]{background:var(--press);transition:background-color calc(var(--dur-press)*var(--slow)) var(--ease-out-soft)}
.q-row>.ic{color:var(--icon);transition:color 0ms}
.q-row[data-hl]>.ic{color:var(--fg)}
.q-row .gut{width:16px;flex:none}
.q-row .l{flex:1;min-width:0;display:flex;flex-direction:column}
.q-row .l>span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q-row .d{font:400 12px/16px var(--sans);color:var(--mf)}
.q-row[data-hl] .d{color:var(--mof)}
.q-row.two{min-height:48px;padding-top:6px;padding-bottom:6px}
.q-row.two .l>span:first-child{font-weight:500}
.q-row .tr{margin-left:16px;flex:none;display:flex;align-items:center;gap:4px;color:var(--mf);font:400 12px/16px var(--sans);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.q-row .tr.val{font-size:13px;line-height:18px}
.q-row .tr .chev{margin-right:-2px}
.q-row .tr .chk{color:var(--fg)}
.q-row[aria-disabled="true"]{opacity:.5}
.q-row.danger,.q-row.danger>.ic{color:var(--destructive-ink)}
.q-row.danger[data-hl]{background:var(--destructive-hl)}
.q-row[data-open]{background:var(--sel)}
.q-sep{height:1px;background:var(--hair);margin:4px 8px;flex:none}
.q-mlabel{font:500 12px/16px var(--sans);color:var(--mf);padding:8px 8px 4px;flex:none}
.q-mlabel.first{padding-top:4px}
.q-msearch{display:flex;align-items:center;gap:8px;height:36px;padding:0 8px;margin:-4px -4px 4px;border-bottom:1px solid var(--hair);flex:none}
.q-msearch .ic{color:var(--mf);margin-left:4px}
.q-msearch input{border:0;outline:0;background:none;flex:1;min-width:0;font:400 14px/20px var(--sans);color:var(--fg);height:100%}
.q-msearch input::placeholder{color:var(--mf)}
.q-mempty{padding:8px 8px 10px;color:var(--mf);font:400 14px/20px var(--sans)}
.q-palette{width:600px;max-width:100%;border-radius:16px;background:var(--modal);box-shadow:var(--sh-modal);border:1px solid var(--hair);overflow:hidden;color:var(--fg)}
.q-palette .pf{display:flex;align-items:center;gap:12px;height:52px;padding:0 16px;border-bottom:1px solid var(--hair)}
.q-palette .pf .ic{color:var(--mf)}
.q-palette .pf input{flex:1;border:0;outline:0;background:none;font:400 16px/24px var(--sans);color:var(--fg);min-width:0}
.q-palette .pf input::placeholder{color:var(--mf)}
.q-palette .pl{padding:8px;max-height:420px;overflow:auto}
.q-palette .q-row{min-height:36px}
.q-palette .q-mlabel{padding:10px 8px 4px}
.q-palette .q-mlabel.first{padding-top:4px}

/* ---------------- pop-ups ---------------- */
.q-scrim{position:fixed;inset:0;background:var(--scrim);z-index:50}
.q-dialog{background:var(--modal);border-radius:16px;box-shadow:var(--sh-modal);border:1px solid var(--hair);color:var(--fg);display:grid;grid-template-rows:auto minmax(0,1fr) auto;max-height:calc(100dvh - 48px);width:520px;max-width:100%}
@media (min-resolution:2dppx){.q-dialog,.q-palette,.q-toast,.q-pop{border-width:.5px;border-color:var(--hair-hi)}}
.q-dialog.confirm{width:400px}
.q-dialog.live{position:fixed;left:50%;top:50%;translate:-50% -50%;z-index:51;max-width:calc(100vw - 32px)}
.dh{position:relative;padding:20px 60px 8px 24px}
.dh h4{margin:0;font:600 18px/24px var(--sans);letter-spacing:-.01em}
.dh p{margin:4px 0 0;font:400 14px/20px var(--sans);color:var(--mf)}
.dh .q-close{position:absolute;top:18px;right:18px}
.db{padding:8px 24px;overflow:auto;min-height:0}
.df{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:16px 24px 24px}
.df .start{margin-right:auto}
.q-pop{width:320px;border-radius:12px;background:var(--float);box-shadow:var(--sh-float);border:1px solid var(--hair);padding:12px;color:var(--fg)}
.q-toast{width:360px;max-width:100%;min-height:48px;border-radius:12px;background:var(--float);box-shadow:var(--sh-float);border:1px solid var(--hair);padding:12px 8px 12px 14px;display:flex;align-items:center;gap:10px;color:var(--fg);font:400 14px/20px var(--sans)}
.q-toast .ic.st{align-self:flex-start;margin-top:2px}
.q-toast .tx{flex:1;min-width:0}
.q-toast .tx span{display:block;font:400 13px/18px var(--sans);color:var(--mf)}
.toaster{position:relative;height:200px;display:flex;justify-content:center}
.toaster .q-toast{position:absolute;bottom:16px;transform-origin:50% 100%;transition:transform calc(var(--spring-standard-dur)*var(--slow)) var(--spring-standard),opacity calc(var(--dur-fast)*var(--slow)) var(--ease-out-soft)}
.q-banner{display:flex;align-items:center;gap:10px;height:40px;padding:0 6px 0 12px;border-radius:12px;background:color-mix(in srgb,var(--attention) 9%,transparent);font:400 13px/18px var(--sans);color:var(--fg)}
.q-banner .ic{color:var(--attention)}
.q-banner a{margin-left:auto;font-weight:500;color:var(--fg);text-decoration:none}
.q-alert{border-radius:12px;box-shadow:inset 0 0 0 1px var(--border);background:var(--card);padding:12px 14px;display:flex;gap:10px}
.q-alert .t b{display:block;font:500 14px/20px var(--sans)}
.q-alert .t span{display:block;font:400 13px/18px var(--sans);color:var(--mf)}
.q-empty{display:flex;flex-direction:column;align-items:center;text-align:center;max-width:360px;margin:0 auto;padding:12px 0}
.q-empty .well{width:48px;height:48px;border-radius:50%;background:var(--hover);display:grid;place-items:center;color:var(--icon);margin-bottom:14px}
.q-empty h5{font:400 22px/28px var(--serif);letter-spacing:-.01em;margin:0}
.q-empty p{margin:6px 0 16px;font:400 14px/20px var(--sans);color:var(--mf)}
/* bottom sheet */
.q-sheet{position:absolute;left:0;right:0;bottom:0;background:var(--modal);border-radius:16px 16px 0 0;box-shadow:var(--sh-modal);border:1px solid var(--hair);border-bottom:0;color:var(--fg);touch-action:none;display:flex;flex-direction:column}
.q-sheet .grab{height:20px;display:flex;justify-content:center;padding-top:6px;flex:none}
.q-sheet .grab i{width:36px;height:5px;border-radius:2.5px;background:var(--grabber)}
.q-sheet .sh{height:44px;display:flex;align-items:center;justify-content:center;position:relative;font:600 16px/24px var(--sans);flex:none}
.q-sheet .sh .q-close{position:absolute;right:14px;width:30px;height:30px}
.q-sheet .sc{padding:4px 12px 12px;overflow:auto}
.tiles3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 8px}
.tiles3 button{height:72px;border-radius:12px;background:var(--hover);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font:500 13px/18px var(--sans);color:var(--fg)}
.tiles3 button .ic{color:var(--icon)}
.srow{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 4px 0 6px;border-radius:12px;font:400 16px/22px var(--sans)}
.srow .ic{color:var(--icon)}
.srow .v{margin-left:auto;display:flex;align-items:center;gap:4px;color:var(--mf);font-size:15px}
.srow+.srow{box-shadow:0 -1px 0 0 var(--hair) inset;box-shadow:none}
.sgroup{border-radius:12px;background:var(--hover);padding:0 8px}
.sgroup .srow{border-radius:0;padding:0 2px}
.sgroup .srow+.srow{border-top:1px solid var(--hair)}

/* ---------------- composer ---------------- */
.q-comp{position:relative;border-radius:26px;background:var(--card);box-shadow:var(--sh-composer),inset 0 0 0 1px var(--c-hair);display:flex;flex-direction:column;
  transition:box-shadow calc(var(--dur-fast)*var(--slow)) var(--ease-out-soft)}
.q-comp:hover{box-shadow:var(--sh-composer),inset 0 0 0 1px var(--c-hair-hover)}
.q-comp.is-focus,.q-comp:focus-within{box-shadow:var(--sh-composer-focus),inset 0 0 0 1px var(--c-hair-focus)}
.q-comp .above{display:grid;grid-template-rows:0fr;transition:grid-template-rows calc(var(--spring-standard-dur)*var(--slow)) var(--spring-standard)}
.q-comp .above.open{grid-template-rows:1fr}
.q-comp .above>div{overflow:hidden;min-height:0}
.q-comp .atts{display:flex;flex-wrap:wrap;gap:8px;padding:12px 12px 0}
.q-comp .field{padding:16px 20px 4px;font:400 16px/24px var(--sans);color:var(--fg);min-height:44px;letter-spacing:-.006em}
.q-comp .field .ph{color:var(--mf)}
.q-comp textarea.field{border:0;outline:0;background:none;resize:none;width:100%;display:block;overflow:hidden;height:44px;transition:height calc(var(--dur-fast)*var(--slow)) var(--ease-out-soft)}
.q-comp textarea.field::placeholder{color:var(--mf)}
.q-comp .crow{display:flex;align-items:center;gap:4px;height:48px;padding:4px 8px 8px}
.q-comp .crow .sp{flex:1}
.q-comp .crow .pills{display:flex;gap:6px;margin-left:4px;min-width:0;overflow:hidden}
.cbtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--icon);flex:none;position:relative;
  transition:background-color calc(var(--dur-fast)*var(--slow)) var(--ease-out-soft),transform calc(var(--dur-press)*var(--slow)) var(--ease-out-soft)}
.cbtn:hover,.cbtn.is-hover{background:var(--hover);color:var(--fg);transition:background-color 0ms,transform calc(var(--dur-press)*var(--slow))}
.cbtn[aria-expanded="true"]{background:var(--sel);color:var(--fg)}
.cbtn:active{transform:scale(.97)}
.mchip{height:32px;padding:0 8px 0 12px;border-radius:16px;display:inline-flex;align-items:center;gap:4px;font:500 13px/18px var(--sans);color:var(--mf);flex:none;max-width:200px;
  transition:background-color calc(var(--dur-fast)*var(--slow)) var(--ease-out-soft),color calc(var(--dur-fast)*var(--slow))}
.mchip:hover,.mchip[aria-expanded="true"]{background:var(--hover);color:var(--fg);transition:background-color 0ms}
.mchip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.disc{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--primary);color:var(--on-primary);flex:none;position:relative;
  transition:background-color calc(var(--dur-fast)*var(--slow)) var(--ease-out-soft),transform calc(var(--dur-press)*var(--slow)) var(--ease-out-soft)}
.disc:hover{background:var(--primary-hover)}
.disc:active{transform:scale(.97)}
.disc.blocked{background:var(--secondary);color:var(--mf)}
.disc .face{grid-area:1/1;display:grid;place-items:center}
.disc{grid-template-areas:"a"}
.disc>*{grid-area:a}
.foot{text-align:center;font:400 12px/16px var(--sans);color:var(--mf);margin-top:8px}
.greet{font:400 48px/56px var(--serif);letter-spacing:-.03em;text-align:center;margin:0 0 28px;color:var(--fg)}
/* attachments */
.att{position:relative;flex:none;border-radius:14px}
.att.img{width:56px;height:56px;background:linear-gradient(140deg,#d8dee6 0%,#9fb0c4 45%,#55657a 100%)}
.att.img::before{content:"";position:absolute;left:10px;right:10px;bottom:9px;height:18px;border-radius:2px;background:linear-gradient(170deg,transparent 40%,rgba(255,255,255,.55) 41%,rgba(255,255,255,.35));clip-path:polygon(0 100%,30% 30%,55% 70%,75% 40%,100% 100%)}
.att.img::after{content:"";position:absolute;inset:0;border-radius:14px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.att.file{height:56px;width:220px;max-width:100%;background:var(--hover);display:flex;align-items:center;gap:0;padding-right:12px}
.att.file .g{width:40px;display:grid;place-items:center;color:var(--icon);flex:none;margin-left:4px}
.att.file .t{display:flex;flex-direction:column;min-width:0}
.att.file .t b{font:500 13px/18px var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.att.file .t span{font:400 12px/16px var(--sans);color:var(--mf)}
.att.err{box-shadow:inset 0 0 0 1px var(--destructive)}
.att.err .g{color:var(--destructive-ink)}
.att .rm{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;box-shadow:0 0 0 2px var(--card);opacity:0;transition:opacity calc(var(--dur-fast)*var(--slow)) var(--ease-out-soft)}
.att:hover .rm,.att:focus-within .rm,.att.show-rm .rm{opacity:1}
.att .veil{position:absolute;inset:0;border-radius:14px;background:color-mix(in srgb,var(--card) 60%,transparent);display:grid;place-items:center}
.retry{font:600 12px/16px var(--sans);color:var(--fg);text-decoration:underline;text-underline-offset:2px;text-decoration-color:var(--hair-hi)}
.q-comp.drag{box-shadow:var(--sh-composer);outline:1.5px dashed color-mix(in srgb,var(--fg) 45%,transparent);outline-offset:-1.5px}
.dropmsg{display:flex;align-items:center;justify-content:center;gap:8px;font:500 14px/20px var(--sans);color:var(--fg);height:44px;margin-top:6px}
.dropmsg .ic{color:var(--icon)}
/* transcript bits */
.tx-col{display:flex;flex-direction:column;gap:18px;font:400 16px/26px var(--sans)}
.ububble{white-space:pre-wrap;align-self:flex-end;max-width:85%;background:var(--user-bubble);border-radius:12px 12px 8px 12px;padding:10px 16px;font:400 16px/26px var(--sans)}
.answer{font:400 16px/26px var(--sans)}
.answer p{margin:0 0 10px}
.actbar{display:flex;gap:2px;margin-top:4px;margin-left:-6px}
.actbar .q-ib{color:var(--mf)}
.thinking{display:flex;align-items:center;gap:8px;font:500 14px/20px var(--sans);color:var(--mf)}

/* ---------------- phones & native ---------------- */
.fit{transform-origin:0 0}
.fitwrap{position:relative;overflow:hidden}
.phone{width:390px;height:844px;border-radius:56px;background:#0a0a0b;padding:10px;position:relative;flex:none;box-shadow:0 0 0 1.5px #2b2c2f,0 30px 60px -20px rgba(0,0,0,.4)}
.phone .scr{position:relative;width:370px;height:824px;border-radius:46px;overflow:hidden;background:var(--bg);color:var(--fg)}
.phone .island{position:absolute;top:11px;left:50%;width:120px;height:35px;margin-left:-60px;border-radius:20px;background:#000;z-index:30}
.phone .status{position:absolute;top:0;left:0;right:0;height:52px;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 40px;font:600 16px/20px var(--sf);z-index:29}
.phone .status .r{display:flex;gap:6px;align-items:center}
.phone .home{position:absolute;bottom:8px;left:50%;width:134px;height:5px;margin-left:-67px;border-radius:3px;background:var(--fg);z-index:30}
.phones{display:flex;gap:24px;flex-wrap:wrap}

/* Liquid Glass approximation (mockup only: backdrop-filter is allowed here and nowhere in product code) */
.lgl{position:relative;isolation:isolate;-webkit-backdrop-filter:blur(10px) saturate(1.8) brightness(1.04);backdrop-filter:blur(10px) saturate(1.8) brightness(1.04);
  background:linear-gradient(180deg,rgba(255,255,255,.60),rgba(255,255,255,.42));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.35),inset 0 0 0 .5px rgba(255,255,255,.6),0 0 0 .5px rgba(0,0,0,.10),0 6px 18px -6px rgba(0,0,0,.16),0 1px 2px rgba(0,0,0,.06)}
.lgl::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;z-index:-1;pointer-events:none;
  background:linear-gradient(140deg,rgba(255,255,255,.95),rgba(255,255,255,0) 28%,rgba(255,255,255,0) 70%,rgba(255,255,255,.7));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.lgl::after{content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;pointer-events:none;background:radial-gradient(120% 70% at 20% 0%,rgba(255,255,255,.35),transparent 60%)}
.t-dark .lgl{background:linear-gradient(180deg,rgba(58,60,66,.58),rgba(36,38,42,.52));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.16),inset 0 -1px 0 rgba(255,255,255,.04),inset 0 0 0 .5px rgba(255,255,255,.12),0 0 0 .5px rgba(0,0,0,.6),0 8px 24px -8px rgba(0,0,0,.6)}
.t-dark .lgl::before{background:linear-gradient(140deg,rgba(255,255,255,.32),rgba(255,255,255,0) 30%,rgba(255,255,255,0) 70%,rgba(255,255,255,.14))}
.t-dark .lgl::after{background:radial-gradient(120% 70% at 20% 0%,rgba(255,255,255,.07),transparent 60%)}
.lgl.card-tint{background:linear-gradient(180deg,rgba(255,255,255,.80),rgba(255,255,255,.66))}
.t-dark .lgl.card-tint{background:linear-gradient(180deg,rgba(46,48,52,.80),rgba(34,35,38,.72))}
.lgl.ink{background:linear-gradient(180deg,#2c2f33,#15171a);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(255,255,255,.06),0 2px 6px -1px rgba(0,0,0,.3)}
.t-dark .lgl.ink{background:linear-gradient(180deg,#f4f5f6,#d9dbde);color:#15171a;box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 2px 6px -1px rgba(0,0,0,.5)}
.lgl.ink::before,.lgl.ink::after{display:none}

/* mac window */
.mac{width:1200px;height:760px;border-radius:26px;position:relative;overflow:hidden;background:var(--bg);color:var(--fg);font-family:var(--sf);
  box-shadow:0 0 0 .5px rgba(0,0,0,.25),0 0 0 1px rgba(255,255,255,.08) inset,0 40px 80px -24px rgba(0,0,0,.35),0 10px 24px -8px rgba(0,0,0,.18)}
.t-dark .mac{box-shadow:0 0 0 .5px rgba(255,255,255,.18),0 40px 80px -24px rgba(0,0,0,.8)}
.mac .side{position:absolute;left:8px;top:8px;bottom:8px;width:256px;border-radius:18px;padding:12px 8px 8px;display:flex;flex-direction:column;z-index:5}
.mac .side.lgl{background:linear-gradient(180deg,rgba(243,244,245,.78),rgba(238,239,241,.70))}
.t-dark .mac .side.lgl{background:linear-gradient(180deg,rgba(38,39,42,.80),rgba(30,31,34,.76))}
.tl{display:flex;gap:8px;padding:6px 8px}
.tl i{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.15)}
.mac .content{position:absolute;inset:0;left:272px;overflow:hidden}
.mac .tb{position:absolute;top:0;left:272px;right:0;height:60px;display:flex;align-items:center;gap:10px;padding:0 14px 0 18px;z-index:6}
.mac .tb .ttl{display:flex;flex-direction:column;line-height:1.15;margin-right:auto;min-width:0}
.mac .tb .ttl b{font:600 15px/18px var(--sf);white-space:nowrap}
.mac .tb .ttl span{font:400 12px/16px var(--sf);color:var(--mf)}
.tbgroup{height:36px;border-radius:18px;display:flex;align-items:center;padding:0 4px}
.tbgroup .tbb{width:36px;height:28px;display:grid;place-items:center;color:var(--fg);border-radius:14px}
.tbgroup .sepv{width:1px;height:16px;background:rgba(127,127,127,.25)}
.edge-hard{position:absolute;left:0;right:0;top:0;height:64px;background:linear-gradient(var(--bg) 0,var(--bg) 46px,transparent);z-index:4;pointer-events:none}

const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
function rowHTML(it, hasIcons, idx, st={}){
  const cls=['q-row']; if(it.desc) cls.push('two'); if(it.danger) cls.push('danger');
  const attrs=[`role="${it.radio?'menuitemradio':it.toggle?'menuitemcheckbox':'menuitem'}"`, `data-i="${idx}"`, 'tabindex="-1"'];
  if(it.radio||it.toggle) attrs.push(`aria-checked="${!!it.check}"`);
  if(it.disabled) attrs.push('aria-disabled="true"');
  if(st.hl) attrs.push('data-hl=""'); if(st.press) attrs.push('data-press=""'); if(st.open) attrs.push('data-open=""');
  const lead = hasIcons ? (it.icon? I(it.icon,16) : '<span class="gut"></span>') : '';
  let tr='';
  if(it.sub) tr = `<span class="tr${it.value?' val':''}">${it.value?esc(it.value):''}${I('chevron-right',14,{cls:'chev'})}</span>`;
  else if(it.radio||it.toggle) tr = `<span class="tr"><span class="chk" style="opacity:${it.check?1:0}">${I('check',16)}</span></span>`;
  else if(it.sc && !st.ctx) tr = `<span class="tr">${esc(it.sc)}</span>`;
  const l = it.desc ? `<span class="l"><span>${esc(it.label)}</span><span class="d">${esc(it.desc)}</span></span>` : `<span class="l"><span>${esc(it.label)}</span></span>`;
  return `<div class="${cls.join(' ')}" ${attrs.join(' ')}>${lead}${l}${tr}</div>`;
}
function menuInner(spec, st={}){
  let html=''; let idx=0; const flat=[];
  if(spec.search) html += `<div class="q-msearch">${I('search',16)}<input placeholder="${esc(spec.search)}" aria-label="${esc(spec.search)}"${st.query?` value="${esc(st.query)}"`:''}></div>`;
  html += `<div class="scroller">`;
  spec.groups.forEach((g,gi)=>{
    if(gi>0) html += `<div class="q-sep" role="separator"></div>`;
    if(g.label) html += `<div class="q-mlabel${gi===0&&!spec.search?' first':''}">${esc(g.label)}</div>`;
    const hasIcons = g.items.some(i=>i.icon);
    g.items.forEach(it=>{ const s={...(st.rows&&st.rows[idx]||{}), ctx:spec.ctx}; html += rowHTML(it,hasIcons,idx,s); flat.push(it); idx++; });
  });
  html += `</div>`;
  return {html, flat};
}
function staticMenu(name, st={}, extra=''){

}

  toast: () => `<div class="toaster" style="position:absolute;inset:0;height:auto">${['Saved to Library', 'Memory updated', 'Chat deleted'].map((t, i) => `<div class="q-toast" style="width:220px;transform:translateY(${-8 * (2 - i)}px) scale(${1 - .04 * (2 - i)});z-index:${i}">${I(i === 1 ? 'info' : 'check-circle', 16, { cls: 'st', style: `color:var(${i === 1 ? '--mf' : '--success'})` })}<span class="tx">${t}</span></div>`).join('')}</div>`,
  tooltip: () => `<button class="q-ib sm is-hover" style="position:absolute;left:50%;bottom:24px;margin-left:-14px;background:var(--hover)">${I('copy', 16)}</button><div class="q-tip static" style="position:absolute;left:50%;bottom:58px;translate:-50% 0">Copy<span class="sc">⌘C</span></div>`,
  send: () => `<div style="position:absolute;left:12px;bottom:12px;width:125%;transform:scale(.8);transform-origin:left bottom">${composerHTML({ face: 'stop', model: 'Auto' })}</div>`,
  attach: () => `<div style="position:absolute;left:12px;bottom:12px;width:125%;transform:scale(.8);transform-origin:left bottom">${composerHTML({ model: 'Auto', atts: [{ kind: 'img', name: 'cover.png' }, { kind: 'file', name: 'Q3 board memo.pdf', meta: 'PDF · 1.2 MB' }] })}</div>`,
};
function posterAll() { document.querySelectorAll('[data-lab]').forEach(c => { const st = c.querySelector('.lab-stage'); if (!st._busy) st.innerHTML = POSTER[c.dataset.lab](); }); }
document.addEventListener('click', async e => { const b = e.target.closest('[data-replay]'); if (!b) return; const cell = b.closest('.cell'); const st = cell.querySelector('.lab-stage'); if (st._busy) return; st._busy = true; try { await LAB[b.dataset.replay](st); await wait(700); } finally { st._busy = false; st.innerHTML = POSTER[b.dataset.replay](); } });

/* ============ fit scaling ============ */
function fitAll() { document.querySelectorAll('[data-fit]').forEach(w => { const f = w.firstElementChild; const nat = +w.dataset.fit; const avail = w.clientWidth; const k = Math.min(1, avail / nat); f.style.transform = k < 1 ? `scale(${k})` : ''; w.style.height = (f.offsetHeight * k) + 'px'; if (k >= 1) f.style.margin = '0 auto'; }); }

/* ============ header controls ============ */
function header() {
  const h = document.querySelector('.board-head');
  h.addEventListener('click', e => {
    const v = e.target.closest('[data-view]'); if (v) { S.view = v.dataset.view; document.body.dataset.view = S.view; h.querySelectorAll('[data-view]').forEach(b => b.setAttribute('aria-pressed', b === v)); requestAnimationFrame(() => { fitAll(); initThumbs(); }); }
    const s = e.target.closest('[data-slow]'); if (s) { S.slow = S.slow === 1 ? 4 : 1; document.documentElement.style.setProperty('--slow', S.slow); s.setAttribute('aria-pressed', S.slow === 4); }
    const r = e.target.closest('[data-rm]'); if (r) { S.rm = S.rm === 'on' ? 'off' : 'on'; r.setAttribute('aria-pressed', S.rm === 'on'); applyRM(); }
  });
}
function applyRM() { document.documentElement.classList.toggle('rm', isRM()); }
mq.addEventListener('change', applyRM);
function initThumbs() { document.querySelectorAll('[data-seg]').forEach(segInit); document.querySelectorAll('[data-tabs]').forEach(tabInit); }

/* ============ boot ============ */
build(); header(); applyRM();
const params = new URLSearchParams(location.search);
if (params.get('view')) { const b = document.querySelector(`[data-view="${params.get('view')}"]`); b && b.click(); }
document.fonts.ready.then(() => { initThumbs(); fitAll(); });
initThumbs(); fitAll(); posterAll();
document.querySelectorAll('.q-comp[data-live]').forEach(liveComposer);
document.querySelectorAll('.phone .scr').forEach(wirePhone);
window.__QN = { openMenu, closeAll, openDialog, pushToast, openPalette, LAB, S, MENUS };
</script>
</body>
</html>
